        function renderGraficosReportes(obrasBoleto, obrasEntrada) {
            if (!window.Chart) return;

            if (window.chartPctVentasInstance) window.chartPctVentasInstance.destroy();
            if (window.chartPctRegistradosInstance) window.chartPctRegistradosInstance.destroy();

            const canvasVentas = document.getElementById('chartPctVentas');
            if (canvasVentas && obrasBoleto.length > 0) {
                const datos = obrasBoleto.map(obra => {
                    const sala = getSala(obra.salaId);
                    const funciones = getFuncionesObra(obra.id);
                    const totalVentas = funciones.reduce((sum, f) => sum + (f.ventasAcumuladas || 0), 0);
                    const totalDisponible = funciones.reduce((sum, f) => sum + Math.max(0, (sala?.aforo || 0) - (f.cortesias || 0)), 0);
                    const pct = totalDisponible > 0 ? Math.round((totalVentas / totalDisponible) * 100) : 0;
                    return { nombre: obra.nombre, pct };
                }).sort((a, b) => b.pct - a.pct);

                window.chartPctVentasInstance = new Chart(canvasVentas, {
                    type: 'bar',
                    data: {
                        labels: datos.map(d => d.nombre),
                        datasets: [{
                            label: '% de venta',
                            data: datos.map(d => d.pct),
                            backgroundColor: datos.map(d => d.pct >= 70 ? '#22c55e' : d.pct >= 40 ? '#eab308' : '#ef4444'),
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true, ticks: { callback: v => v + '%' } } }
                    }
                });
            }

            const canvasRegistros = document.getElementById('chartPctRegistrados');
            if (canvasRegistros && obrasEntrada.length > 0) {
                const datos = obrasEntrada.map(obra => {
                    const sala = getSala(obra.salaId);
                    const funciones = getFuncionesObra(obra.id);
                    const totalRegistrados = funciones.reduce((sum, f) => sum + (f.registrados || 0), 0);
                    const aforoTotal = (sala?.aforo || 0) * funciones.length;
                    const pct = aforoTotal > 0 ? Math.round((totalRegistrados / aforoTotal) * 100) : 0;
                    return { nombre: obra.nombre, pct };
                }).sort((a, b) => b.pct - a.pct);

                window.chartPctRegistradosInstance = new Chart(canvasRegistros, {
                    type: 'bar',
                    data: {
                        labels: datos.map(d => d.nombre),
                        datasets: [{
                            label: '% de registrados',
                            data: datos.map(d => d.pct),
                            backgroundColor: '#8b5cf6',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true, ticks: { callback: v => v + '%' } } }
                    }
                });
            }
        }

        const REPORTE_ALTO_ROW = 96;
        const REPORTE_ALTO_MES = 56;
        const REPORTE_ALTO_HEADER = 80;
        const REPORTE_ANCHO = 1080;
        const REPORTE_ALTO_TOTAL = 1920;
        const REPORTE_PADDING = 20;

        const MESES_REPORTE = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        function construirMesesReporte() {
            const obrasActivas = appState.obras.filter(o => puedeVerObra(o) && !obraEstaFinalizada(o));
            const mesesMap = {};
            const ordenMeses = [];

            obrasActivas.forEach(obra => {
                const sala = getSala(obra.salaId);
                const funciones = getFuncionesObra(obra.id);

                funciones.forEach(f => {
                    const d = new Date(f.fecha + 'T00:00:00');
                    const mesKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                    const mesLabel = MESES_REPORTE[d.getMonth()] + ' ' + d.getFullYear();

                    let numerador, denominador, metricaColor;
                    if (obra.tipo === 'boleteria') {
                        numerador = f.ventasAcumuladas || 0;
                        denominador = Math.max(1, (sala?.aforo || 0) - (f.cortesias || 0));
                        metricaColor = '#2563eb';
                    } else {
                        numerador = f.registrados || 0;
                        denominador = sala?.aforo || 0;
                        metricaColor = '#7c3aed';
                    }

                    if (!mesesMap[mesKey]) {
                        mesesMap[mesKey] = { mesKey, mesLabel, boleteria: new Map(), entrada: new Map() };
                        ordenMeses.push(mesKey);
                    }
                    const bucket = obra.tipo === 'boleteria' ? mesesMap[mesKey].boleteria : mesesMap[mesKey].entrada;
                    if (!bucket.has(obra.id)) {
                        bucket.set(obra.id, {
                            obraId: obra.id,
                            icono: obra.tipo === 'boleteria' ? '💵' : '🎟️',
                            nombre: obra.nombre,
                            sala: sala?.nombre || '',
                            tipoObra: obra.tipo,
                            metricaColor,
                            funciones: []
                        });
                    }
                    bucket.get(obra.id).funciones.push({ fecha: f.fecha, hora: f.hora, numerador, denominador });
                });
            });

            const toArray = (map) => Array.from(map.values()).sort((a, b) =>
                (a.funciones[0].fecha + a.funciones[0].hora).localeCompare(b.funciones[0].fecha + b.funciones[0].hora)
            );

            return ordenMeses.slice().sort().map(k => ({
                mesKey: mesesMap[k].mesKey,
                mesLabel: mesesMap[k].mesLabel,
                boleteria: toArray(mesesMap[k].boleteria),
                entrada: toArray(mesesMap[k].entrada)
            }));
        }

        function truncarTexto(texto, maxChars) {
            if (!texto) return '';
            if (texto.length <= maxChars) return texto;
            return texto.slice(0, maxChars - 1).trim() + '…';
        }

        function estiloPctBadge(pct) {
            let bg;
            if (pct > 100) bg = '#166534';
            else if (pct >= 70) bg = '#4ADE80';
            else if (pct >= 40) bg = '#EAB308';
            else bg = '#DC2626';
            return 'background:' + bg + '; color:#ffffff; padding:2px 7px; border-radius:5px; display:inline-block; line-height:1.4;';
        }

        function esSalaLlena(tipoObra, pct) {
            return tipoObra === 'boleteria' && pct >= 100;
        }

        function formatearMetricaFuncion(tipoObra, numerador, denominador) {
            const pct = denominador > 0 ? Math.round((numerador / denominador) * 100) : 0;
            if (tipoObra === 'boleteria') {
                return { texto: numerador + '/' + denominador, valor: pct + '%', pct };
            }
            return { texto: numerador + '/' + denominador, valor: pct + '%', pct };
        }

        const REPORTE_ALTO_SUBTOTAL = 66;

        function alturaGrupoReporte(grupo) {
            // Cada función es SIEMPRE un renglón de la misma altura, sin importar
            // si la obra tiene 1 función o varias. Si tiene varias, se suma un
            // renglón extra para el subtotal.
            const filas = grupo.funciones.length;
            return (filas * REPORTE_ALTO_ROW) + (filas > 1 ? REPORTE_ALTO_SUBTOTAL : 0);
        }

        function alturaColumnaReporte(lista) {
            if (lista.length === 0) return 0;
            const sumaGrupos = lista.reduce((s, g) => s + alturaGrupoReporte(g), 0);
            return 70 + sumaGrupos; // 70 = encabezado columna con % del mes
        }

        function alturaMesBloque(mesBloque) {
            const altoCol = Math.max(alturaColumnaReporte(mesBloque.boleteria), alturaColumnaReporte(mesBloque.entrada));
            return REPORTE_ALTO_MES + altoCol;
        }

        // Llena la página 1 al máximo antes de pasar a la siguiente — no reparte
        // el contenido de forma pareja entre páginas.
        function paginarMeses(meses, disponiblePx) {
            if (meses.length === 0) return [[]];
            const paginas = [];
            let actual = [];
            let alturaAcumulada = 0;
            meses.forEach(mes => {
                const h = alturaMesBloque(mes);
                if ((alturaAcumulada + h) > disponiblePx && actual.length > 0) {
                    paginas.push(actual);
                    actual = [];
                    alturaAcumulada = 0;
                }
                actual.push(mes);
                alturaAcumulada += h;
            });
            if (actual.length > 0) paginas.push(actual);
            return paginas.length > 0 ? paginas : [[]];
        }

        function renderFilaUniformeHTML(icono, nombrePrincipal, sub, metricaTexto, metricaValor, pct, salaLlena, indentado) {
            let html = '<div style="display:flex; align-items:center; height:' + (REPORTE_ALTO_ROW - 2) + 'px; padding:0 4px 0 ' + (indentado ? '26px' : '4px') + '; border-bottom:1px solid #e5e7eb; box-sizing:border-box;">';
            html += '<div style="flex:1; min-width:0;">';
            html += '<div style="white-space:nowrap; font-size:23px; line-height:1.3; font-weight:normal; color:#111827;">' + (icono ? icono + ' ' : '') + truncarTexto(nombrePrincipal, 30) + '</div>';
            if (sub) html += '<div style="white-space:nowrap; color:#6b7280; font-size:14px; line-height:1.3; margin-top:2px;">' + truncarTexto(sub, 36) + '</div>';
            html += '</div>';
            html += '<div style="flex-shrink:0; text-align:right; margin-left:10px;">';
            html += '<div style="font-size:11px; color:#6b7280; white-space:nowrap; margin-bottom:4px;">' + metricaTexto + '</div>';
            html += '<div style="font-size:18px; font-weight:bold; white-space:nowrap; ' + estiloPctBadge(pct) + '">' + metricaValor + '</div>';
            html += '</div></div>';
            if (salaLlena) {
                html += '<div style="display:flex; justify-content:flex-end; padding:0 4px 8px ' + (indentado ? '26px' : '4px') + ';"><span style="' + estiloPctBadge(pct) + ' padding:3px 10px; font-size:12px; font-weight:bold;">🎉 SALA LLENA</span></div>';
            }
            return html;
        }

        function renderGrupoReporteHTML(grupo) {
            if (grupo.funciones.length === 1) {
                const f = grupo.funciones[0];
                const m = formatearMetricaFuncion(grupo.tipoObra, f.numerador, f.denominador);
                const sub = truncarTexto(grupo.sala, 16) + ' · ' + formatearFecha(f.fecha) + ' ' + f.hora;
                return renderFilaUniformeHTML(grupo.icono, grupo.nombre, sub, m.texto, m.valor, m.pct, esSalaLlena(grupo.tipoObra, m.pct), false);
            }

            // Obra con varias funciones: primer renglón con el nombre + su función,
            // renglones siguientes indentados solo con fecha/hora — todos del
            // mismo alto — y un renglón final de subtotal.
            let html = '';
            grupo.funciones.forEach((f, idx) => {
                const m = formatearMetricaFuncion(grupo.tipoObra, f.numerador, f.denominador);
                if (idx === 0) {
                    const sub = truncarTexto(grupo.sala, 16) + ' · ' + formatearFecha(f.fecha) + ' ' + f.hora;
                    html += renderFilaUniformeHTML(grupo.icono, grupo.nombre, sub, m.texto, m.valor, m.pct, false, false);
                } else {
                    html += renderFilaUniformeHTML(null, formatearFecha(f.fecha) + ' ' + f.hora, null, m.texto, m.valor, m.pct, false, true);
                }
            });
            const sumaNum = grupo.funciones.reduce((s, f) => s + f.numerador, 0);
            const sumaDen = grupo.funciones.reduce((s, f) => s + f.denominador, 0);
            const mTotal = formatearMetricaFuncion(grupo.tipoObra, sumaNum, sumaDen);
            const salaLlenaTotal = esSalaLlena(grupo.tipoObra, mTotal.pct);
            html += '<div style="display:flex; align-items:center; justify-content:flex-end; height:' + (REPORTE_ALTO_SUBTOTAL - 2) + 'px; padding:0 8px 0 26px; background:#f9fafb; border-bottom:2px solid #e5e7eb; box-sizing:border-box;">';
            html += '<div style="flex-shrink:0; display:flex; align-items:center; gap:8px;">';
            if (salaLlenaTotal) html += '<span style="' + estiloPctBadge(mTotal.pct) + ' padding:3px 10px; font-size:12px; font-weight:bold;">🎉 SALA LLENA</span>';
            html += '<div style="font-size:28px; font-weight:bold; white-space:nowrap; ' + estiloPctBadge(mTotal.pct) + '">' + mTotal.valor + '</div>';
            html += '</div></div>';
            return html;
        }

        function renderColumnaReporteHTML(lista, etiqueta) {
            if (lista.length === 0) return '<div style="min-width:0;"></div>';
            const sumaNum = lista.reduce((s, g) => s + g.funciones.reduce((s2, f) => s2 + f.numerador, 0), 0);
            const sumaDen = lista.reduce((s, g) => s + g.funciones.reduce((s2, f) => s2 + f.denominador, 0), 0);
            const pctMes = sumaDen > 0 ? Math.round((sumaNum / sumaDen) * 100) : 0;

            let html = '<div style="min-width:0; overflow:hidden;">';
            html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0 12px; border-bottom:2px solid #e5e7eb; margin-bottom:8px;">';
            html += '<span style="font-size:28px; font-weight:bold; color:#374151;">' + etiqueta + '</span>';
            html += '<span style="font-size:28px; font-weight:bold; ' + estiloPctBadge(pctMes) + '">' + pctMes + '%</span>';
            html += '</div>';
            lista.forEach(grupo => { html += renderGrupoReporteHTML(grupo); });
            html += '</div>';
            return html;
        }

        function renderMesBloqueHTML(mesBloque) {
            let html = '<div style="font-size:22px; font-weight:bold; color:#374151; background:#f3f4f6; padding:10px 12px; margin-top:8px; margin-bottom:8px; border-radius:6px;">📅 ' + mesBloque.mesLabel + '</div>';
            html += '<div style="display:grid; grid-template-columns:1fr 2px 1fr; gap:20px; align-items:start;">';
            html += renderColumnaReporteHTML(mesBloque.boleteria, '💵 Boletería');
            html += '<div style="background:#d1d5db; align-self:stretch;"></div>';
            html += renderColumnaReporteHTML(mesBloque.entrada, '🎟️ Entrada Libre');
            html += '</div>';
            return html;
        }

        function alturaRealPagina(paginaMeses) {
            const alturaContenido = paginaMeses.reduce((s, m) => s + alturaMesBloque(m), 0);
            const total = REPORTE_ALTO_HEADER + alturaContenido + (REPORTE_PADDING * 2) + 20;
            // Nunca recorta contenido: si un mes por sí solo necesita más espacio
            // del ideal (1920), la imagen crece en vez de cortar texto.
            return Math.max(400, total);
        }

        function renderPaginaReporteHTML(paginaMeses, numPagina, totalPaginas, altoPagina) {
            let html = '<div style="background:white; padding:' + REPORTE_PADDING + 'px; width:' + REPORTE_ANCHO + 'px; height:' + altoPagina + 'px; font-family: Arial, sans-serif; box-sizing:border-box; overflow:hidden;">';
            html += '<div style="display:table; width:100%; margin-bottom:10px; border-bottom:3px solid #1f2937; padding-bottom:8px;">';
            html += '<div style="display:table-cell; font-size:20px; font-weight:bold; color:#111827; vertical-align:bottom;">🎭 Salas Llenas — Avance</div>';
            html += '<div style="display:table-cell; text-align:right; vertical-align:bottom;">';
            html += '<div style="font-size:30px; font-weight:bold; color:#111827;">' + formatearFecha(new Date().toISOString().split('T')[0]) + '</div>';
            if (totalPaginas > 1) html += '<div style="font-size:11px; color:#9ca3af;">Página ' + numPagina + ' de ' + totalPaginas + '</div>';
            html += '</div></div>';
            paginaMeses.forEach(mes => { html += renderMesBloqueHTML(mes); });
            html += '</div>';
            return html;
        }

        function flatItemsDesdeMeses(meses) {
            const items = [];
            meses.forEach(mes => {
                items.push({ tipo: 'mes', label: mes.mesLabel });
                const agregarColumna = (lista, etiqueta) => {
                    if (lista.length === 0) return;
                    items.push({ tipo: 'subtipo', label: etiqueta });
                    lista.forEach(grupo => {
                        grupo.funciones.forEach(f => {
                            const m = formatearMetricaFuncion(grupo.tipoObra, f.numerador, f.denominador);
                            items.push({
                                tipo: 'funcion', icono: grupo.icono, nombre: grupo.nombre, sala: grupo.sala,
                                fecha: f.fecha, hora: f.hora, metricaTexto: m.texto, metricaValor: m.valor, metricaColor: grupo.metricaColor, metricaPct: m.pct
                            });
                        });
                    });
                };
                agregarColumna(mes.boleteria, '💵 Boletería');
                agregarColumna(mes.entrada, '🎟️ Entrada Libre');
            });
            return items;
        }

            html += '<div style="overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#6b7280; font-size:11px; margin-top:3px;">' + item.sala + ' · ' + formatearFecha(item.fecha) + ' ' + item.hora + '</div>';

        function renderReporteDiario() {
            let html = '<div class="min-h-screen bg-gray-50 md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-full mx-auto px-4 py-6">';

            html += '</div>';
            html += '<p class="text-xs text-gray-500 mb-4">Se generan una o más imágenes de 1080×1920 (según cuántas funciones haya), en dos columnas por mes: Boletería y Entrada Libre.</p>';

                html += '<p class="text-xs text-gray-500 mb-3">Descarga cada una por separado tocando su botón — el navegador del celular no permite descargar varias a la vez automáticamente.</p>';
                appState.reportePaginasGeneradas.forEach((pagina, idx) => {
                    html += '<div class="bg-white rounded shadow mb-4 p-3">';
                    html += '<img src="' + pagina.dataUrl + '" style="width:100%; border-radius:4px; border:1px solid #e5e7eb;" />';
                    html += '<a href="' + pagina.dataUrl + '" download="' + pagina.nombreArchivo + '" class="mt-2 block text-center bg-green-600 text-white py-2 rounded text-sm font-bold hover:bg-green-700">📥 Descargar imagen ' + (idx + 1) + ' de ' + appState.reportePaginasGeneradas.length + '</a>';
                    html += '</div>';
                });
                html += '</div>';
            }

            html += '</main></div>';
            return html;
        }

        async function descargarReportePNG() {
            if (!window.html2canvas) {
                alert('⚠️ No se pudo generar la imagen. Recarga la página e intenta de nuevo.');
                return;
            }

            const meses = construirMesesReporte();
            const totalFunciones = meses.reduce((s, m) => s + m.boleteria.length + m.entrada.length, 0);
            if (totalFunciones === 0) {
                alert('⚠️ No hay funciones activas para incluir en el reporte.');
                return;
            }

            const disponible = REPORTE_ALTO_TOTAL - (REPORTE_PADDING * 2) - REPORTE_ALTO_HEADER;
            const paginas = paginarMeses(meses, disponible);
            const fecha = new Date().toISOString().split('T')[0];

            const btn = document.querySelector('button[onclick="descargarReportePNG()"]');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Generando ' + paginas.length + ' imagen(es)...'; }

            const generadas = [];
            for (let i = 0; i < paginas.length; i++) {
                const altoPagina = alturaRealPagina(paginas[i]);
                const pagina = document.createElement('div');
                pagina.style.cssText = 'position:fixed; top:-99999px; left:-99999px;';
                pagina.innerHTML = renderPaginaReporteHTML(paginas[i], i + 1, paginas.length, altoPagina);
                document.body.appendChild(pagina);

                try {
                    const canvas = await html2canvas(pagina.firstElementChild, { backgroundColor: '#ffffff', scale: 2, width: REPORTE_ANCHO, height: altoPagina });
                    generadas.push({
                        dataUrl: canvas.toDataURL('image/png'),
                        nombreArchivo: 'reporte-avance-cna-' + fecha + (paginas.length > 1 ? '-parte' + (i + 1) : '') + '.png'
                    });
                } catch (err) {
                    console.error(err);
                    alert('⚠️ Error generando la imagen ' + (i + 1));
                } finally {
                    document.body.removeChild(pagina);
                }
            }

            if (btn) { btn.disabled = false; btn.textContent = '📥 Descargar PNG'; }

            // Los navegadores móviles bloquean descargas automáticas múltiples en
            // un mismo clic (solo dejan pasar la última). Por eso se muestran las
            // imágenes generadas con un botón de descarga individual cada una —
            // cada descarga real es un toque separado del usuario.
            appState.reportePaginasGeneradas = generadas;
            render();
            setTimeout(() => {
                const destino = document.getElementById('reportePaginasGeneradas');
                if (destino) destino.scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

                        + '<div style="background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 500px; max-height: 80vh; overflow: auto; box-shadow: 0 20px 25px rgba(0,0,0,0.15);">'
                        + '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">'
                        + '<h3 style="margin: 0; font-size: 16px; font-weight: bold;">🕐 Historial de la función' + (obraDeFuncion ? ' — ' + obraDeFuncion.nombre : '') + '</h3>'
                        + '<button onclick="cerrarHistorialFuncion()" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0;">×</button>'
                        + '</div>'
                        + contenido
                        + '</div>'
                        + '</div>';
                    app.innerHTML += modalHistorial;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('app').innerHTML = '<div class="min-h-screen flex items-center justify-center bg-gray-50"><p class="text-gray-500">Cargando datos...</p></div>';
            await initData();
            const savedUser = localStorage.getItem('boleteria-user');
            if (savedUser) appState.user = JSON.parse(savedUser);
            render();
        });
    </script>
</body>
</html>
