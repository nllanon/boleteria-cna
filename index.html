<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletería CNA - Sistema Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app"></div>

    <script>
        let appState = {
            user: null,
            obras: [],
            funciones: [],
            ventas: [],
            entrada_libre: [],
            salas: [],
            acciones: [],
            historial: [],
            currentPage: 'dashboard',
            editingObra: null,
            editingSala: null,
            editingFunciones: [],
            editingMultipleFunciones: false,
            viewingObraId: null
        };

        const USUARIOS = {
            'admin@test.com': { password: 'admin123', nombre: 'Administrador CNA', rol: 'admin' },
            'registrador.boleto@test.com': { password: '123456', nombre: 'Registrador Boletería', rol: 'registrador_boleto' },
            'registrador.entrada@test.com': { password: '123456', nombre: 'Registrador Entrada Libre', rol: 'registrador_entrada' },
            'visualizador@test.com': { password: '123456', nombre: 'Visualizador', rol: 'visualizador' }
        };

        function initData() {
            const saved = localStorage.getItem('boleteria-data');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(appState, data);
            } else {
                appState.salas = [
                    { id: '1', nombre: 'Sala Fanny Mikey', aforo: 222 },
                    { id: '2', nombre: 'Teatro Colón', aforo: 720 },
                    { id: '3', nombre: 'Sala Delia Zapata Olivella', aforo: 300 },
                    { id: '4', nombre: 'Auditorio Principal', aforo: 450 }
                ];

                appState.obras = [
                    { id: '1', nombre: 'De la Raíz al Viento', artista: 'Compañía Teatral', salaId: '1', tipo: 'boleteria', cortesias: 10, fechaTiquetera: '2026-08-10', fechaUltimaFuncion: '2026-08-20', fechaRedes: '2026-08-10', fechaPauta: '2026-08-15', piezasDesarrolladas: true, fechaPiezasDesarrolladas: '2026-08-05', videoDisponible: true, fechaVideoPatua: '2026-08-08' },
                    { id: '2', nombre: 'Louis: Michael Varekamp', artista: 'Músicos Clásicos', salaId: '2', tipo: 'boleteria', cortesias: 50, fechaTiquetera: '2026-08-05', fechaUltimaFuncion: '2026-08-21', fechaRedes: '2026-08-05', fechaPauta: '2026-08-12', piezasDesarrolladas: true, fechaPiezasDesarrolladas: '2026-08-02', videoDisponible: false, fechaVideoPatua: null },
                    { id: '3', nombre: 'Entrada Libre CNA', artista: 'Diversos', salaId: '3', tipo: 'entrada_libre', cortesias: 0, fechaTiquetera: '2026-08-14', fechaUltimaFuncion: '2026-08-22', fechaRedes: '2026-08-14', fechaPauta: null, piezasDesarrolladas: false, fechaPiezasDesarrolladas: null, videoDisponible: false, fechaVideoPatua: null }
                ];

                appState.funciones = [
                    { id: '1', obraId: '1', fecha: '2026-08-20', hora: '19:00', estado: 'programada' },
                    { id: '2', obraId: '2', fecha: '2026-08-21', hora: '20:00', estado: 'programada' },
                    { id: '3', obraId: '3', fecha: '2026-08-22', hora: '18:00', estado: 'programada' }
                ];

                appState.acciones = [];

                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('boleteria-data', JSON.stringify({
                obras: appState.obras,
                funciones: appState.funciones,
                ventas: appState.ventas,
                entrada_libre: appState.entrada_libre,
                salas: appState.salas,
                acciones: appState.acciones,
                historial: appState.historial
            }));
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const usuario = USUARIOS[email];
            if (usuario && usuario.password === password) {
                appState.user = { email, ...usuario };
                localStorage.setItem('boleteria-user', JSON.stringify(appState.user));
                render();
            } else {
                alert('Credenciales inválidas.');
            }
        }

        function handleLogout() {
            appState.user = null;
            appState.currentPage = 'dashboard';
            appState.viewingObraId = null;
            localStorage.removeItem('boleteria-user');
            render();
        }

        function tienePermiso(accion) {
            const rol = appState.user?.rol;
            const permisos = {
                'admin': ['ver_todo', 'crear_obra', 'editar_obra', 'registrar_venta', 'registrar_entrada', 'generar_reportes', 'editar_salas'],
                'registrador_boleto': ['crear_obra', 'editar_obra', 'registrar_venta', 'generar_reportes'],
                'registrador_entrada': ['crear_obra', 'editar_obra', 'registrar_entrada', 'generar_reportes'],
                'visualizador': ['ver_todo']
            };
            return permisos[rol]?.includes(accion) || false;
        }

        function puedeVerObra(obra) {
            const rol = appState.user?.rol;
            if (rol === 'admin' || rol === 'visualizador') return true;
            if (rol === 'registrador_boleto') return obra.tipo === 'boleteria';
            if (rol === 'registrador_entrada') return obra.tipo === 'entrada_libre';
            return false;
        }

        function getSala(salaId) {
            return appState.salas.find(s => s.id === salaId);
        }

        function calcularDiasDesde(fecha) {
            if (!fecha) return 0;
            const hoy = new Date('2026-08-16');
            const inicio = new Date(fecha);
            const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, diff);
        }

        function calcularDiasParaVender(fechaTiquetera, fechaUltimaFuncion) {
            if (!fechaTiquetera || !fechaUltimaFuncion) return 0;
            const inicio = new Date(fechaTiquetera);
            const fin = new Date(fechaUltimaFuncion);
            const diff = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, diff);
        }

        function getAccionesObra(obraId) {
            return appState.acciones.filter(a => a.obraId === obraId);
        }

        function getFuncionesObra(obraId) {
            return appState.funciones.filter(f => f.obraId === obraId).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        }

        function renderLogin() {
            let html = '<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-500 to-purple-600">';
            html += '<div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md">';
            html += '<h1 class="text-3xl font-bold mb-2 text-center text-gray-800">🎭 Boletería CNA</h1>';
            html += '<p class="text-center text-gray-500 text-sm mb-6">Sistema Integral de Monitoreo</p>';
            html += '<form onsubmit="handleLogin(event)">';
            html += '<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">Email</label>';
            html += '<input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@email.com" /></div>';
            html += '<div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>';
            html += '<input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" /></div>';
            html += '<button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Ingresar</button>';
            html += '</form>';
            html += '<div class="mt-6 p-3 bg-gray-100 rounded-lg text-xs text-gray-700">';
            html += '<strong>Prueba:</strong><br/>admin@test.com / admin123';
            html += '</div>';
            html += '</div></div>';
            return html;
        }

        function renderHeader() {
            let rolTexto = { admin: '👑 Admin', registrador_boleto: '💵 Reg.Boleto', registrador_entrada: '🎟️ Reg.Entrada', visualizador: '👁️ Visualizador' }[appState.user.rol];
            let html = '<header class="bg-white shadow"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">';
            html += '<div><h1 class="text-xl font-bold text-gray-800">🎭 Boletería CNA</h1>';
            html += '<p class="text-xs text-gray-500">' + rolTexto + '</p></div>';
            html += '<div class="flex items-center gap-3"><span class="text-xs text-gray-600">' + appState.user.email + '</span>';
            html += '<button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Salir</button></div></div></header>';
            return html;
        }

        function renderNav() {
            let items = [];
            if (appState.user.rol === 'admin') {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'salas', label: '🏛️ Salas' },
                    { id: 'ventas', label: '💵 Ventas' },
                    { id: 'entrada', label: '🎟️ Entrada' },
                    { id: 'calendario', label: '📅 Calendario' },
                    { id: 'reportes', label: '📈 Reportes' },
                    { id: 'historial', label: '📝 Historial' }
                ];
            } else if (appState.user.rol === 'registrador_boleto') {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'ventas', label: '💵 Ventas' },
                    { id: 'calendario', label: '📅 Calendario' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else if (appState.user.rol === 'registrador_entrada') {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'entrada', label: '🎟️ Entrada' },
                    { id: 'calendario', label: '📅 Calendario' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'calendario', label: '📅 Calendario' }
                ];
            }
            let html = '<div class="bg-white border-b"><div class="max-w-7xl mx-auto px-4 flex gap-2 py-3 overflow-x-auto">';
            items.forEach(page => {
                const active = appState.currentPage === page.id;
                html += '<button onclick="changePage(\'' + page.id + '\')" class="px-3 py-2 rounded text-sm font-medium whitespace-nowrap transition ' + (active ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100') + '">' + page.label + '</button>';
            });
            html += '</div></div>';
            return html;
        }

        function renderDashboard() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📊 Dashboard</h2>';

            let obrasFiltradas = appState.obras.filter(o => puedeVerObra(o));

            html += '<div class="grid grid-cols-4 gap-2 mb-6">';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Obras</p><p class="text-2xl font-bold text-blue-600">' + obrasFiltradas.length + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Ventas Registradas</p><p class="text-2xl font-bold text-green-600">' + appState.ventas.length + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Entrada Libre</p><p class="text-2xl font-bold text-purple-600">' + appState.entrada_libre.length + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Funciones</p><p class="text-2xl font-bold text-orange-600">' + appState.funciones.length + '</p></div>';
            html += '</div>';

            const obrasBoleto = obrasFiltradas.filter(o => o.tipo === 'boleteria');
            const obrasEntrada = obrasFiltradas.filter(o => o.tipo === 'entrada_libre');

            html += '<div class="grid grid-cols-2 gap-6">';

            if (obrasBoleto.length > 0) {
                html += '<div><h3 class="text-lg font-bold mb-3">💵 Obras con Boletería</h3>';
                html += '<div class="grid grid-cols-1 gap-3">';
                obrasBoleto.forEach(obra => {
                    const sala = getSala(obra.salaId);
                    const diasParaVender = calcularDiasParaVender(obra.fechaTiquetera, obra.fechaUltimaFuncion);
                    html += '<div class="bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg" onclick="viewObra(\'' + obra.id + '\')">';
                    html += '<h4 class="font-bold text-sm text-gray-800">' + obra.nombre + '</h4>';
                    html += '<p class="text-xs text-gray-600">' + obra.artista + ' | ' + sala?.nombre + '</p>';
                    html += '<div class="mt-2 text-xs"><strong>Para vender:</strong> ' + diasParaVender + ' días</div>';
                    html += '</div>';
                });
                html += '</div></div>';
            }

            if (obrasEntrada.length > 0) {
                html += '<div><h3 class="text-lg font-bold mb-3">🎟️ Obras con Entrada Libre</h3>';
                html += '<div class="grid grid-cols-1 gap-3">';
                obrasEntrada.forEach(obra => {
                    const sala = getSala(obra.salaId);
                    html += '<div class="bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg" onclick="viewObra(\'' + obra.id + '\')">';
                    html += '<h4 class="font-bold text-sm text-gray-800">' + obra.nombre + '</h4>';
                    html += '<p class="text-xs text-gray-600">' + obra.artista + ' | ' + sala?.nombre + '</p>';
                    html += '<div class="mt-2 text-xs"><strong>Aforo:</strong> ' + sala?.aforo + '</div>';
                    html += '</div>';
                });
                html += '</div></div>';
            }

            html += '</div></main></div>';
            return html;
        }

        function renderObras() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6">';

            if (tienePermiso('crear_obra')) {
                html += '<button onclick="openCrearObra()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 mb-4">+ Nueva Obra</button>';
            }

            let obrasFiltradas = appState.obras.filter(o => puedeVerObra(o));
            html += '<div class="bg-white rounded shadow overflow-hidden"><table class="w-full text-sm">';
            html += '<thead class="bg-gray-100"><tr><th class="px-4 py-2 text-left">Obra</th><th class="px-4 py-2 text-left">Tipo</th><th class="px-4 py-2 text-left">Sala</th><th class="px-4 py-2 text-left">Tiquetera</th><th class="px-4 py-2 text-left">Última Fun.</th><th class="px-4 py-2 text-left">Días</th><th class="px-4 py-2">Acciones</th></tr></thead><tbody>';

            obrasFiltradas.forEach(obra => {
                const sala = getSala(obra.salaId);
                const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
                const accionesCount = getAccionesObra(obra.id).length;
                const diasParaVender = calcularDiasParaVender(obra.fechaTiquetera, obra.fechaUltimaFuncion);
                html += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-2 font-medium cursor-pointer text-blue-600" onclick="viewObra(\'' + obra.id + '\')">' + obra.nombre + '</td>';
                html += '<td class="px-4 py-2">' + icono + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + sala?.nombre + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + (obra.fechaTiquetera || '-') + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + (obra.fechaUltimaFuncion || '-') + '</td>';
                html += '<td class="px-4 py-2 text-xs font-bold">' + diasParaVender + 'd</td>';
                html += '<td class="px-4 py-2 text-xs"><button onclick="viewObra(\'' + obra.id + '\')" class="text-blue-600 font-medium">Ver (' + accionesCount + ')</button>';
                if (tienePermiso('editar_obra')) html += ' <button onclick="openEditarObra(\'' + obra.id + '\')" class="text-green-600">Editar</button>';
                if (appState.user.rol === 'admin') html += ' <button onclick="deleteObra(\'' + obra.id + '\')" class="text-red-600">Eliminar</button>';
                html += '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        function deleteObra(obraId) {
            if (confirm('¿Eliminar esta obra? Se borrarán todas sus acciones y registros.')) {
                appState.obras = appState.obras.filter(o => o.id !== obraId);
                appState.acciones = appState.acciones.filter(a => a.obraId !== obraId);
                appState.ventas = appState.ventas.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId !== obraId;
                });
                appState.entrada_libre = appState.entrada_libre.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId !== obraId;
                });
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
                saveData();
                alert('✅ Obra eliminada');
                render();
            }
        }

        function viewObra(obraId) {
            appState.viewingObraId = obraId;
            appState.currentPage = 'ver-obra';
            render();
        }

        function renderVerObra() {
            const obra = appState.obras.find(o => o.id === appState.viewingObraId);
            if (!obra) return renderObras();
            
            const sala = getSala(obra.salaId);
            const acciones = getAccionesObra(obra.id);
            const funciones = getFuncionesObra(obra.id);
            const diasParaVender = calcularDiasParaVender(obra.fechaTiquetera, obra.fechaUltimaFuncion);
            const canEdit = tienePermiso('editar_obra');

            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-4xl mx-auto px-4 py-6">';
            html += '<button onclick="changePage(\'obras\')" class="text-blue-600 text-sm mb-4">← Volver</button>';
            html += '<div class="bg-white p-6 rounded shadow mb-6">';
            html += '<div class="flex justify-between items-start mb-4">';
            html += '<div><h2 class="text-2xl font-bold text-gray-800">' + obra.nombre + '</h2>';
            html += '<p class="text-gray-600">' + obra.artista + ' | ' + sala?.nombre + ' (Aforo: ' + sala?.aforo + ')</p></div>';
            html += '<div class="text-right"><span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">' + (obra.tipo === 'boleteria' ? '💵 Boletería' : '🎟️ Entrada Libre') + '</span></div>';
            html += '</div>';
            html += '<div class="grid grid-cols-2 gap-4 mb-4">';
            html += '<div><strong>Fecha Tiquetera:</strong> ' + (obra.fechaTiquetera || 'No registrada') + '</div>';
            html += '<div><strong>Última Función:</strong> ' + (obra.fechaUltimaFuncion || 'No registrada') + '</div>';
            html += '<div><strong>Días para Vender:</strong> <span class="font-bold text-blue-600">' + diasParaVender + ' días</span></div>';
            html += '<div><strong>Redes:</strong> ' + (obra.fechaRedes ? obra.fechaRedes + ' (' + calcularDiasDesde(obra.fechaRedes) + 'd)' : 'No registrada') + '</div>';
            html += '<div><strong>Pauta Digital:</strong> ' + (obra.fechaPauta ? obra.fechaPauta : 'No registrada') + '</div>';
            html += '<div><strong>Piezas:</strong> ' + (obra.piezasDesarrolladas ? '✅ Sí' : '❌ No') + (obra.fechaPiezasDesarrolladas ? ' (' + obra.fechaPiezasDesarrolladas + ')' : '') + '</div>';
            html += '<div><strong>Video:</strong> ' + (obra.videoDisponible ? '✅ Sí' : '❌ No') + (obra.fechaVideoPatua ? ' (' + obra.fechaVideoPatua + ')' : '') + '</div>';
            html += '</div>';
            if (canEdit) {
                html += '<button onclick="openEditarObra(\'' + obra.id + '\')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">✏️ Editar Obra</button>';
            }
            html += '</div>';

            // ========== SECCIÓN DE FUNCIONES ==========
            html += '<div class="bg-green-50 border-2 border-green-300 p-6 rounded shadow mb-6">';
            html += '<h3 class="text-lg font-bold mb-4 text-green-900">🎬 CREAR NUEVA FUNCIÓN</h3>';
            html += '<form onsubmit="handleAgregarFuncion(event, \'' + obra.id + '\')" class="space-y-3">';
            html += '<div class="grid grid-cols-2 gap-3">';
            html += '<div><label class="block text-sm font-medium mb-1 text-gray-700">📅 Fecha</label><input type="date" id="funcionFecha" required class="w-full px-3 py-2 border-2 border-gray-300 rounded text-sm font-medium" /></div>';
            html += '<div><label class="block text-sm font-medium mb-1 text-gray-700">⏰ Hora</label><input type="time" id="funcionHora" required class="w-full px-3 py-2 border-2 border-gray-300 rounded text-sm font-medium" /></div>';
            html += '</div>';
            html += '<button type="submit" class="w-full bg-green-600 text-white px-4 py-3 rounded text-base font-bold hover:bg-green-700">✅ AGREGAR FUNCIÓN</button>';
            html += '</form>';
            html += '</div>';

            // Lista de funciones
            html += '<div class="bg-white p-6 rounded shadow mb-6">';
            html += '<h3 class="text-lg font-bold mb-4">📋 Funciones Registradas (' + funciones.length + ')</h3>';
            if (funciones.length === 0) {
                html += '<p class="text-gray-500">Sin funciones registradas</p>';
            } else {
                html += '<div class="space-y-2">';
                funciones.forEach(f => {
                    html += '<div class="p-3 bg-gray-50 rounded border-l-4 border-orange-500 flex justify-between items-center">';
                    html += '<div><strong>' + f.fecha + '</strong> a las <strong>' + f.hora + '</strong></div>';
                    if (canEdit) {
                        html += '<button onclick="deleteFuncion(\'' + f.id + '\')" class="text-red-600 text-xs font-medium">Eliminar</button>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div>';

            // Sección de Acciones
            html += '<div class="bg-white p-6 rounded shadow"><h3 class="text-xl font-bold mb-4">📋 Acciones Registradas (' + acciones.length + ')</h3>';
            html += '<form onsubmit="handleAgregarAccion(event, \'' + obra.id + '\')" class="mb-6 p-4 bg-gray-50 rounded border">';

        function handleGuardarObra(e) {
            e.preventDefault();
            
            let functionesAGuardar = [];

            // Si es una función única, tomarla del input
            if (!appState.editingMultipleFunciones) {
                const fecha = document.getElementById('funcionUnicaFecha').value;
                const hora = document.getElementById('funcionUnicaHora').value;
                if (!fecha || !hora) {
                    alert('⚠️ Debes ingresar al menos la fecha y hora de la función');
                    return;
                }
                functionesAGuardar.push({ fecha, hora });
            } else {
                if (appState.editingFunciones.length === 0) {
                    alert('⚠️ Debes agregar al menos una función');
                    return;
                }
                functionesAGuardar = appState.editingFunciones;
            }

            // Validar que las funciones no sean en el pasado
            const hoy = new Date('2026-08-16');
            for (let f of functionesAGuardar) {
                const fechaFuncion = new Date(f.fecha);
                if (fechaFuncion < hoy) {
                    alert('⚠️ Error: Las funciones no pueden ser en fechas pasadas.\n\nFecha de función: ' + f.fecha + '\nFecha de hoy: ' + hoy.toISOString().split('T')[0]);
                    return;
                }
            }

            // Validar fechas
            const fechaTiquetera = document.getElementById('obraFechaTiquetera').value;
            
            if (functionesAGuardar.length > 0 && fechaTiquetera) {
                const fechas = functionesAGuardar.map(f => new Date(f.fecha));
                const primeraFuncion = new Date(Math.min(...fechas));
                const tiquetera = new Date(fechaTiquetera);
                
                if (tiquetera >= primeraFuncion) {
                    alert('⚠️ Error: La fecha de tiquetera debe ser ANTERIOR a la primera función.\n\nTiquetera: ' + fechaTiquetera + '\nPrimera función: ' + primeraFuncion.toISOString().split('T')[0]);
                    return;
                }
            }

            // Calcular fecha última función automáticamente
            let fechaUltimaFuncion = document.getElementById('obraFechaUltimaFuncion').value || null;
            if (functionesAGuardar.length > 0) {
                const fechas = functionesAGuardar.map(f => new Date(f.fecha));
                const maxFecha = new Date(Math.max(...fechas));
                fechaUltimaFuncion = maxFecha.toISOString().split('T')[0];
            }

            const data = {
                nombre: document.getElementById('obraNombre').value,
                artista: document.getElementById('obraArtista').value,
                salaId: document.getElementById('obraSala').value,
                tipo: document.getElementById('obraTipo').value,
                cortesias: parseInt(document.getElementById('obraCortesias').value) || 0,
                fechaTiquetera: document.getElementById('obraFechaTiquetera').value || null,
                fechaUltimaFuncion: fechaUltimaFuncion,
                fechaRedes: document.getElementById('obraFechaRedes').value || null,
                fechaPauta: document.getElementById('obraFechaPauta').value || null,
                piezasDesarrolladas: document.getElementById('obraPiezas').checked,
                fechaPiezasDesarrolladas: document.getElementById('obraFechaPiezas').value || null,
                videoDisponible: document.getElementById('obraVideo').checked,
                fechaVideoPatua: document.getElementById('obraFechaVideo').value || null
            };

            let obraId;
            if (appState.editingObra) {
                Object.assign(appState.editingObra, data);
                obraId = appState.editingObra.id;
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
            } else {
                obraId = Date.now().toString();
                appState.obras.push({ id: obraId, ...data });
            }

            // Guardar funciones
            functionesAGuardar.forEach(f => {
                appState.funciones.push({
                    id: f.id?.startsWith('temp-') ? ('fn-' + Date.now() + Math.random()).replace('.', '') : (f.id || Date.now().toString()),
                    obraId: obraId,
                    fecha: f.fecha,
                    hora: f.hora,
                    estado: 'programada'
                });
            });

            saveData();
            appState.currentPage = 'obras';
            appState.editingObra = null;
            appState.editingFunciones = [];
            appState.editingMultipleFunciones = false;
            alert('✅ Obra guardada correctamente');
            render();
        }

            html += '<h3 class="text-lg font-bold mb-3">Últimos Registros</h3>';
            html += '<div class="bg-white rounded shadow overflow-hidden"><table class="w-full text-sm">';
            html += '<thead class="bg-gray-100"><tr><th class="px-4 py-2 text-left">Obra</th><th class="px-4 py-2 text-left">Personas</th><th class="px-4 py-2 text-left">Fecha</th></tr></thead><tbody>';
            appState.entrada_libre.slice().reverse().slice(0, 10).forEach(v => {
                const f = appState.funciones.find(x => x.id === v.funcionId);
                const o = appState.obras.find(x => x.id === f?.obraId);
                html += '<tr class="border-b"><td class="px-4 py-2">' + o?.nombre + '</td><td class="px-4 py-2">' + v.personas + '</td><td class="px-4 py-2">' + v.fecha + '</td></tr>';
            });
            html += '</tbody></table></div></main></div>';
            return html;
        }

        function handleRegistrarEntrada(e) {
            e.preventDefault();
            const funcionId = document.getElementById('funcionSelectEntrada').value;
            const personas = parseInt(document.getElementById('personas').value);
            appState.entrada_libre.push({ id: Date.now().toString(), funcionId, personas, fecha: new Date('2026-08-16').toISOString().split('T')[0] });
            saveData();
            document.getElementById('funcionSelectEntrada').value = '';
            document.getElementById('personas').value = '';
            alert('✅ Entrada registrada');
        }

        function renderSalas() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">🏛️ Gestión de Salas</h2>';
            html += '<button onclick="openCrearSala()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 mb-4">+ Nueva Sala</button>';
            html += '<div class="bg-white rounded shadow overflow-hidden"><table class="w-full text-sm">';
            html += '<thead class="bg-gray-100"><tr><th class="px-4 py-2 text-left">Nombre</th><th class="px-4 py-2 text-left">Aforo</th><th class="px-4 py-2">Acciones</th></tr></thead><tbody>';
            appState.salas.forEach(sala => {
                html += '<tr class="border-b"><td class="px-4 py-2">' + sala.nombre + '</td><td class="px-4 py-2">' + sala.aforo + '</td><td class="px-4 py-2"><button onclick="openEditarSala(\'' + sala.id + '\')" class="text-blue-600 text-xs">Editar</button> <button onclick="deleteSala(\'' + sala.id + '\')" class="text-red-600 text-xs">Eliminar</button></td></tr>';
            });
            html += '</tbody></table></div></main></div>';
            return html;
        }

        function openCrearSala() {
            appState.editingSala = null;
            appState.currentPage = 'crear-sala';
            render();
        }

        function openEditarSala(id) {
            appState.editingSala = appState.salas.find(s => s.id === id);
            appState.currentPage = 'crear-sala';
            render();
        }

        function renderCrearSala() {
            const sala = appState.editingSala || { nombre: '', aforo: '' };
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader();
            html += '<main class="max-w-2xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">' + (appState.editingSala ? 'Editar Sala' : 'Nueva Sala') + '</h2>';
            html += '<form onsubmit="handleGuardarSala(event)" class="bg-white p-6 rounded shadow">';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-1">Nombre de la Sala</label><input type="text" id="salaNombre" value="' + sala.nombre + '" required class="w-full px-3 py-2 border rounded text-sm" /></div>';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-1">Aforo</label><input type="number" id="salaAforo" value="' + sala.aforo + '" required min="1" class="w-full px-3 py-2 border rounded text-sm" /></div>';
            html += '<button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 mr-2">Guardar</button>';
            html += '<button type="button" onclick="changePage(\'salas\')" class="bg-gray-400 text-white px-4 py-2 rounded text-sm">Cancelar</button>';
            html += '</form></main></div>';
            return html;
        }

        function handleGuardarSala(e) {
            e.preventDefault();
            const nombre = document.getElementById('salaNombre').value;
            const aforo = parseInt(document.getElementById('salaAforo').value);

            if (appState.editingSala) {
                appState.editingSala.nombre = nombre;
                appState.editingSala.aforo = aforo;
            } else {
                appState.salas.push({ id: Date.now().toString(), nombre, aforo });
            }

            saveData();
            appState.currentPage = 'salas';
            appState.editingSala = null;
            render();
        }

        function deleteSala(id) {
            if (confirm('¿Eliminar esta sala?')) {
                appState.salas = appState.salas.filter(s => s.id !== id);
                saveData();
                render();
            }
        }

        function renderCalendario() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📅 Calendario de Funciones</h2>';
            html += '<div class="bg-white p-4 rounded shadow">';
            html += '<table class="w-full text-sm border-collapse">';
            html += '<thead><tr><th class="border p-2 text-left">Fecha</th><th class="border p-2 text-left">Obra</th><th class="border p-2 text-left">Hora</th><th class="border p-2 text-left">Tipo</th><th class="border p-2 text-left">Sala</th></tr></thead><tbody>';

            let obras_filtradas = appState.obras.filter(o => puedeVerObra(o));
            appState.funciones.sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).filter(f => obras_filtradas.some(o => o.id === f.obraId)).forEach(f => {
                const obra = appState.obras.find(o => o.id === f.obraId);
                const sala = getSala(obra.salaId);
                const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
                const color = obra.tipo === 'boleteria' ? 'bg-blue-50' : 'bg-purple-50';
                html += '<tr class="' + color + ' border"><td class="border p-2">' + f.fecha + '</td><td class="border p-2 cursor-pointer text-blue-600" onclick="viewObra(\'' + obra.id + '\')">' + obra.nombre + '</td><td class="border p-2">' + f.hora + '</td><td class="border p-2">' + icono + '</td><td class="border p-2">' + sala?.nombre + '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        function renderReportes() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📈 Reportes</h2>';
            html += '<div class="grid grid-cols-2 gap-4">';
            html += '<div class="bg-white p-4 rounded shadow"><h3 class="font-bold mb-2">Resumen de Ventas</h3><p class="text-sm text-gray-600">Total ventas: ' + appState.ventas.length + '</p></div>';
            html += '<div class="bg-white p-4 rounded shadow"><h3 class="font-bold mb-2">Resumen Entrada Libre</h3><p class="text-sm text-gray-600">Total registros: ' + appState.entrada_libre.length + '</p></div>';
            html += '<div class="bg-white p-4 rounded shadow col-span-2"><h3 class="font-bold mb-3">Detalles por Obra</h3>';
            let obras_filtradas = appState.obras.filter(o => puedeVerObra(o));
            obras_filtradas.forEach(o => {
                const ventasObra = appState.ventas.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId === o.id;
                });
                const entradaObra = appState.entrada_libre.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId === o.id;
                });
                html += '<div class="mb-3 pb-3 border-b"><strong>' + o.nombre + '</strong>: Ventas: ' + ventasObra.length + ' | Entrada: ' + entradaObra.length + '</div>';
            });
            html += '</div></div></main></div>';
            return html;
        }

        function changePage(page) {
            appState.currentPage = page;
            appState.viewingObraId = null;
            appState.editingSala = null;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!appState.user) {
                app.innerHTML = renderLogin();
            } else {
                switch (appState.currentPage) {
                    case 'obras': app.innerHTML = renderObras(); break;
                    case 'ver-obra': app.innerHTML = renderVerObra(); break;
                    case 'crear-obra': 
                        app.innerHTML = renderCrearObra();
                        setTimeout(() => updateFunctionsSectionDisplay(), 0);
                        break;
                    case 'salas': app.innerHTML = renderSalas(); break;
                    case 'crear-sala': app.innerHTML = renderCrearSala(); break;
                    case 'ventas': app.innerHTML = renderVentas(); break;
                    case 'entrada': app.innerHTML = renderEntrada(); break;
                    case 'calendario': app.innerHTML = renderCalendario(); break;
                    case 'reportes': app.innerHTML = renderReportes(); break;
                    default: app.innerHTML = renderDashboard();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initData();
            const savedUser = localStorage.getItem('boleteria-user');
            if (savedUser) appState.user = JSON.parse(savedUser);
            render();
        });
    </script>
</body>
</html>
