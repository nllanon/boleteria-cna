<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletería CNA - Con Roles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div id="app"></div>

    <script>
        let appState = {
            user: null,
            obras: [],
            funciones: [],
            ventas: [],
            entrada_libre: [],
            cierres: [],
            notas: [],
            currentPage: 'dashboard',
            editingObra: null
        };

        const USUARIOS = {
            'admin@test.com': { password: 'admin123', nombre: 'Administrador CNA', rol: 'admin' },
            'registrador.boleto@test.com': { password: '123456', nombre: 'Registrador Boletería', rol: 'registrador_boleto' },
            'registrador.entrada@test.com': { password: '123456', nombre: 'Registrador Entrada Libre', rol: 'registrador_entrada' },
            'visualizador@test.com': { password: '123456', nombre: 'Visualizador', rol: 'visualizador' }
        };

        function initData() {
            const saved = localStorage.getItem('boleteria-data');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(appState, data);
            } else {
                appState.obras = [
                    { id: '1', nombre: 'De la Raíz al Viento', artista: 'Compañía Teatral', sala: 'Sala Fanny Mikey', aforo: 222, cortesias: 10, tipo: 'boleteria' },
                    { id: '2', nombre: 'Louis: Michael Varekamp', artista: 'Músicos Clásicos', sala: 'Teatro Colón', aforo: 720, cortesias: 50, tipo: 'boleteria' },
                    { id: '3', nombre: 'Entrada Libre CNA', artista: 'Diversos', sala: 'Sala Delia Zapata', aforo: 300, cortesias: 0, tipo: 'entrada_libre' }
                ];
                appState.funciones = [
                    { id: '1', obraId: '1', fecha: '2026-08-20', hora: '19:00', estado: 'programada' },
                    { id: '2', obraId: '2', fecha: '2026-08-21', hora: '20:00', estado: 'programada' },
                    { id: '3', obraId: '3', fecha: '2026-08-22', hora: '18:00', estado: 'programada' }
                ];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('boleteria-data', JSON.stringify({
                obras: appState.obras,
                funciones: appState.funciones,
                ventas: appState.ventas,
                entrada_libre: appState.entrada_libre,
                cierres: appState.cierres,
                notas: appState.notas
            }));
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const usuario = USUARIOS[email];
            if (usuario && usuario.password === password) {
                appState.user = { email, ...usuario };
                localStorage.setItem('boleteria-user', JSON.stringify(appState.user));
                render();
            } else {
                alert('Credenciales inválidas.\n\nPrueba:\nadmin@test.com / admin123\nregistrador.boleto@test.com / 123456\nregistrador.entrada@test.com / 123456\nvisualizador@test.com / 123456');
            }
        }

        function handleLogout() {
            appState.user = null;
            appState.currentPage = 'dashboard';
            localStorage.removeItem('boleteria-user');
            render();
        }

        function tienePermiso(accion) {
            const rol = appState.user?.rol;
            const permisos = {
                'admin': ['ver_todo', 'crear_obra', 'editar_obra', 'registrar_venta', 'registrar_entrada', 'generar_reportes', 'ver_acciones', 'crear_acciones'],
                'registrador_boleto': ['ver_obras_boleto', 'registrar_venta', 'ver_acciones', 'crear_acciones', 'generar_reportes'],
                'registrador_entrada': ['ver_obras_entrada', 'registrar_entrada', 'ver_acciones', 'crear_acciones', 'generar_reportes'],
                'visualizador': ['ver_todo']
            };
            return permisos[rol]?.includes(accion) || false;
        }

        function renderLogin() {
            let html = '<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-500 to-purple-600">';
            html += '<div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md">';
            html += '<h1 class="text-3xl font-bold mb-2 text-center text-gray-800">🎭 Boletería CNA</h1>';
            html += '<p class="text-center text-gray-500 text-sm mb-6">Con Control de Roles</p>';
            html += '<form onsubmit="handleLogin(event)">';
            html += '<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">Email</label>';
            html += '<input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@email.com" /></div>';
            html += '<div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>';
            html += '<input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" /></div>';
            html += '<button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Ingresar</button>';
            html += '</form>';
            html += '<div class="mt-6 p-4 bg-gray-100 rounded-lg text-xs text-gray-700">';
            html += '<strong>Usuarios de prueba:</strong><br/>';
            html += 'Admin: admin@test.com / admin123<br/>';
            html += 'Reg. Boleto: registrador.boleto@test.com / 123456<br/>';
            html += 'Reg. Entrada: registrador.entrada@test.com / 123456<br/>';
            html += 'Visualizador: visualizador@test.com / 123456';
            html += '</div>';
            html += '</div></div>';
            return html;
        }

        function renderHeader() {
            let rolTexto = '';
            if (appState.user.rol === 'admin') rolTexto = '👑 Administrador';
            else if (appState.user.rol === 'registrador_boleto') rolTexto = '🎟️ Registrador Boletería';
            else if (appState.user.rol === 'registrador_entrada') rolTexto = '🚪 Registrador Entrada Libre';
            else rolTexto = '👁️ Visualizador';

            let html = '<header class="bg-white shadow"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">';
            html += '<div><h1 class="text-2xl font-bold text-gray-800">🎭 Boletería CNA</h1>';
            html += '<p class="text-xs text-gray-500">' + rolTexto + '</p></div>';
            html += '<div class="flex items-center gap-4">';
            html += '<span class="text-sm text-gray-600">' + appState.user.email + '</span>';
            html += '<button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition">Salir</button>';
            html += '</div></div></header>';
            return html;
        }

        function renderNav() {
            let items = [];

            if (tienePermiso('ver_todo')) {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'ventas', label: '💰 Ventas' },
                    { id: 'entrada', label: '🚪 Entrada Libre' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else if (tienePermiso('registrar_venta')) {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'ventas', label: '💰 Registrar Venta' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else if (tienePermiso('registrar_entrada')) {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' },
                    { id: 'entrada', label: '🚪 Registrar Entrada' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Obras' }
                ];
            }

            let html = '<div class="bg-white border-b"><div class="max-w-7xl mx-auto px-4 flex gap-4 py-4 overflow-x-auto">';
            items.forEach(page => {
                const active = appState.currentPage === page.id;
                html += '<button onclick="changePage(\'' + page.id + '\')" class="px-4 py-2 rounded-lg font-medium transition whitespace-nowrap ' + (active ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100') + '">' + page.label + '</button>';
            });
            html += '</div></div>';
            return html;
        }

        function renderDashboard() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-8"><h2 class="text-2xl font-bold mb-6">📊 Dashboard</h2>';

            let obrasFiltradas = appState.obras;
            if (appState.user.rol === 'registrador_boleto') {
                obrasFiltradas = obrasFiltradas.filter(o => o.tipo === 'boleteria');
            } else if (appState.user.rol === 'registrador_entrada') {
                obrasFiltradas = obrasFiltradas.filter(o => o.tipo === 'entrada_libre');
            }

            html += '<div class="grid grid-cols-3 gap-4 mb-8">';
            html += '<div class="bg-white p-4 rounded-lg shadow"><p class="text-gray-500 text-xs">Total Obras</p><p class="text-2xl font-bold text-blue-600">' + obrasFiltradas.length + '</p></div>';
            html += '<div class="bg-white p-4 rounded-lg shadow"><p class="text-gray-500 text-xs">Total Ventas</p><p class="text-2xl font-bold text-green-600">' + appState.ventas.length + '</p></div>';
            html += '<div class="bg-white p-4 rounded-lg shadow"><p class="text-gray-500 text-xs">Entrada Libre</p><p class="text-2xl font-bold text-purple-600">' + appState.entrada_libre.length + '</p></div>';
            html += '</div>';

            html += '<h3 class="text-lg font-bold mb-4">Obras ' + (appState.user.rol === 'registrador_boleto' ? 'con Boletería' : appState.user.rol === 'registrador_entrada' ? 'con Entrada Libre' : '') + '</h3>';
            html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';

            obrasFiltradas.forEach(obra => {
                html += '<div class="bg-white p-4 rounded-lg shadow">';
                html += '<h4 class="font-bold text-gray-800">' + obra.nombre + '</h4>';
                html += '<p class="text-xs text-gray-600">' + obra.artista + '</p>';
                html += '<p class="text-xs text-gray-500 mt-2">' + obra.sala + '</p>';
                html += '<p class="text-xs mt-2"><strong>Tipo:</strong> ' + (obra.tipo === 'boleteria' ? '🎟️ Boletería' : '🚪 Entrada Libre') + '</p>';
                html += '<p class="text-xs"><strong>Aforo:</strong> ' + obra.aforo + '</p>';
                html += '</div>';
            });

            html += '</div></main></div>';
            return html;
        }

        function renderObras() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-8"><h2 class="text-2xl font-bold mb-6">📚 Gestión de Obras</h2>';

            if (tienePermiso('crear_obra')) {
                html += '<button onclick="openCrearObra()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 mb-4">+ Nueva Obra</button>';
            }

            html += '<div class="bg-white rounded-lg shadow overflow-hidden"><table class="w-full">';
            html += '<thead class="bg-gray-100 border-b"><tr>';
            html += '<th class="px-6 py-3 text-left text-sm font-medium">Obra</th>';
            html += '<th class="px-6 py-3 text-left text-sm font-medium">Tipo</th>';
            html += '<th class="px-6 py-3 text-left text-sm font-medium">Sala</th>';
            html += '<th class="px-6 py-3 text-left text-sm font-medium">Aforo</th>';

            if (tienePermiso('crear_obra')) {
                html += '<th class="px-6 py-3 text-left text-sm font-medium">Acciones</th>';
            }

            html += '</tr></thead><tbody>';

            appState.obras.forEach(obra => {
                html += '<tr class="border-b hover:bg-gray-50">';
                html += '<td class="px-6 py-3 text-sm">' + obra.nombre + '</td>';
                html += '<td class="px-6 py-3 text-sm">' + (obra.tipo === 'boleteria' ? '🎟️' : '🚪') + '</td>';
                html += '<td class="px-6 py-3 text-sm">' + obra.sala + '</td>';
                html += '<td class="px-6 py-3 text-sm">' + obra.aforo + '</td>';

                if (tienePermiso('crear_obra')) {
                    html += '<td class="px-6 py-3 text-sm"><button onclick="openEditarObra(\'' + obra.id + '\')" class="text-blue-600 hover:text-blue-800">Editar</button></td>';
                }

                html += '</tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        function openCrearObra() {
            appState.editingObra = null;
            appState.currentPage = 'crear-obra';
            render();
        }

        function openEditarObra(id) {
            appState.editingObra = appState.obras.find(o => o.id === id);
            appState.currentPage = 'crear-obra';
            render();
        }

        function renderCrearObra() {
            const obra = appState.editingObra || { nombre: '', artista: '', sala: '', aforo: '', tipo: 'boleteria' };
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader();
            html += '<main class="max-w-2xl mx-auto px-4 py-8"><h2 class="text-2xl font-bold mb-6">' + (appState.editingObra ? 'Editar Obra' : 'Nueva Obra') + '</h2>';
            html += '<form onsubmit="handleGuardarObra(event)" class="bg-white p-6 rounded-lg shadow">';
            html += '<div class="grid grid-cols-2 gap-4 mb-4">';
            html += '<div><label class="block text-sm font-medium mb-2">Nombre</label><input type="text" id="obraNombre" value="' + obra.nombre + '" required class="w-full px-4 py-2 border rounded-lg" /></div>';
            html += '<div><label class="block text-sm font-medium mb-2">Artista</label><input type="text" id="obraArtista" value="' + obra.artista + '" required class="w-full px-4 py-2 border rounded-lg" /></div>';
            html += '<div><label class="block text-sm font-medium mb-2">Sala</label><input type="text" id="obraSala" value="' + obra.sala + '" required class="w-full px-4 py-2 border rounded-lg" /></div>';
            html += '<div><label class="block text-sm font-medium mb-2">Aforo</label><input type="number" id="obraAforo" value="' + obra.aforo + '" required class="w-full px-4 py-2 border rounded-lg" /></div>';
            html += '<div><label class="block text-sm font-medium mb-2">Tipo</label><select id="obraTipo" class="w-full px-4 py-2 border rounded-lg"><option value="boleteria" ' + (obra.tipo === 'boleteria' ? 'selected' : '') + '>🎟️ Boletería</option><option value="entrada_libre" ' + (obra.tipo === 'entrada_libre' ? 'selected' : '') + '>🚪 Entrada Libre</option></select></div>';
            html += '</div>';
            html += '<button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 mr-2">Guardar</button>';
            html += '<button type="button" onclick="changePage(\'obras\')" class="bg-gray-400 text-white px-6 py-2 rounded-lg">Cancelar</button>';
            html += '</form></main></div>';
            return html;
        }

        function handleGuardarObra(e) {
            e.preventDefault();
            const nombre = document.getElementById('obraNombre').value;
            const artista = document.getElementById('obraArtista').value;
            const sala = document.getElementById('obraSala').value;
            const aforo = parseInt(document.getElementById('obraAforo').value);
            const tipo = document.getElementById('obraTipo').value;

            if (appState.editingObra) {
                Object.assign(appState.editingObra, { nombre, artista, sala, aforo, tipo });
            } else {
                appState.obras.push({ id: Date.now().toString(), nombre, artista, sala, aforo, tipo });
            }

            saveData();
            appState.currentPage = 'obras';
            appState.editingObra = null;
            render();
        }

        function renderVentas() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-8"><h2 class="text-2xl font-bold mb-6">💰 Registrar Venta del Día</h2>';

            const obras = appState.obras.filter(o => o.tipo === 'boleteria');
            const funciones = appState.funciones.filter(f => obras.some(o => o.id === f.obraId));

            html += '<form onsubmit="handleRegistrarVenta(event)" class="bg-white p-6 rounded-lg shadow max-w-md mb-8">';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-2">Función</label>';
            html += '<select id="funcionSelect" required class="w-full px-4 py-2 border rounded-lg">';
            html += '<option value="">Seleccionar...</option>';

            funciones.forEach(f => {
                const obra = appState.obras.find(o => o.id === f.obraId);
                html += '<option value="' + f.id + '">' + obra.nombre + ' - ' + f.fecha + '</option>';
            });

            html += '</select></div>';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-2">Boletas Vendidas</label>';
            html += '<input type="number" id="boletas" required min="0" class="w-full px-4 py-2 border rounded-lg" /></div>';
            html += '<button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">Registrar</button>';
            html += '</form>';

            html += '<h3 class="text-lg font-bold mb-4">Últimos Registros</h3>';
            html += '<div class="bg-white rounded-lg shadow overflow-hidden"><table class="w-full">';
            html += '<thead class="bg-gray-100"><tr><th class="px-6 py-3 text-left text-sm">Obra</th><th class="px-6 py-3 text-left text-sm">Boletas</th><th class="px-6 py-3 text-left text-sm">Fecha</th></tr></thead><tbody>';

            appState.ventas.slice().reverse().slice(0, 10).forEach(v => {
                const f = appState.funciones.find(x => x.id === v.funcionId);
                const o = appState.obras.find(x => x.id === f?.obraId);
                html += '<tr class="border-b"><td class="px-6 py-3 text-sm">' + o?.nombre + '</td><td class="px-6 py-3 text-sm">' + v.boletas + '</td><td class="px-6 py-3 text-sm">' + v.fecha + '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        function handleRegistrarVenta(e) {
            e.preventDefault();
            const funcionId = document.getElementById('funcionSelect').value;
            const boletas = parseInt(document.getElementById('boletas').value);

            appState.ventas.push({
                id: Date.now().toString(),
                funcionId,
                boletas,
                fecha: new Date().toISOString().split('T')[0]
            });

            saveData();
            document.getElementById('funcionSelect').value = '';
            document.getElementById('boletas').value = '';
            alert('✅ Venta registrada');
        }

        function renderEntrada() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-8"><h2 class="text-2xl font-bold mb-6">🚪 Registrar Entrada Libre</h2>';

            const obras = appState.obras.filter(o => o.tipo === 'entrada_libre');
            const funciones = appState.funciones.filter(f => obras.some(o => o.id === f.obraId));

            html += '<form onsubmit="handleRegistrarEntrada(event)" class="bg-white p-6 rounded-lg shadow max-w-md mb-8">';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-2">Función</label>';
            html += '<select id="funcionSelectEntrada" required class="w-full px-4 py-2 border rounded-lg">';
            html += '<option value="">Seleccionar...</option>';

            funciones.forEach(f => {
                const obra = appState.obras.find(o => o.id === f.obraId);
                html += '<option value="' + f.id + '">' + obra.nombre + ' - ' + f.fecha + '</option>';
            });

            html += '</select></div>';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-2">Personas Registradas</label>';
            html += '<input type="number" id="personas" required min="0" class="w-full px-4 py-2 border rounded-lg" /></div>';
            html += '<button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">Registrar Entrada</button>';
            html += '</form>';

            html += '<h3 class="text-lg font-bold mb-4">Últimos Registros</h3>';
            html += '<div class="bg-white rounded-lg shadow overflow-hidden"><table class="w-full">';
            html += '<thead class="bg-gray-100"><tr><th class="px-6 py-3 text-left text-sm">Obra</th><th class="px-6 py-3 text-left text-sm">Personas</th><th class="px-6 py-3 text-left text-sm">Fecha</th></tr></thead><tbody>';

            appState.entrada_libre.slice().reverse().slice(0, 10).forEach(v => {
                const f = appState.funciones.find(x => x.id === v.funcionId);
                const o = appState.obras.find(x => x.id === f?.obraId);
                html += '<tr class="border-b"><td class="px-6 py-3 text-sm">' + o?.nombre + '</td><td class="px-6 py-3 text-sm">' + v.personas + '</td><td class="px-6 py-3 text-sm">' + v.fecha + '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        function handleRegistrarEntrada(e) {
            e.preventDefault();
            const funcionId = document.getElementById('funcionSelectEntrada').value;
            const personas = parseInt(document.getElementById('personas').value);

            appState.entrada_libre.push({
                id: Date.now().toString(),
                funcionId,
                personas,
                fecha: new Date().toISOString().split('T')[0]
            });

            saveData();
            document.getElementById('funcionSelectEntrada').value = '';
            document.getElementById('personas').value = '';
            alert('✅ Entrada registrada');
        }

        function renderReportes() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-8"><h2 class="text-2xl font-bold mb-6">📈 Reportes</h2>';
            html += '<p class="text-gray-600">En construcción...</p>';
            html += '</main></div>';
            return html;
        }

        function changePage(page) {
            appState.currentPage = page;
            render();
        }

        function render() {
            const app = document.getElementById('app');

            if (!appState.user) {
                app.innerHTML = renderLogin();
            } else {
                switch (appState.currentPage) {
                    case 'obras':
                        app.innerHTML = renderObras();
                        break;
                    case 'crear-obra':
                        app.innerHTML = renderCrearObra();
                        break;
                    case 'ventas':
                        app.innerHTML = renderVentas();
                        break;
                    case 'entrada':
                        app.innerHTML = renderEntrada();
                        break;
                    case 'reportes':
                        app.innerHTML = renderReportes();
                        break;
                    default:
                        app.innerHTML = renderDashboard();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initData();
            const savedUser = localStorage.getItem('boleteria-user');
            if (savedUser) {
                appState.user = JSON.parse(savedUser);
            }
            render();
        });
    </script>
</body>
</html>
