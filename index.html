<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletería CNA - Sistema Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3"></script>
</head>
<body>
    <div id="app"></div>

    <script>
        let appState = {
            user: null,
            temporadas: [],
            obras: [],
            funciones: [],
            ventas: [],
            entrada_libre: [],
            salas: [],
            acciones: [],
            historial: [],
            currentPage: 'dashboard',
            editingObra: null,
            editingSala: null,
            editingFunciones: [],
            editingMultipleFunciones: false,
            viewingObraId: null,
            showGraficoVentas: false,
            graficoVentasObraId: null
        };

        const USUARIOS = {
            'admin@test.com': { password: 'admin123', nombre: 'Administrador CNA', rol: 'admin' },
            'registrador.boleto@test.com': { password: '123456', nombre: 'Registrador Boletería', rol: 'registrador_boleto' },
            'registrador.entrada@test.com': { password: '123456', nombre: 'Registrador Entrada Libre', rol: 'registrador_entrada' },
            'visualizador@test.com': { password: '123456', nombre: 'Visualizador', rol: 'visualizador' }
        };

        function initData() {
            const saved = localStorage.getItem('boleteria-data');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(appState, data);
                
                // Migración: asegurar que todas las funciones tengan ventasPorDia
                if (appState.funciones) {
                    appState.funciones.forEach(f => {
                        if (!f.ventasPorDia) f.ventasPorDia = [];
                        if (!f.ventasAcumuladas) f.ventasAcumuladas = 0;
                        if (!f.cortesias) f.cortesias = 0;
                        if (!f.cortesiasEntregadas) f.cortesiasEntregadas = 0;
                    });
                }
            } else {
                appState.salas = [
                    { id: '1', nombre: 'Sala Fanny Mikey', aforo: 222 },
                    { id: '2', nombre: 'Teatro Colón', aforo: 720 },
                    { id: '3', nombre: 'Sala Delia Zapata Olivella', aforo: 300 },
                    { id: '4', nombre: 'Auditorio Principal', aforo: 450 }
                ];

                appState.temporadas = [
                    { id: '1', nombre: 'Agosto 2026', fechaInicio: '2026-08-01', fechaFin: '2026-08-31' }
                ];

                appState.obras = [
                    { id: '1', nombre: 'De la Raíz al Viento', artista: 'Compañía Teatral', salaId: '1', temporadaId: '1', tipo: 'boleteria', fechaTiquetera: '2026-08-10', fechaUltimaFuncion: '2026-08-20', fechaRedes: '2026-08-10', fechaPauta: '2026-08-15', piezasDesarrolladas: true, fechaPiezasDesarrolladas: '2026-08-05', videoDisponible: true, fechaVideoPatua: '2026-08-08' },
                    { id: '2', nombre: 'Louis: Michael Varekamp', artista: 'Músicos Clásicos', salaId: '2', temporadaId: '1', tipo: 'boleteria', fechaTiquetera: '2026-08-05', fechaUltimaFuncion: '2026-08-21', fechaRedes: '2026-08-05', fechaPauta: '2026-08-12', piezasDesarrolladas: true, fechaPiezasDesarrolladas: '2026-08-02', videoDisponible: false, fechaVideoPatua: null },
                    { id: '3', nombre: 'Entrada Libre CNA', artista: 'Diversos', salaId: '3', temporadaId: '1', tipo: 'entrada_libre', fechaTiquetera: '2026-08-14', fechaUltimaFuncion: '2026-08-22', fechaRedes: '2026-08-14', fechaPauta: null, piezasDesarrolladas: false, fechaPiezasDesarrolladas: null, videoDisponible: false, fechaVideoPatua: null }
                ];

                appState.funciones = [
                    { id: '1', obraId: '1', fecha: '2026-08-20', hora: '19:00', estado: 'programada', cortesias: 10, cortesiasEntregadas: 0, ventasAcumuladas: 0, ventasPorDia: [] },
                    { id: '2', obraId: '2', fecha: '2026-08-21', hora: '20:00', estado: 'programada', cortesias: 50, cortesiasEntregadas: 0, ventasAcumuladas: 0, ventasPorDia: [] },
                    { id: '3', obraId: '3', fecha: '2026-08-22', hora: '18:00', estado: 'programada', cortesias: 0, cortesiasEntregadas: 0, ventasAcumuladas: 0, ventasPorDia: [] }
                ];

                appState.acciones = [];

                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('boleteria-data', JSON.stringify({
                temporadas: appState.temporadas,
                obras: appState.obras,
                funciones: appState.funciones,
                ventas: appState.ventas,
                entrada_libre: appState.entrada_libre,
                salas: appState.salas,
                acciones: appState.acciones,
                historial: appState.historial
            }));
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const usuario = USUARIOS[email];
            if (usuario && usuario.password === password) {
                appState.user = { email, ...usuario };
                localStorage.setItem('boleteria-user', JSON.stringify(appState.user));
                render();
            } else {
                alert('Credenciales inválidas.');
            }
        }

        function handleLogout() {
            appState.user = null;
            appState.currentPage = 'dashboard';
            appState.viewingObraId = null;
            localStorage.removeItem('boleteria-user');
            render();
        }

        function tienePermiso(accion) {
            const rol = appState.user?.rol;
            const permisos = {
                'admin': ['ver_todo', 'crear_obra', 'editar_obra', 'registrar_venta', 'registrar_entrada', 'generar_reportes', 'editar_salas'],
                'registrador_boleto': ['crear_obra', 'editar_obra', 'registrar_venta', 'generar_reportes'],
                'registrador_entrada': ['crear_obra', 'editar_obra', 'registrar_entrada', 'generar_reportes'],
                'visualizador': ['ver_todo']
            };
            return permisos[rol]?.includes(accion) || false;
        }

        function puedeVerObra(obra) {
            const rol = appState.user?.rol;
            if (rol === 'admin' || rol === 'visualizador') return true;
            if (rol === 'registrador_boleto') return obra.tipo === 'boleteria';
            if (rol === 'registrador_entrada') return obra.tipo === 'entrada_libre';
            return false;
        }

        function getSala(salaId) {
            return appState.salas.find(s => s.id === salaId);
        }

        function calcularDiasDesde(fecha) {
            if (!fecha) return 0;
            const hoy = new Date('2026-08-16');
            const inicio = new Date(fecha);
            const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, diff);
        }

        function calcularDiasParaVender(fechaTiquetera, fechaUltimaFuncion) {
            if (!fechaTiquetera || !fechaUltimaFuncion) return 0;
            const inicio = new Date(fechaTiquetera);
            const fin = new Date(fechaUltimaFuncion);
            const diff = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, diff);
        }

        function getAccionesObra(obraId) {
            return appState.acciones.filter(a => a.obraId === obraId);
        }

        function getFuncionesObra(obraId) {
            return appState.funciones.filter(f => f.obraId === obraId).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        }

        function getPrimeraFuncion(obraId) {
            const funciones = getFuncionesObra(obraId);
            return funciones.length > 0 ? funciones[0] : null;
        }

        function getUltimaFuncion(obraId) {
            const funciones = getFuncionesObra(obraId);
            return funciones.length > 0 ? funciones[funciones.length - 1] : null;
        }

        function calcularDiasTotalesParaVender(fechaTiquetera, obraId) {
            if (!fechaTiquetera) return 'N/A';
            const ultimaFuncion = getUltimaFuncion(obraId);
            if (!ultimaFuncion) return 'N/A';
            const inicio = new Date(fechaTiquetera);
            const fin = new Date(ultimaFuncion.fecha);
            const dias = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, dias);
        }

        function calcularDiasPorVender(fecha) {
            if (!fecha || fecha === '' || fecha === null || fecha === undefined) return 'N/A';
            
            try {
                // Validar formato YYYY-MM-DD
                if (typeof fecha !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) {
                    return 'N/A';
                }
                
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);
                
                const partes = fecha.split('-');
                const fin = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
                
                if (isNaN(fin.getTime())) return 'N/A';
                
                const dias = Math.floor((fin - hoy) / (1000 * 60 * 60 * 24));
                return Math.max(0, dias);
            } catch (e) {
                console.error('Error calcularDiasPorVender:', fecha, e);
                return 'N/A';
            }
        }

        function formatearFecha(fecha) {
            if (!fecha) return '-';
            const d = new Date(fecha + 'T00:00:00');
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const anio = d.getFullYear();
            return dia + '/' + mes + '/' + anio;
        }

        function formatearHora(hora) {
            if (!hora) return '-';
            return hora;  // Ya viene en formato 24h (HH:MM)
        }

        function getVentasPorDiaObra(obraId) {
            const funciones = getFuncionesObra(obraId);
            const porDia = {};

            funciones.forEach(f => {
                if (f.ventasPorDia && Array.isArray(f.ventasPorDia)) {
                    f.ventasPorDia.forEach(vd => {
                        if (!porDia[vd.fecha]) porDia[vd.fecha] = 0;
                        porDia[vd.fecha] += vd.boletas;
                    });
                }
            });

            const fechas = Object.keys(porDia).sort();
            const boletas = fechas.map(f => porDia[f]);

            return { fechas, boletas };
        }

        function abrirGraficoVentas(obraId) {
            appState.showGraficoVentas = true;
            appState.graficoVentasObraId = obraId;
            render();
            setTimeout(() => {
                const canvas = document.getElementById('chartVentas');
                if (canvas && window.Chart) {
                    const obra = appState.obras.find(o => o.id === obraId);
                    const datos = getVentasPorDiaObra(obraId);
                    const funciones = getFuncionesObra(obraId);
                    
                    if (window.chartInstanceVentas) {
                        window.chartInstanceVentas.destroy();
                    }

                    // Si no hay datos de ventas, mostrar mensaje
                    if (datos.fechas.length === 0) {
                        const ctx = canvas.getContext('2d');
                        ctx.font = '16px Arial';
                        ctx.fillStyle = '#999';
                        ctx.textAlign = 'center';
                        ctx.fillText('Sin datos de ventas registradas', canvas.width / 2, canvas.height / 2);
                        return;
                    }

                    const fechaPrimeraFuncion = funciones.length > 0 ? funciones[0].fecha : null;
                    
                    window.chartInstanceVentas = new Chart(canvas, {
                        type: 'bar',
                        data: {
                            labels: datos.fechas,
                            datasets: [{
                                label: 'Boletas vendidas',
                                data: datos.boletas,
                                backgroundColor: '#3b82f6',
                                borderColor: '#1e40af',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: 'Ventas diarias: ' + obra.nombre,
                                    font: { size: 14 }
                                },
                                legend: {
                                    display: true
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { stepSize: 1 }
                                }
                            }
                        }
                    });
                    
                    // Dibujar líneas timeline después de renderizar
                    setTimeout(() => {
                        const ctx = canvas.getContext('2d');
                        const xScale = window.chartInstanceVentas.scales.x;
                        const chartArea = window.chartInstanceVentas.chartArea;
                        const labels = window.chartInstanceVentas.data.labels;
                        
                        const lineas = [
                            { fecha: obra.fechaTiquetera, color: '#10b981', label: 'Tiquetera' },
                            { fecha: obra.fechaRedes, color: '#f59e0b', label: 'Redes' },
                            { fecha: obra.fechaPauta, color: '#8b5cf6', label: 'Pauta' },
                            { fecha: fechaPrimeraFuncion, color: '#ef4444', label: 'Estreno' }
                        ];
                        
                        lineas.forEach(linea => {
                            if (!linea.fecha) return;
                            const labelIndex = labels.indexOf(linea.fecha);
                            if (labelIndex === -1) return;
                            
                            const x = xScale.getPixelForValue(labelIndex);
                            
                            ctx.strokeStyle = linea.color;
                            ctx.lineWidth = 2;
                            ctx.setLineDash([5, 5]);
                            ctx.beginPath();
                            ctx.moveTo(x, chartArea.top);
                            ctx.lineTo(x, chartArea.bottom);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            
                            ctx.font = 'bold 11px Arial';
                            ctx.fillStyle = linea.color;
                            ctx.save();
                            ctx.translate(x + 5, chartArea.top + 15);
                            ctx.rotate(-Math.PI / 2);
                            ctx.textAlign = 'right';
                            ctx.fillText(linea.label, 0, 0);
                            ctx.restore();
                        });
                    }, 50);
                }
            }, 100);
        }

        function cerrarGraficoVentas() {
            appState.showGraficoVentas = false;
            render();
        }

        function renderLogin() {
            let html = '<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-500 to-purple-600">';
            html += '<div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md">';
            html += '<h1 class="text-3xl font-bold mb-2 text-center text-gray-800">🎭 Boletería CNA</h1>';
            html += '<p class="text-center text-gray-500 text-sm mb-6">Sistema Integral de Monitoreo</p>';
            html += '<form onsubmit="handleLogin(event)">';
            html += '<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">Email</label>';
            html += '<input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@email.com" /></div>';
            html += '<div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>';
            html += '<input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" /></div>';
            html += '<button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Ingresar</button>';
            html += '</form>';
            html += '<div class="mt-6 p-3 bg-gray-100 rounded-lg text-xs text-gray-700">';
            html += '<strong>Prueba:</strong><br/>admin@test.com / admin123';
            html += '</div>';
            html += '</div></div>';
            return html;
        }

        function renderHeader() {
            let rolTexto = { admin: '👑 Admin', registrador_boleto: '💵 Reg.Boleto', registrador_entrada: '🎟️ Reg.Entrada', visualizador: '👁️ Visualizador' }[appState.user.rol];
            let html = '<header class="bg-white shadow"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">';
            html += '<div><h1 class="text-xl font-bold text-gray-800">🎭 Boletería CNA</h1>';
            html += '<p class="text-xs text-gray-500">' + rolTexto + '</p></div>';
            html += '<div class="flex items-center gap-3"><span class="text-xs text-gray-600">' + appState.user.email + '</span>';
            html += '<button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Salir</button></div></div></header>';
            return html;
        }

        function renderNav() {
            let items = [];
            if (appState.user.rol === 'admin') {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Registro de Obras' },
                    { id: 'salas', label: '🏛️ Salas' },
                    { id: 'ventas', label: '💵 Ventas' },
                    { id: 'entrada', label: '🎟️ Entrada' },
                    { id: 'calendario', label: '📅 Calendario' },
                    { id: 'reportes', label: '📈 Reportes' },
                    { id: 'historial', label: '📝 Historial' }
                ];
            } else if (appState.user.rol === 'registrador_boleto') {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Registro de Obras' },
                    { id: 'ventas', label: '💵 Ventas' },
                    { id: 'calendario', label: '📅 Calendario' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else if (appState.user.rol === 'registrador_entrada') {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Registro de Obras' },
                    { id: 'entrada', label: '🎟️ Entrada' },
                    { id: 'calendario', label: '📅 Calendario' },
                    { id: 'reportes', label: '📈 Reportes' }
                ];
            } else {
                items = [
                    { id: 'dashboard', label: '📊 Dashboard' },
                    { id: 'obras', label: '📚 Registro de Obras' },
                    { id: 'calendario', label: '📅 Calendario' }
                ];
            }
            let html = '<div class="bg-white border-b"><div class="max-w-7xl mx-auto px-4 flex gap-2 py-3 overflow-x-auto">';
            items.forEach(page => {
                const active = appState.currentPage === page.id;
                html += '<button onclick="changePage(\'' + page.id + '\')" class="px-3 py-2 rounded text-sm font-medium whitespace-nowrap transition ' + (active ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100') + '">' + page.label + '</button>';
            });
            html += '</div></div>';
            return html;
        }

        function renderDashboard() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📊 Dashboard</h2>';

            let obrasFiltradas = appState.obras.filter(o => puedeVerObra(o));

            const totalVentas = appState.funciones.reduce((sum, f) => sum + (f.ventasAcumuladas || 0), 0);
            const totalMembresia = appState.obras.reduce((sum, o) => sum + (o.totalMembresia || 0), 0);
            html += '<div class="grid grid-cols-4 gap-2 mb-6">';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Obras</p><p class="text-2xl font-bold text-blue-600">' + obrasFiltradas.length + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Boletas</p><p class="text-2xl font-bold text-green-600">' + totalVentas + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Funciones</p><p class="text-2xl font-bold text-orange-600">' + appState.funciones.length + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Temporada</p><p class="text-2xl font-bold text-purple-600">1</p></div>';
            html += '</div>';

            const obrasBoleto = obrasFiltradas.filter(o => o.tipo === 'boleteria');
            const obrasEntrada = obrasFiltradas.filter(o => o.tipo === 'entrada_libre');

            html += '<div class="grid grid-cols-2 gap-6">';

            if (obrasBoleto.length > 0) {
                html += '<div><h3 class="text-lg font-bold mb-3">💵 Obras con Boletería</h3>';
                html += '<div class="grid grid-cols-1 gap-4">';
                obrasBoleto.forEach(obra => {
                    const sala = getSala(obra.salaId);
                    const funciones = getFuncionesObra(obra.id);
                    const totalVentas = funciones.reduce((sum, f) => sum + (f.ventasAcumuladas || 0), 0);
                    const totalDisponible = funciones.reduce((sum, f) => sum + Math.max(0, (sala?.aforo || 0) - (f.cortesias || 0)), 0);
                    
                    html += '<div class="bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg" onclick="viewObra(\'' + obra.id + '\')">';
                    html += '<div class="flex justify-between items-start mb-3">';
                    html += '<div><h4 class="font-bold text-base text-gray-800">' + obra.nombre + '</h4>';
                    html += '<p class="text-xs text-gray-600">' + obra.artista + ' | ' + sala?.nombre + '</p></div>';
                    html += '<button onclick="event.stopPropagation(); abrirGraficoVentas(\'' + obra.id + '\')" class="text-blue-600 hover:text-blue-800 text-lg">📊</button>';
                    html += '</div>';
                    
                    // Total de ventas con disponible
                    html += '<div class="bg-blue-50 p-3 rounded mb-3 border-l-4 border-blue-500">';
                    html += '<p class="text-xs text-gray-600">Total Vendido / Disponible</p>';
                    html += '<p class="text-2xl font-bold text-blue-600">' + totalVentas + ' / ' + totalDisponible + ' boletas</p>';
                    html += '</div>';
                    
                    // Funciones con su % individual
                    html += '<div class="bg-gray-50 p-3 rounded">';
                    funciones.forEach(f => {
                        const ventasFunc = (f.ventasAcumuladas || 0);
                        const aforo = sala?.aforo || 1;
                        const cortesiasEntregadas = f.cortesiasEntregadas || 0;
                        const disponible = Math.max(1, aforo - cortesiasEntregadas);
                        const porcenVenta = Math.round((ventasFunc / disponible) * 100);
                        
                        const diasPorVender = calcularDiasPorVender(f.fecha);
                        
                        let colorVenta = 'text-red-600';
                        if (porcenVenta >= 70) colorVenta = 'text-green-600';
                        else if (porcenVenta >= 40) colorVenta = 'text-yellow-600';
                        
                        let colorDias = 'text-red-600';
                        if (diasPorVender === 'N/A') colorDias = 'text-gray-600';
                        else if (diasPorVender >= 60) colorDias = 'text-green-600';
                        else if (diasPorVender >= 30) colorDias = 'text-yellow-600';
                        
                        html += '<div class="text-xs mb-2">';
                        html += '<strong>' + formatearFecha(f.fecha) + '</strong> ' + formatearHora(f.hora) + ' | ';
                        html += '<span class="' + colorVenta + ' font-bold">' + porcenVenta + '%</span> | ';
                        html += '<span class="' + colorDias + ' font-bold">' + diasPorVender + 'd</span>';
                        html += '</div>';
                    });
                    html += '</div>';
                    html += '</div>';
                });
                html += '</div></div>';
            }

            if (obrasEntrada.length > 0) {
                html += '<div><h3 class="text-lg font-bold mb-3">🎟️ Obras con Entrada Libre</h3>';
                html += '<div class="grid grid-cols-1 gap-4">';

                    const sala = getSala(obra.salaId);
                    const funciones = getFuncionesObra(obra.id);
                    
                    html += '<div class="bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg" onclick="viewObra(\'' + obra.id + '\')">';

                    html += '<div><h4 class="font-bold text-base text-gray-800">' + obra.nombre + '</h4>';
                    html += '<p class="text-xs text-gray-600">' + obra.artista + ' | ' + sala?.nombre + '</p></div>';
                    html += '<button onclick="event.stopPropagation(); abrirGraficoVentas(\'' + obra.id + '\')" class="text-blue-600 hover:text-blue-800 text-lg">📊</button>';

                    // Funciones
                    html += '<div class="bg-gray-50 p-3 rounded mb-3">';

                        if (diasPorVender === 'N/A') colorDias = 'text-gray-600';
                        else if (diasPorVender >= 60) colorDias = 'text-green-600';
                        else if (diasPorVender >= 30) colorDias = 'text-yellow-600';
                        
                        html += '<div class="text-xs mb-2"><strong>' + formatearFecha(f.fecha) + '</strong> ' + formatearHora(f.hora) + ' | <span class="' + colorDias + ' font-bold">' + diasPorVender + 'd por vender</span></div>';
                    });
                    html += '</div>';
                    html += '</div>';
                });
                html += '</div></div>';
            }

            html += '</div></main></div>';
            return html;
        }

        function renderObras() {

        function deleteObra(obraId) {
            if (confirm('¿Eliminar esta obra? Se borrarán todas sus acciones y registros.')) {
                appState.obras = appState.obras.filter(o => o.id !== obraId);
                appState.acciones = appState.acciones.filter(a => a.obraId !== obraId);
                appState.ventas = appState.ventas.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId !== obraId;
                });
                appState.entrada_libre = appState.entrada_libre.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId !== obraId;
                });
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
                saveData();
                alert('✅ Obra eliminada');
                render();
            }
        }

            appState.viewingObraId = obraId;
            appState.currentPage = 'ver-obra';
            render();
        }

                { label: 'Piezas Desarrolladas', ok: obra.piezasDesarrolladas, fecha: obra.fechaPiezasDesarrolladas },
                { label: 'Video Disponible', ok: obra.videoDisponible, fecha: obra.fechaVideoPatua },
                { label: 'Salida en Tiquetera', ok: !!obra.fechaTiquetera, fecha: obra.fechaTiquetera },
                { label: 'Salida en Redes', ok: !!obra.fechaRedes, fecha: obra.fechaRedes },
                { label: 'Salida en Pauta', ok: !!obra.fechaPauta, fecha: obra.fechaPauta }

            html += '<div><label class="block text-sm font-medium mb-1 text-gray-700">⏰ Hora</label><input type="time" id="funcionHora" required class="w-full px-3 py-2 border-2 border-gray-300 rounded text-sm font-medium" /></div>';
            html += '</div>';
            html += '<button type="submit" class="w-full bg-green-600 text-white px-4 py-3 rounded text-base font-bold hover:bg-green-700">✅ AGREGAR FUNCIÓN</button>';
            html += '</form>';
            html += '</div>';

            // Lista de funciones

                html += '<p class="text-gray-600 text-sm">Crea funciones primero</p>';
            } else {
                funciones.forEach(f => {
                    const sala_info = getSala(obra.salaId);
                    html += '<div class="bg-white p-3 rounded border-l-4 border-yellow-500">';
                    html += '<div class="flex justify-between items-center mb-2">';
                    html += '<strong>' + formatearFecha(f.fecha) + ' ' + formatearHora(f.hora) + '</strong>';
                    html += '<span class="text-xs text-gray-600">Aforo: ' + (sala_info?.aforo || 0) + '</span>';
                    html += '</div>';
                    html += '<label class="block text-sm font-medium mb-1">Boletas vendidas hasta ayer</label>';
                    html += '<input type="number" class="w-full px-3 py-2 border rounded text-sm" data-baseline-' + f.id + ' value="' + (f.ventasAcumuladas || 0) + '" min="0" max="' + (sala_info?.aforo || 1000) + '" />';
                    html += '</div>';
                });
            }
            html += '<button type="submit" class="w-full bg-yellow-600 text-white px-4 py-3 rounded text-base font-bold hover:bg-yellow-700">💾 Guardar Baseline</button>';
            html += '</form>';

            const totalVentasObra = funciones.reduce((sum, f) => sum + (f.ventasAcumuladas || 0), 0);
            const totalCortesias = funciones.reduce((sum, f) => sum + (f.cortesias || 0), 0);
            const totalCortesiasEntregadas = funciones.reduce((sum, f) => sum + (f.cortesiasEntregadas || 0), 0);
            const aforo = sala?.aforo || 0;
            const disponible = funciones.reduce((sum, f) => sum + Math.max(0, aforo - (f.cortesias || 0)), 0);
            html += '<div class="bg-purple-50 border-2 border-purple-300 p-6 rounded shadow mb-6">';
            html += '<h3 class="text-lg font-bold mb-4 text-purple-900">💰 VENTAS Y CORTESÍAS</h3>';

            html += '<div class="p-3 bg-white rounded border"><strong class="text-sm">Cortesías Planeadas</strong><div class="text-2xl font-bold text-yellow-600">' + totalCortesias + '</div></div>';
            html += '<div class="p-3 bg-white rounded border"><strong class="text-sm">Cortesías Entregadas</strong><div class="text-2xl font-bold text-green-600">' + totalCortesiasEntregadas + '</div></div>';

            html += '</div>';

            html += '<div class="bg-white p-6 rounded shadow"><h3 class="text-xl font-bold mb-4">📋 Acciones Registradas (' + acciones.length + ')</h3>';

            html += '<div class="mb-3"><label class="block text-sm font-medium mb-1">Descripción</label><input type="text" id="accionDesc" required placeholder="Ej: Publicado en redes, Enviado correo..." class="w-full px-3 py-2 border rounded text-sm" /></div>';
            html += '<button type="submit" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">+ Agregar Acción</button>';
            html += '</form>';

            if (acciones.length === 0) {
                html += '<p class="text-gray-500 text-sm">Sin acciones registradas</p>';
            } else {
                html += '<div class="space-y-3">';
                acciones.slice().reverse().forEach(a => {
                    html += '<div class="p-3 bg-gray-50 rounded border-l-4 border-blue-500">';
                    html += '<div class="flex justify-between items-start mb-2">';
                    html += '<div><strong>' + a.descripcion + '</strong></div>';
                    html += '<button onclick="toggleAccionHecho(\'' + a.id + '\')" class="' + (a.hecho ? 'bg-green-500' : 'bg-gray-400') + ' text-white px-2 py-1 rounded text-xs">' + (a.hecho ? '✅ Hecho' : '❌ Pendiente') + '</button>';
                    html += '</div>';
                    html += '<p class="text-xs text-gray-600">' + a.fecha + ' por ' + a.usuario + '</p>';
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div></main></div>';
            return html;
        }

        function handleAgregarFuncion(e, obraId) {
            e.preventDefault();
            const fecha = document.getElementById('funcionFecha').value;
            const hora = document.getElementById('funcionHora').value;
            if (!fecha || !hora) {
                alert('Por favor completa los campos de fecha y hora');
                return;
            }
            appState.funciones.push({
                id: Date.now().toString(),
                obraId,
                fecha,
                hora,
                estado: 'programada',
                ventasAcumuladas: 0,
                ventasPorDia: [],
                cortesias: 0,
                cortesiasEntregadas: 0
            });
            saveData();
            document.getElementById('funcionFecha').value = '';
            document.getElementById('funcionHora').value = '';
            document.getElementById('funcionFecha').focus();
        }

        function deleteFuncion(funcionId) {
            if (confirm('¿Eliminar esta función?')) {
                appState.funciones = appState.funciones.filter(f => f.id !== funcionId);
                appState.ventas = appState.ventas.filter(v => v.funcionId !== funcionId);
                appState.entrada_libre = appState.entrada_libre.filter(v => v.funcionId !== funcionId);
                saveData();
                alert('✅ Función eliminada');
                render();
            }
        }

        function guardarBaselineVentas(event, obraId) {
            event.preventDefault();
            const funciones = getFuncionesObra(obraId);
            let actualizadas = 0;
            
            // Calcular fecha de ayer
            const hoy = new Date();
            const ayer = new Date(hoy);
            ayer.setDate(ayer.getDate() - 1);
            const fechaAyer = ayer.toISOString().split('T')[0];

            funciones.forEach(f => {
                const input = document.querySelector('input[data-baseline-' + f.id + ']');
                if (input) {
                    const boletas = parseInt(input.value) || 0;
                    f.ventasAcumuladas = boletas;
                    
                    // Registrar en ventasPorDia para que el gráfico lo muestre
                    if (!f.ventasPorDia) f.ventasPorDia = [];
                    f.ventasPorDia = [{ fecha: fechaAyer, boletas: boletas }];
                    
                    actualizadas++;
                }
            });

            if (actualizadas > 0) {
                saveData();
                alert('✅ Baseline de ' + actualizadas + ' función(es) guardado');
                render();
            }
        }

        function handleAgregarAccion(e, obraId) {
            e.preventDefault();
            const desc = document.getElementById('accionDesc').value;
            const hoy = new Date('2026-08-16');
            appState.acciones.push({
                id: Date.now().toString(),
                obraId,
                descripcion: desc,
                fecha: hoy.toLocaleDateString(),
                usuario: appState.user.email,
                hecho: false
            });
            saveData();
            document.getElementById('accionDesc').value = '';
            render();
        }

        function toggleAccionHecho(accionId) {
            const accion = appState.acciones.find(a => a.id === accionId);
            if (accion) {
                accion.hecho = !accion.hecho;
                saveData();
                render();
            }
        }

        function openCrearObra() {
            appState.editingObra = null;
            appState.editingFunciones = [];
            appState.editingMultipleFunciones = false;
            appState.currentPage = 'crear-obra';
            render();
        }

        function openEditarObra(id) {
            appState.editingObra = appState.obras.find(o => o.id === id);
            appState.editingFunciones = getFuncionesObra(id).map(f => ({...f}));
            appState.editingMultipleFunciones = appState.editingFunciones.length > 1;
            appState.currentPage = 'crear-obra';
            appState.viewingObraId = null;
            render();
        }

        function handleCheckPiezas(e) {
            const hoy = new Date('2026-08-16').toISOString().split('T')[0];
            if (e.target.checked && !document.getElementById('obraFechaPiezas').value) {
                document.getElementById('obraFechaPiezas').value = hoy;
            }
        }

        function handleCheckVideo(e) {
            const hoy = new Date('2026-08-16').toISOString().split('T')[0];
            if (e.target.checked && !document.getElementById('obraFechaVideo').value) {
                document.getElementById('obraFechaVideo').value = hoy;
            }
        }

        function toggleMultipleFunciones(e) {
            appState.editingMultipleFunciones = e.target.checked;
            updateFunctionsSectionDisplay();
        }

        function updateFunctionsSectionDisplay() {
            const container = document.getElementById('funcionesSectionContainer');
            if (!container) return;
            
            let html = '';
            
            // Si NO múltiples (única función)
            if (!appState.editingMultipleFunciones) {
                html += '<div class="space-y-2">';
                html += '<label class="block text-sm font-medium text-gray-700">Una función</label>';
                html += '<div class="grid grid-cols-2 gap-2">';
                html += '<input type="date" id="funcionUnicaFecha" value="' + (appState.editingFunciones[0]?.fecha || '') + '" class="px-3 py-2 border-2 border-blue-300 rounded text-sm font-medium" />';
                html += '<input type="time" id="funcionUnicaHora" value="' + (appState.editingFunciones[0]?.hora || '') + '" class="px-3 py-2 border-2 border-blue-300 rounded text-sm font-medium" />';
                html += '</div>';
                html += '</div>';
            } else {
                // Si SÍ múltiples
                html += '<div class="mb-3 p-3 bg-blue-100 rounded border border-blue-400 text-sm text-blue-900">';
                html += '<strong>💡 Agrega todas las funciones que necesites.</strong>';
                html += '</div>';
                
                html += '<div class="mb-4 space-y-2">';
                html += '<div class="grid grid-cols-2 gap-2">';
                html += '<input type="date" id="nuevaFuncionFecha" class="px-3 py-2 border-2 border-blue-300 rounded text-sm font-medium" />';
                html += '<input type="time" id="nuevaFuncionHora" class="px-3 py-2 border-2 border-blue-300 rounded text-sm font-medium" />';
                html += '</div>';
                html += '<button type="button" onclick="handleAgregarFuncionEnFormulario()" class="w-full bg-blue-600 text-white px-3 py-2 rounded text-sm hover:bg-blue-700 font-bold">+ AGREGAR FUNCIÓN</button>';
                html += '</div>';
                
                html += '<div id="funcionesAgregadasContainer">';
                if (appState.editingFunciones.length > 0) {
                    html += '<div class="bg-white rounded p-3 mb-3">';
                    html += '<h4 class="text-sm font-bold mb-2 text-blue-900">✅ Funciones agregadas (' + appState.editingFunciones.length + '):</h4>';
                    html += '<div class="space-y-2">';
                    appState.editingFunciones.forEach(f => {
                        html += '<div class="p-2 bg-blue-100 rounded border border-blue-300 flex justify-between items-center">';
                        html += '<div class="text-sm"><strong>' + f.fecha + '</strong> · ' + f.hora + '</div>';
                        html += '<button type="button" onclick="eliminarFuncionEnFormulario(\'' + f.id + '\')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600 font-bold">×</button>';
                        html += '</div>';
                    });
                    html += '</div>';
                    html += '</div>';
                } else {
                    html += '<p class="text-sm text-gray-500 italic">Sin funciones aún</p>';
                }
                html += '</div>';
            }
            
            container.innerHTML = html;
        }

        function handleAgregarFuncionEnFormulario() {
            const fecha = document.getElementById('nuevaFuncionFecha').value;
            const hora = document.getElementById('nuevaFuncionHora').value;
            if (!fecha || !hora) {
                alert('Completa fecha y hora');
                return;
            }
            appState.editingFunciones.push({
                id: 'temp-' + Date.now(),
                fecha,

        function handleGuardarObra(e) {
            e.preventDefault();
            
            let functionesAGuardar = [];

            // Si es una función única, tomarla del input
            if (!appState.editingMultipleFunciones) {
                const fecha = document.getElementById('funcionUnicaFecha').value;
                const hora = document.getElementById('funcionUnicaHora').value;
                if (!fecha || !hora) {
                    alert('⚠️ Debes ingresar al menos la fecha y hora de la función');
                    return;
                }
                functionesAGuardar.push({ fecha, hora });
            } else {
                if (appState.editingFunciones.length === 0) {
                    alert('⚠️ Debes agregar al menos una función');
                    return;
                }
                functionesAGuardar = appState.editingFunciones;
            }

            // Obtener todas las fechas
            const fechaTiquetera = document.getElementById('obraFechaTiquetera').value;
            const fechaRedes = document.getElementById('obraFechaRedes').value;
            const fechaPauta = document.getElementById('obraFechaPauta').value;

            // Validar que tiquetera sea obligatoria
            if (!fechaTiquetera) {
                alert('⚠️ Fecha de tiquetera es obligatoria');
                return;
            }

            // Calcular primera y última función
            const fechas = functionesAGuardar.map(f => new Date(f.fecha));
            const primeraFuncion = new Date(Math.min(...fechas));
            const ultimaFuncion = new Date(Math.max(...fechas));

            // Validar que las funciones no sean en el pasado
            const hoy = new Date('2026-08-16');
            for (let f of functionesAGuardar) {
                const fechaFuncion = new Date(f.fecha);
                if (fechaFuncion < hoy) {
                    alert('⚠️ Error: Las funciones no pueden ser en fechas pasadas.\n\nFecha de función: ' + f.fecha + '\nFecha de hoy: ' + hoy.toISOString().split('T')[0]);
                    return;
                }
            }

            // Validar orden de fechas: Tiquetera < Redes < Pauta < Funciones
            const tiquetera = new Date(fechaTiquetera);

            // Tiquetera < Primera función
            if (tiquetera >= primeraFuncion) {
                alert('⚠️ Error: Fecha tiquetera debe ser anterior a la primera función.\n\nTiquetera: ' + fechaTiquetera + '\nPrimera función: ' + primeraFuncion.toISOString().split('T')[0]);
                return;
            }

            // Si redes existe, validar tiquetera < redes
            if (fechaRedes) {
                const redes = new Date(fechaRedes);
                if (tiquetera >= redes) {
                    alert('⚠️ Error: Fecha tiquetera debe ser anterior a redes.\n\nTiquetera: ' + fechaTiquetera + '\nRedes: ' + fechaRedes);
                    return;
                }
                // Si pauta existe, validar redes < pauta
                if (fechaPauta) {
                    const pauta = new Date(fechaPauta);
                    if (redes >= pauta) {
                        alert('⚠️ Error: Fecha redes debe ser anterior a pauta.\n\nRedes: ' + fechaRedes + '\nPauta: ' + fechaPauta);
                        return;
                    }
                    // Validar pauta < primera función
                    if (pauta >= primeraFuncion) {
                        alert('⚠️ Error: Fecha pauta debe ser anterior a primera función.\n\nPauta: ' + fechaPauta + '\nPrimera función: ' + primeraFuncion.toISOString().split('T')[0]);
                        return;
                    }
                }
            } else if (fechaPauta) {
                // Si hay pauta pero no redes, validar tiquetera < pauta
                const pauta = new Date(fechaPauta);
                if (tiquetera >= pauta) {
                    alert('⚠️ Error: Fecha tiquetera debe ser anterior a pauta.\n\nTiquetera: ' + fechaTiquetera + '\nPauta: ' + fechaPauta);
                    return;
                }
                // Validar pauta < primera función
                if (pauta >= primeraFuncion) {
                    alert('⚠️ Error: Fecha pauta debe ser anterior a primera función.\n\nPauta: ' + fechaPauta + '\nPrimera función: ' + primeraFuncion.toISOString().split('T')[0]);
                    return;
                }
            }

            const data = {
                nombre: document.getElementById('obraNombre').value,
                artista: document.getElementById('obraArtista').value,
                salaId: document.getElementById('obraSala').value,
                tipo: document.getElementById('obraTipo').value,
                cortesias: parseInt(document.getElementById('obraCortesias').value) || 0,
                fechaTiquetera: fechaTiquetera,
                fechaUltimaFuncion: ultimaFuncion.toISOString().split('T')[0],
                fechaRedes: fechaRedes || null,
                fechaPauta: fechaPauta || null,
                piezasDesarrolladas: document.getElementById('obraPiezas').checked,
                fechaPiezasDesarrolladas: document.getElementById('obraFechaPiezas').value || null,
                videoDisponible: document.getElementById('obraVideo').checked,
                fechaVideoPatua: document.getElementById('obraFechaVideo').value || null
            };

            let obraId;
            if (appState.editingObra) {
                Object.assign(appState.editingObra, data);
                obraId = appState.editingObra.id;
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
            } else {
                obraId = Date.now().toString();
                appState.obras.push({ id: obraId, ...data });
            }

            // Guardar funciones
            functionesAGuardar.forEach(f => {
                appState.funciones.push({
                    id: f.id?.startsWith('temp-') ? ('fn-' + Date.now() + Math.random()).replace('.', '') : (f.id || Date.now().toString()),
                    obraId: obraId,
                    fecha: f.fecha,
                    hora: f.hora,
                    estado: 'programada',
                    ventasAcumuladas: 0,
                    ventasPorDia: [],
                    cortesias: 0,
                    cortesiasEntregadas: 0
                });
            });

            saveData();
            appState.currentPage = 'obras';
            appState.editingObra = null;
            appState.editingFunciones = [];
            appState.editingMultipleFunciones = false;
            alert('✅ Obra guardada correctamente');
            render();
        }

        function guardarCortesVentasFunciones(event) {
            event.preventDefault();
            const inputs = document.querySelectorAll('input[data-funcion-id]');
            let guardadas = 0;
            
            inputs.forEach(input => {
                const funcionId = input.getAttribute('data-funcion-id');
                const boletas = parseInt(input.value) || 0;
                
                if (boletas > 0) {
                    const funcion = appState.funciones.find(f => f.id === funcionId);
                    if (funcion) {
                        funcion.ventasAcumuladas = (funcion.ventasAcumuladas || 0) + boletas;
                        
                        // Registrar venta diaria
                        if (!funcion.ventasPorDia) funcion.ventasPorDia = [];
                        const hoy = new Date().toISOString().split('T')[0];
                        funcion.ventasPorDia.push({ fecha: hoy, boletas: boletas });
                        
                        appState.historial.push({
                            id: Date.now().toString(),
                            timestamp: new Date().toISOString(),
                            usuario: appState.user.email,
                            funcionId: funcionId,
                            accion: 'Registro de ventas',
                            detalles: 'Boletas: +' + boletas
                        });
                        
                        guardadas++;
                        input.value = '0';
                    }
                }
            });
            
            if (guardadas > 0) {
                saveData();
                alert('✅ ' + guardadas + ' función(es) actualizada(s)');
                render();
            } else {
                alert('⚠️ No hay ventas para registrar');
            }
        }

            html += '<div class="mb-4"><label class="block text-sm font-medium mb-1">Nombre de la Sala</label><input type="text" id="salaNombre" value="' + sala.nombre + '" required class="w-full px-3 py-2 border rounded text-sm" /></div>';
            html += '<div class="mb-4"><label class="block text-sm font-medium mb-1">Aforo</label><input type="number" id="salaAforo" value="' + sala.aforo + '" required min="1" class="w-full px-3 py-2 border rounded text-sm" /></div>';
            html += '<button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 mr-2">Guardar</button>';
            html += '<button type="button" onclick="changePage(\'salas\')" class="bg-gray-400 text-white px-4 py-2 rounded text-sm">Cancelar</button>';
            html += '</form></main></div>';
            return html;
        }

        function handleGuardarSala(e) {
            e.preventDefault();
            const nombre = document.getElementById('salaNombre').value;
            const aforo = parseInt(document.getElementById('salaAforo').value);

            if (appState.editingSala) {
                appState.editingSala.nombre = nombre;
                appState.editingSala.aforo = aforo;
            } else {
                appState.salas.push({ id: Date.now().toString(), nombre, aforo });
            }

            saveData();
            appState.currentPage = 'salas';
            appState.editingSala = null;
            render();
        }

        function deleteSala(id) {
            if (confirm('¿Eliminar esta sala?')) {
                appState.salas = appState.salas.filter(s => s.id !== id);
                saveData();
                render();
            }
        }

        function renderCalendario() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📅 Calendario de Funciones</h2>';
            html += '<div class="bg-white p-4 rounded shadow">';
            html += '<table class="w-full text-sm border-collapse">';
            html += '<thead><tr><th class="border p-2 text-left">Fecha</th><th class="border p-2 text-left">Obra</th><th class="border p-2 text-left">Hora</th><th class="border p-2 text-left">Tipo</th><th class="border p-2 text-left">Sala</th></tr></thead><tbody>';

            let obras_filtradas = appState.obras.filter(o => puedeVerObra(o));
            appState.funciones.sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).filter(f => obras_filtradas.some(o => o.id === f.obraId)).forEach(f => {
                const obra = appState.obras.find(o => o.id === f.obraId);
                const sala = getSala(obra.salaId);
                const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
                const color = obra.tipo === 'boleteria' ? 'bg-blue-50' : 'bg-purple-50';
                html += '<tr class="' + color + ' border"><td class="border p-2">' + f.fecha + '</td><td class="border p-2 cursor-pointer text-blue-600" onclick="viewObra(\'' + obra.id + '\')">' + obra.nombre + '</td><td class="border p-2">' + f.hora + '</td><td class="border p-2">' + icono + '</td><td class="border p-2">' + sala?.nombre + '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        function renderReportes() {
            let html = '<div class="min-h-screen bg-gray-50">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📈 Reportes</h2>';
            html += '<div class="grid grid-cols-2 gap-4">';
            html += '<div class="bg-white p-4 rounded shadow"><h3 class="font-bold mb-2">Resumen de Ventas</h3><p class="text-sm text-gray-600">Total ventas: ' + appState.ventas.length + '</p></div>';
            html += '<div class="bg-white p-4 rounded shadow"><h3 class="font-bold mb-2">Resumen Entrada Libre</h3><p class="text-sm text-gray-600">Total registros: ' + appState.entrada_libre.length + '</p></div>';
            html += '<div class="bg-white p-4 rounded shadow col-span-2"><h3 class="font-bold mb-3">Detalles por Obra</h3>';
            let obras_filtradas = appState.obras.filter(o => puedeVerObra(o));
            obras_filtradas.forEach(o => {
                const ventasObra = appState.ventas.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId === o.id;
                });
                const entradaObra = appState.entrada_libre.filter(v => {
                    const f = appState.funciones.find(x => x.id === v.funcionId);
                    return f?.obraId === o.id;
                });
                html += '<div class="mb-3 pb-3 border-b"><strong>' + o.nombre + '</strong>: Ventas: ' + ventasObra.length + ' | Entrada: ' + entradaObra.length + '</div>';
            });
            html += '</div></div></main></div>';
            return html;
        }

        function changePage(page) {
            appState.currentPage = page;
            appState.viewingObraId = null;
            appState.editingSala = null;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!appState.user) {
                app.innerHTML = renderLogin();
            } else {
                switch (appState.currentPage) {
                    case 'obras': app.innerHTML = renderObras(); break;
                    case 'ver-obra': app.innerHTML = renderVerObra(); break;
                    case 'crear-obra': 
                        app.innerHTML = renderCrearObra();
                        setTimeout(() => updateFunctionsSectionDisplay(), 0);
                        break;
                    case 'salas': app.innerHTML = renderSalas(); break;
                    case 'crear-sala': app.innerHTML = renderCrearSala(); break;
                    case 'ventas': app.innerHTML = renderVentas(); break;
                    case 'entrada': app.innerHTML = renderEntrada(); break;
                    case 'calendario': app.innerHTML = renderCalendario(); break;
                    case 'reportes': app.innerHTML = renderReportes(); break;
                    default: app.innerHTML = renderDashboard();
                }
                
                if (appState.showGraficoVentas) {
                    const modalHTML = '<div id="graficoModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">'
                        + '<div style="background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 800px; box-shadow: 0 20px 25px rgba(0,0,0,0.15);">'
                        + '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">'
                        + '<h3 style="margin: 0; font-size: 18px; font-weight: bold;">📊 Gráfico de Ventas Diarias</h3>'
                        + '<button onclick="cerrarGraficoVentas()" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0;">×</button>'
                        + '</div>'
                        + '<canvas id="chartVentas" style="max-height: 400px; min-height: 300px;"></canvas>'
                        + '</div>'
                        + '</div>';
                    app.innerHTML += modalHTML;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initData();
            const savedUser = localStorage.getItem('boleteria-user');
            if (savedUser) appState.user = JSON.parse(savedUser);
            render();
        });
    </script>
</body>
</html>
