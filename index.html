        async function initData() {
            const [salasRes, obrasRes, funcionesRes, historialRes, accionesRes, categoriasRes, agrupadoresRes] = await Promise.all([
                db.from('boleteria_salas').select('*').order('id'),
                db.from('boleteria_obras').select('*'),
                db.from('boleteria_funciones').select('*'),
                db.from('boleteria_historial').select('*').order('timestamp', { ascending: false }).limit(50),
                db.from('boleteria_acciones').select('*'),
                db.from('boleteria_categorias').select('*').order('nombre'),
                db.from('boleteria_agrupadores').select('*').order('nombre')
            ]);

            appState.categorias = (categoriasRes.data || []).map(r => ({ id: r.id, nombre: r.nombre }));
            appState.agrupadores = (agrupadoresRes.data || []).map(r => ({ id: r.id, nombre: r.nombre }));

            appState.salas = (salasRes.data || []).map(r => ({ id: r.id, nombre: r.nombre, aforo: r.aforo, color: r.color || '#8b5cf6' }));
            appState.obras = (obrasRes.data || []).map(obraFromDb);
            appState.funciones = (funcionesRes.data || []).map(funcionFromDb);
            appState.historial = (historialRes.data || []).map(historialFromDb);
            appState.acciones = (accionesRes.data || []).map(accionFromDb);

            // Primera vez: sembrar salas por defecto si la base está vacía
            if (appState.salas.length === 0) {
                const defaultSalas = [
                    { id: '1', nombre: 'Sala Fanny Mikey', aforo: 222 },
                    { id: '2', nombre: 'Teatro Colón', aforo: 720 },
                    { id: '3', nombre: 'Sala Delia Zapata Olivella', aforo: 300 },
                    { id: '4', nombre: 'Auditorio Principal', aforo: 450 }
                ];
                await db.from('boleteria_salas').insert(defaultSalas);
                appState.salas = defaultSalas;
            }
        }

        // saveData sincroniza TODO el estado actual con Supabase (upsert).
        // Es una sync completa en cada llamada — adecuado para el volumen
        // de datos de este sistema (decenas de obras/funciones, no miles).
        async function saveData() {
            try {
                if (appState.salas.length) await db.from('boleteria_salas').upsert(appState.salas);
                if (appState.obras.length) await db.from('boleteria_obras').upsert(appState.obras.map(obraToDb));
                if (appState.funciones.length) await db.from('boleteria_funciones').upsert(appState.funciones.map(funcionToDb));
                if (appState.acciones.length) await db.from('boleteria_acciones').upsert(appState.acciones.map(accionToDb));
                if (appState.historial.length) {
                    const nuevos = appState.historial.filter(h => h._pendingInsert);
                    if (nuevos.length) {
                        await db.from('boleteria_historial').insert(nuevos.map(historialToDb));
                        nuevos.forEach(h => delete h._pendingInsert);
                    }
                }
            } catch (err) {
                console.error('Error guardando en Supabase:', err);
                alert('⚠️ Error al guardar en la base de datos. Revisa tu conexión e intenta de nuevo.');
            }
        }

        function calcularDiasDesde(fecha) {
            if (!fecha) return 0;
            const hoy = new Date();
            const inicio = parsearFechaLocal(fecha);
            const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, diff);
        }

        function calcularDiasParaVender(fechaTiquetera, fechaUltimaFuncion) {
            if (!fechaTiquetera || !fechaUltimaFuncion) return 0;
            const inicio = new Date(fechaTiquetera);
            const fin = new Date(fechaUltimaFuncion);
            const diff = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, diff);
        }

        function getAccionesObra(obraId) {
            return appState.acciones.filter(a => a.obraId === obraId);
        }

        function getFuncionesObra(obraId) {
            return appState.funciones.filter(f => f.obraId === obraId).sort((a, b) => (a.fecha + ' ' + (a.hora || '00:00')).localeCompare(b.fecha + ' ' + (b.hora || '00:00')));
        }

        function getPrimeraFuncion(obraId) {
            const funciones = getFuncionesObra(obraId);
            return funciones.length > 0 ? funciones[0] : null;
        }

        function getUltimaFuncion(obraId) {
            const funciones = getFuncionesObra(obraId);
            return funciones.length > 0 ? funciones[funciones.length - 1] : null;
        }

        function calcularDiasTotalesParaVender(fechaTiquetera, obraId) {
            if (!fechaTiquetera) return 'N/A';
            const ultimaFuncion = getUltimaFuncion(obraId);
            if (!ultimaFuncion) return 'N/A';
            const inicio = new Date(fechaTiquetera);
            const fin = new Date(ultimaFuncion.fecha);
            const dias = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, dias);
        }

        function calcularDiasPorVender(fecha) {
            if (!fecha || fecha === '' || fecha === null || fecha === undefined) return 'N/A';
            
            try {
                // Validar formato YYYY-MM-DD
                if (typeof fecha !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) {
                    return 'N/A';
                }
                
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);
                
                const partes = fecha.split('-');
                const fin = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
                
                if (isNaN(fin.getTime())) return 'N/A';
                
                const dias = Math.floor((fin - hoy) / (1000 * 60 * 60 * 24));
                return Math.max(0, dias);
            } catch (e) {
                console.error('Error calcularDiasPorVender:', fecha, e);
                return 'N/A';
            }
        }

        function parsearFechaLocal(fechaStr) {
            if (!fechaStr) return null;
            return new Date(fechaStr + 'T00:00:00');
        }

        function formatearFecha(fecha) {
            if (!fecha) return '-';
            const d = new Date(fecha + 'T00:00:00');
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const anio = d.getFullYear();
            return dia + '/' + mes + '/' + anio;
        }

        function formatearHora(hora) {
            if (!hora) return '-';
            return hora;  // Ya viene en formato 24h (HH:MM)
        }

        function getVentasAcumuladasPorDiaObra(obraId, campoArray, campoValor) {
            const funciones = getFuncionesObra(obraId);
            const porDia = {};

            funciones.forEach(f => {
                if (f[campoArray] && Array.isArray(f[campoArray])) {
                    f[campoArray].forEach(vd => {
                        if (!porDia[vd.fecha]) porDia[vd.fecha] = 0;
                        porDia[vd.fecha] += vd[campoValor];
                    });
                }
            });

            const fechas = Object.keys(porDia).sort();
            let acumulado = 0;
            const acumuladas = fechas.map(f => {
                acumulado += porDia[f];
                return acumulado;
            });

            return { fechas, boletasAcumuladas: acumuladas };
        }

        function abrirGraficoVentas(obraId) {
            appState.showGraficoVentas = true;
            appState.graficoVentasObraId = obraId;
            render();
            setTimeout(() => {
                const canvas = document.getElementById('chartVentas');
                if (canvas && window.Chart) {
                    const obra = appState.obras.find(o => o.id === obraId);
                    const funciones = getFuncionesObra(obraId);
                    const esEntradaLibre = obra.tipo === 'entrada_libre';

                    const datos = esEntradaLibre
                        ? getVentasAcumuladasPorDiaObra(obraId, 'registrosPorDia', 'registrados')
                        : getVentasAcumuladasPorDiaObra(obraId, 'ventasPorDia', 'boletas');

                    if (window.chartInstanceVentas) {
                        window.chartInstanceVentas.destroy();
                    }

                    // Si no hay datos, mostrar mensaje
                    if (datos.fechas.length === 0) {
                        const ctx = canvas.getContext('2d');
                        ctx.font = '16px Arial';
                        ctx.fillStyle = '#999';
                        ctx.textAlign = 'center';
                        ctx.fillText(esEntradaLibre ? 'Sin datos de registros' : 'Sin datos de ventas registradas', canvas.width / 2, canvas.height / 2);
                        return;
                    }

                    const fechaPrimeraFuncion = funciones.length > 0 ? funciones[0].fecha : null;
                    
                    window.chartInstanceVentas = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: datos.fechas,
                            datasets: [{
                                label: esEntradaLibre ? 'Registrados (acumulado)' : 'Boletas vendidas (acumulado)',
                                data: datos.boletasAcumuladas,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 6,
                                pointBackgroundColor: '#3b82f6',
                                pointBorderColor: '#1e40af',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: (esEntradaLibre ? 'Registros diarios: ' : 'Ventas diarias: ') + obra.nombre,
                                    font: { size: 16, weight: 'bold' }
                                },
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { stepSize: 1 }
                                }
                            }
                        }
                    });
                    
                    // Dibujar líneas timeline después de renderizar
                    setTimeout(() => {
                        const ctx = canvas.getContext('2d');
                        const xScale = window.chartInstanceVentas.scales.x;
                        const chartArea = window.chartInstanceVentas.chartArea;
                        const labels = window.chartInstanceVentas.data.labels;
                        
                        const lineas = [
                            { fecha: obra.fechaPiezasDesarrolladas, color: '#0ea5e9', label: ICONOS.piezas + ' Piezas' },
                            { fecha: obra.fechaTiquetera, color: '#10b981', label: ICONOS.tiquetera + ' Tiquetera' },
                            { fecha: obra.fechaRedes, color: '#3b82f6', label: '💬 Redes' },
                            { fecha: obra.fechaVideoPatua, color: '#ec4899', label: ICONOS.video + ' Video' },
                            { fecha: obra.fechaPauta, color: '#8b5cf6', label: ICONOS.pauta + ' Pauta' },
                            { fecha: fechaPrimeraFuncion, color: '#ef4444', label: ICONOS.estreno + ' Estreno' }
                        ];
                        
                        lineas.forEach(linea => {
                            if (!linea.fecha || labels.length === 0) return;

                            const fechaNum = new Date(linea.fecha).getTime();
                            const primerLabelNum = new Date(labels[0]).getTime();
                            const ultimoLabelNum = new Date(labels[labels.length - 1]).getTime();
                            let x = null;

                            if (fechaNum <= primerLabelNum) {
                                // El hito ocurrió antes de que empezaran las ventas registradas —
                                // se ubica al inicio del gráfico (antes no se dibujaba nada aquí)
                                x = chartArea.left;
                            } else if (fechaNum >= ultimoLabelNum) {
                                // El hito ocurrió después del último día con ventas registradas
                                x = chartArea.right;
                            } else {
                                const labelIndex = labels.indexOf(linea.fecha);
                                if (labelIndex !== -1) {
                                    x = xScale.getPixelForValue(labelIndex);
                                } else {
                                    for (let i = 0; i < labels.length - 1; i++) {
                                        const f1 = new Date(labels[i]).getTime();
                                        const f2 = new Date(labels[i + 1]).getTime();
                                        if (fechaNum >= f1 && fechaNum <= f2) {
                                            const p1 = xScale.getPixelForValue(i);
                                            const p2 = xScale.getPixelForValue(i + 1);
                                            x = p1 + ((fechaNum - f1) / (f2 - f1)) * (p2 - p1);
                                            break;
                                        }
                                    }
                                }
                            }

                            if (x === null || isNaN(x)) return;
                            
                            ctx.strokeStyle = linea.color;
                            ctx.lineWidth = 2;
                            ctx.setLineDash([5, 5]);
                            ctx.beginPath();
                            ctx.moveTo(x, chartArea.top);
                            ctx.lineTo(x, chartArea.bottom);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            
                            ctx.font = 'bold 11px Arial';
                            ctx.fillStyle = linea.color;
                            ctx.save();
                            ctx.translate(x + 5, chartArea.top + 15);
                            ctx.rotate(-Math.PI / 2);
                            ctx.textAlign = 'right';
                            ctx.fillText(linea.label, 0, 0);
                            ctx.restore();
                        });
                    }, 50);
                }
            }, 100);
        }

        function renderIconosEstado(obra) {
            const item = (activo, emoji, titulo) => {
                const badge = activo ? '' : '<span style="position:absolute; top:-4px; right:-4px; font-size:9px; background:#ef4444; color:white; border-radius:9999px; width:14px; height:14px; display:flex; align-items:center; justify-content:center; line-height:1; font-weight:bold;">✕</span>';
                return '<span title="' + titulo + (activo ? ' ✓ Listo' : ' — Pendiente') + '" style="position:relative; display:inline-block;">'
                    + '<span style="font-size:1.25rem; filter: ' + (activo ? 'none' : 'grayscale(1) opacity(0.4)') + ';">' + emoji + '</span>'
                    + badge
                    + '</span>';
            };
            let html = '<div class="flex gap-3 items-center">';
            html += item(!!obra.piezasDesarrolladas, ICONOS.piezas, 'Piezas Desarrolladas');
            if (obra.tipo === 'boleteria') {
                html += item(!!obra.fechaTiquetera, ICONOS.tiquetera, 'Tiquetera (en línea)');
                html += item(!!obra.fechaRedes, ICONOS.redes, 'Redes Sociales');
                html += item(!!obra.videoDisponible, ICONOS.video, 'Video para Pauta');
                html += item(!!obra.fechaPauta, ICONOS.pauta, 'Pauta Digital');
            } else {
                html += item(!!obra.linkRegistro, ICONOS.link, 'Link de Registro');
                html += item(!!obra.fechaRedes, ICONOS.redes, 'Redes Sociales');

            return html;
        }

        function filtrarDashboard() {

            render();
            const nuevoInput = document.getElementById('dashboardBuscador');
            if (nuevoInput) {
                nuevoInput.focus();
                nuevoInput.setSelectionRange(cursorPos, cursorPos);
            }
        }

        function renderDashboard() {
            let html = '<div class="min-h-screen bg-gray-50 md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6"><h2 class="text-xl font-bold mb-4">📊 Dashboard</h2>';

            let obrasFiltradas = appState.obras.filter(o => puedeVerObra(o));

            const totalVentas = appState.funciones.reduce((sum, f) => sum + (f.ventasAcumuladas || 0), 0);
            html += '<div class="grid grid-cols-3 gap-2 mb-6">';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Obras</p><p class="text-2xl font-bold text-blue-600">' + obrasFiltradas.length + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Boletas</p><p class="text-2xl font-bold text-green-600">' + totalVentas + '</p></div>';
            html += '<div class="bg-white p-3 rounded shadow"><p class="text-gray-500 text-xs">Total Funciones</p><p class="text-2xl font-bold text-orange-600">' + appState.funciones.length + '</p></div>';
            html += '</div>';

            // Buscador
            html += '<div class="mb-6"><div class="relative max-w-md">';
            html += '<input type="text" id="dashboardBuscador" oninput="filtrarDashboard()" value="' + (appState.dashboardBusqueda || '') + '" placeholder="🔍 Buscar por obra, artista, categoría, sala o temporada/festival..." class="w-full px-4 py-2 border rounded-lg text-sm shadow-sm" />';
            html += '</div></div>';

            const busqueda = (appState.dashboardBusqueda || '').toLowerCase().trim();
            if (busqueda) {
                obrasFiltradas = obrasFiltradas.filter(o => {
                    const sala = getSala(o.salaId);
                    const agrupador = appState.agrupadores.find(a => a.id === o.agrupadorId);
                    const tipoTexto = o.tipo === 'boleteria' ? 'boleteria boletería' : 'entrada libre';
                    return (o.nombre || '').toLowerCase().includes(busqueda) ||
                        (o.artista || '').toLowerCase().includes(busqueda) ||
                        (o.categoria || '').toLowerCase().includes(busqueda) ||
                        (sala?.nombre || '').toLowerCase().includes(busqueda) ||
                        (agrupador?.nombre || '').toLowerCase().includes(busqueda) ||
                        tipoTexto.includes(busqueda);
                });
            }

            if (busqueda && obrasFiltradas.length === 0) {
                html += '<p class="text-gray-500 text-sm mb-6">Sin resultados para "' + (appState.dashboardBusqueda || '') + '"</p>';
                html += '</main></div>';
                return html;
            }

            // Agrupar por Temporada/Festival/Encuentro
            const grupos = {};
            const ordenGrupos = [];
            appState.agrupadores.forEach(a => { grupos[a.id] = { nombre: a.nombre, obras: [] }; ordenGrupos.push(a.id); });
            grupos['__sin_agrupar__'] = { nombre: 'Sin Temporada / Festival / Encuentro asignado', obras: [] };
            ordenGrupos.push('__sin_agrupar__');

            obrasFiltradas.forEach(o => {
                const key = (o.agrupadorId && grupos[o.agrupadorId]) ? o.agrupadorId : '__sin_agrupar__';
                grupos[key].obras.push(o);
            });

            ordenGrupos.forEach(key => {
                const grupo = grupos[key];
                if (grupo.obras.length === 0) return;

                html += '<div class="mb-8">';
                html += '<h3 class="text-lg font-bold mb-3 flex items-center gap-2">🎪 ' + grupo.nombre + ' <span class="text-xs font-normal text-gray-500">(' + grupo.obras.length + ')</span></h3>';
                html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
                grupo.obras.forEach(obra => { html += renderTarjetaDashboard(obra); });
                html += '</div></div>';
            });

            html += '</main></div>';
            return html;
        }

        function renderTarjetaDashboard(obra) {
            const sala = getSala(obra.salaId);
            const funciones = getFuncionesObra(obra.id);
            const esBoleteria = obra.tipo === 'boleteria';

            let totalNum = 0, totalDen = 0;

            let filasFunciones = '';
            funciones.forEach(f => {
                let numerador, denominador, etiquetaIzq, etiquetaDer;
                if (esBoleteria) {
                    numerador = f.ventasAcumuladas || 0;
                    denominador = Math.max(1, (sala?.aforo || 0) - (f.cortesias || 0));
                    etiquetaIzq = numerador + ' vendidas';
                    etiquetaDer = Math.max(0, denominador - numerador) + ' por vender';
                } else {
                    numerador = f.registrados || 0;
                    denominador = sala?.aforo || 0;
                    etiquetaIzq = numerador + ' registrados';
                    etiquetaDer = Math.max(0, denominador - numerador) + ' cupos libres';
                }
                totalNum += numerador;
                totalDen += denominador;
                const pct = denominador > 0 ? Math.round((numerador / denominador) * 100) : 0;

                filasFunciones += '<div style="padding:6px 0; border-bottom:1px solid #f3f4f6;">';
                filasFunciones += '<div class="flex justify-between items-center">';
                filasFunciones += '<div class="text-xs text-gray-700">' + formatearFecha(f.fecha) + ' <span class="text-gray-400">' + formatearHora(f.hora) + '</span></div>';
                filasFunciones += '<span style="' + estiloPctBadge(pct) + ' font-size:11px; font-weight:bold;">' + pct + '%</span>';
                filasFunciones += '</div>';
                filasFunciones += '<div class="text-xs text-gray-500 mt-0.5">' + etiquetaIzq + ' · ' + etiquetaDer + '</div>';
                filasFunciones += '</div>';
            });

            const pctTotal = totalDen > 0 ? Math.round((totalNum / totalDen) * 100) : 0;

            let html = '<div onclick="viewObra(\'' + obra.id + '\')" style="display:flex; flex-direction:column; height:340px;" class="bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg">';

            // Encabezado fijo
            html += '<div class="flex justify-between items-start mb-1">';
            html += '<h4 class="font-bold text-sm text-gray-800" style="overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:80%;">' + (esBoleteria ? '💵' : '🎟️') + ' ' + obra.nombre + '</h4>';
            html += '<button onclick="event.stopPropagation(); abrirGraficoVentas(\'' + obra.id + '\')" class="text-blue-600 hover:text-blue-800 text-base flex-shrink-0">📊</button>';
            html += '</div>';
            html += '<p class="text-xs text-gray-500 mb-2">' + (sala?.nombre || '') + '</p>';
            html += '<div class="mb-2">' + renderIconosEstado(obra) + '</div>';

            // Lista de funciones (scrollable si hay muchas, para mantener tarjeta uniforme)
            html += '<div style="flex:1; overflow-y:auto; min-height:0;">';
            html += filasFunciones || '<p class="text-xs text-gray-400">Sin funciones</p>';
            html += '</div>';

            // Total fijo abajo
            html += '<div style="border-top:2px solid #e5e7eb; padding-top:8px; margin-top:8px;" class="flex justify-between items-center">';
            html += '<span class="text-xs font-bold text-gray-600">TOTAL</span>';
            html += '<span style="' + estiloPctBadge(pctTotal) + ' font-size:13px; font-weight:bold;">' + pctTotal + '%</span>';
            html += '</div>';
            html += '<div class="text-xs text-gray-500 mt-1">' + totalNum + ' / ' + totalDen + (esBoleteria ? ' boletas' : ' cupos') + '</div>';

            html += '</div>';
            return html;
        }

        function obraEstaFinalizada(obra) {
            if (obra.tipo === 'entrada_libre') {
                return obra.estadoEnlace === 'Finalizado';
            }
            const ultimaFunc = getUltimaFuncion(obra.id);
            if (!ultimaFunc) return false;
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            return parsearFechaLocal(ultimaFunc.fecha) < hoy;
        }

        function renderObras() {
            let html = '<div class="min-h-screen bg-gray-50 md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6">';

            if (tienePermiso('crear_obra')) {
                html += '<button onclick="openCrearObra()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 mb-4">+ Nueva Obra</button>';
            }

            let obrasFiltradas = appState.obras.filter(o => puedeVerObra(o));

            // Orden pedido: boletería activa, entrada libre activa, boletería finalizada, entrada libre finalizada
            const orden = (o) => {
                const finalizada = obraEstaFinalizada(o);
                if (o.tipo === 'boleteria' && !finalizada) return 0;
                if (o.tipo === 'entrada_libre' && !finalizada) return 1;
                if (o.tipo === 'boleteria' && finalizada) return 2;
                return 3;
            };
            obrasFiltradas = obrasFiltradas.slice().sort((a, b) => {
                const diff = orden(a) - orden(b);
                if (diff !== 0) return diff;
                const fA = getUltimaFuncion(a.id)?.fecha || '9999-99-99';
                const fB = getUltimaFuncion(b.id)?.fecha || '9999-99-99';
                return fA.localeCompare(fB);
            });

            html += '<div class="bg-white rounded shadow overflow-hidden"><table class="w-full text-sm">';
            html += '<thead class="bg-gray-100"><tr><th class="px-4 py-2 text-left">Obra</th><th class="px-4 py-2 text-left">Tipo</th><th class="px-4 py-2 text-left">Sala</th><th class="px-4 py-2 text-left">Tiquetera</th><th class="px-4 py-2 text-left">Última Fun.</th><th class="px-4 py-2 text-left">Días</th><th class="px-4 py-2">Acciones</th></tr></thead><tbody>';

            let seccionActual = null;
            obrasFiltradas.forEach(obra => {
                const finalizada = obraEstaFinalizada(obra);
                const seccionLabel = obra.tipo === 'boleteria'
                    ? (finalizada ? 'Boletería — Finalizadas' : 'Boletería — Activas')
                    : (finalizada ? 'Entrada Libre — Finalizadas' : 'Entrada Libre — Activas');
                if (seccionLabel !== seccionActual) {
                    seccionActual = seccionLabel;
                    html += '<tr class="bg-gray-200"><td colspan="7" class="px-4 py-1 text-xs font-bold text-gray-700">' + seccionLabel + '</td></tr>';
                }

                const sala = getSala(obra.salaId);
                const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
                const accionesCount = getAccionesObra(obra.id).length;
                const diasTotales = calcularDiasTotalesParaVender(obra.fechaTiquetera, obra.id);
                const ultimaFunc = getUltimaFuncion(obra.id);
                html += '<tr class="border-b hover:bg-gray-50' + (finalizada ? ' opacity-60' : '') + '"><td class="px-4 py-2 font-medium cursor-pointer text-blue-600" onclick="viewObra(\'' + obra.id + '\')">' + obra.nombre + '</td>';
                html += '<td class="px-4 py-2">' + icono + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + sala?.nombre + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + (obra.fechaTiquetera ? formatearFecha(obra.fechaTiquetera) : 'N/A') + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + (ultimaFunc ? formatearFecha(ultimaFunc.fecha) : '-') + '</td>';
                html += '<td class="px-4 py-2 text-xs font-bold">' + diasTotales + 'd</td>';
                html += '<td class="px-4 py-2 text-xs"><button onclick="viewObra(\'' + obra.id + '\')" class="text-blue-600 font-medium">Ver (' + accionesCount + ')</button>';
                if (tienePermiso('editar_obra')) html += ' <button onclick="openEditarObra(\'' + obra.id + '\')" class="text-green-600">Editar</button>';
                if (appState.user.rol === 'admin') html += ' <button onclick="deleteObra(\'' + obra.id + '\')" class="text-red-600">Eliminar</button>';
                html += '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        async function deleteObra(obraId) {
            if (confirm('¿Eliminar esta obra? Se borrarán todas sus funciones y acciones.')) {
                appState.obras = appState.obras.filter(o => o.id !== obraId);
                appState.acciones = appState.acciones.filter(a => a.obraId !== obraId);
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
                await db.from('boleteria_obras').delete().eq('id', obraId); // cascada borra funciones/acciones en la BD
                alert('✅ Obra eliminada');
                render();
            }
        }

        function viewObra(obraId) {
            appState.viewingObraId = obraId;
            appState.currentPage = 'ver-obra';
            render();
        }

        function renderVerObra() {
            const obra = appState.obras.find(o => o.id === appState.viewingObraId);
            if (!obra) return renderObras();
            
            const sala = getSala(obra.salaId);
            const acciones = getAccionesObra(obra.id);
            const funciones = getFuncionesObra(obra.id);
            const primeraFuncion = getPrimeraFuncion(obra.id);
            const ultimaFuncion = getUltimaFuncion(obra.id);
            const diasTotalesParaVender = calcularDiasTotalesParaVender(obra.fechaTiquetera, obra.id);
            const diasPorVender = ultimaFuncion ? calcularDiasPorVender(ultimaFuncion.fecha) : 'N/A';
            const canEdit = tienePermiso('editar_obra');

            let html = '<div class="min-h-screen bg-gray-50 md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-4xl mx-auto px-4 py-6">';
            html += '<button onclick="changePage(\'obras\')" class="text-blue-600 text-sm mb-4">← Volver</button>';
            html += '<div class="bg-white p-6 rounded shadow mb-6">';
            html += '<div class="flex justify-between items-start mb-4">';
            html += '<div><h2 class="text-2xl font-bold text-gray-800">' + obra.nombre + '</h2>';
            html += '<p class="text-gray-600">' + obra.artista + ' | ' + sala?.nombre + ' (Aforo: ' + sala?.aforo + ')</p>';
            html += '<p class="text-sm text-gray-500 mt-2"><strong>Categoría:</strong> ' + (obra.categoria || 'Sin categoría') + '</p></div>';
            html += '<div class="text-right"><span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">' + (obra.tipo === 'boleteria' ? '💵 Boletería' : '🎟️ Entrada Libre') + '</span></div>';
            html += '</div>';
            
            html += '<div class="grid grid-cols-2 gap-4 mb-4">';
            if (primeraFuncion) html += '<div><strong>Primera Función:</strong> ' + formatearFecha(primeraFuncion.fecha) + ' ' + formatearHora(primeraFuncion.hora) + '</div>';
            if (ultimaFuncion) html += '<div><strong>Última Función:</strong> ' + formatearFecha(ultimaFuncion.fecha) + ' ' + formatearHora(ultimaFuncion.hora) + '</div>';
            html += '<div><strong>Días totales para vender:</strong> <span class="font-bold text-blue-600">' + diasTotalesParaVender + ' días</span></div>';
            html += '<div><strong>Días por vender:</strong> <span class="font-bold text-orange-600">' + diasPorVender + ' días</span></div>';
            html += '</div>';

            // ALERTAS DE ESTADO CON FECHAS
            html += '<div class="grid grid-cols-1 gap-2 mb-4">';
            const alertas = [
                { label: 'Piezas Desarrolladas', ok: obra.piezasDesarrolladas, fecha: obra.fechaPiezasDesarrolladas },
                { label: 'Video Disponible', ok: obra.videoDisponible, fecha: obra.fechaVideoPatua },
                { label: 'Salida en Tiquetera', ok: !!obra.fechaTiquetera, fecha: obra.fechaTiquetera },
                { label: 'Salida en Redes', ok: !!obra.fechaRedes, fecha: obra.fechaRedes },
                { label: 'Salida en Pauta', ok: !!obra.fechaPauta, fecha: obra.fechaPauta }
            ];
            alertas.forEach(a => {
                const color = a.ok ? 'bg-green-50 border-green-300 text-green-800' : 'bg-red-50 border-red-300 text-red-800';
                const icon = a.ok ? '✅' : '⚠️';
                const fechaText = a.fecha ? ' (' + formatearFecha(a.fecha) + ')' : '';
                html += '<div class="p-3 rounded border-2 ' + color + ' text-sm font-medium">' + icon + ' ' + a.label + fechaText + '</div>';
            });
            html += '</div>';

            if (canEdit) {
                html += '<button onclick="openEditarObra(\'' + obra.id + '\')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">✏️ Editar Obra</button>';
            }
            html += '</div>';

            // ========== SECCIÓN DE FUNCIONES ==========
            html += '<div class="bg-green-50 border-2 border-green-300 p-6 rounded shadow mb-6">';

            html += '</div>';

            if (obra.tipo === 'boleteria') {

            const totalCortesias = funciones.reduce((sum, f) => sum + (f.cortesias || 0), 0);
            const totalCortesiasEntregadas = funciones.reduce((sum, f) => sum + (f.cortesiasEntregadas || 0), 0);

            html += '</div>';

            const totalAsistencia = funciones.reduce((sum, f) => sum + (f.asistenciaTotal || 0), 0);
            const aforoEL = sala?.aforo || 0;
            const aforoTotalEL = aforoEL * funciones.length;
            const pctOcupEL = aforoTotalEL > 0 ? Math.round((totalAsistencia / aforoTotalEL) * 100) : 0;

            html += '<h3 class="text-lg font-bold mb-4 text-purple-900">🎟️ REGISTROS Y ASISTENCIA</h3>';
            html += '<div class="grid grid-cols-4 gap-4 mb-4">';
            html += '<div class="p-3 bg-white rounded border"><strong class="text-sm">Total Registrados</strong><div class="text-2xl font-bold text-blue-600">' + totalRegistrados + '</div></div>';
            html += '<div class="p-3 bg-white rounded border"><strong class="text-sm">Total Actividades</strong><div class="text-2xl font-bold text-orange-600">' + funciones.length + '</div></div>';
            html += '<div class="p-3 bg-white rounded border"><strong class="text-sm">Asistencia Total</strong><div class="text-2xl font-bold text-green-600">' + totalAsistencia + '</div></div>';
            html += '<div class="p-3 bg-white rounded border"><strong class="text-sm">% Ocupación</strong><div class="text-2xl font-bold text-purple-600">' + pctOcupEL + '%</div></div>';
            html += '</div>';
            html += '</div>';
            }

            // Sección de Acciones
            html += '<div class="bg-white p-6 rounded shadow"><h3 class="text-xl font-bold mb-4">📋 Acciones Registradas (' + acciones.length + ')</h3>';
            html += '<form onsubmit="handleAgregarAccion(event, \'' + obra.id + '\')" class="mb-6 p-4 bg-gray-50 rounded border">';
            html += '<div class="mb-3"><label class="block text-sm font-medium mb-1">Descripción</label><input type="text" id="accionDesc" required placeholder="Ej: Publicado en redes, Enviado correo..." class="w-full px-3 py-2 border rounded text-sm" /></div>';

            html += '</form>';

            if (acciones.length === 0) {
                html += '<p class="text-gray-500 text-sm">Sin acciones registradas</p>';
            } else {
                html += '<div class="space-y-3">';
                acciones.slice().reverse().forEach(a => {
                    html += '<div class="p-3 bg-gray-50 rounded border-l-4 border-blue-500">';

                    html += '<div><strong>' + a.descripcion + '</strong></div>';

                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div></main></div>';
            return html;
        }

        function handleAgregarFuncion(e, obraId) {
            e.preventDefault();
            const fecha = document.getElementById('funcionFecha').value;
            const hora = document.getElementById('funcionHora').value;
            if (!fecha || !hora) {
                alert('Por favor completa los campos de fecha y hora');
                return;
            }
            appState.funciones.push({
                id: Date.now().toString(),
                obraId,
                fecha,
                hora,
                estado: 'programada',
                ventasAcumuladas: 0,
                ventasPorDia: [],
                cortesias: 0,
                cortesiasEntregadas: 0
            });
            saveData();
            document.getElementById('funcionFecha').value = '';
            document.getElementById('funcionHora').value = '';
            document.getElementById('funcionFecha').focus();
        }

        async function deleteFuncion(funcionId) {
            if (confirm('¿Eliminar esta función?')) {
                appState.funciones = appState.funciones.filter(f => f.id !== funcionId);
                await deleteFuncionDb(funcionId);
                alert('✅ Función eliminada');
                render();
            }
        }

        function iniciarEdicionFechaFuncion(funcionId) {
            appState.editingFuncionFechaId = funcionId;
            render();
        }

        function cancelarEdicionFechaFuncion() {
            appState.editingFuncionFechaId = null;
            render();
        }

        async function guardarEdicionFechaFuncion(event, funcionId) {
            event.preventDefault();
            const nuevaFecha = document.getElementById('editFuncionFecha').value;
            const nuevaHora = document.getElementById('editFuncionHora').value;
            const funcion = appState.funciones.find(f => f.id === funcionId);
            if (!funcion) return;

            const fechaAnterior = funcion.fecha;
            const horaAnterior = funcion.hora;

            if (fechaAnterior === nuevaFecha && horaAnterior === nuevaHora) {
                appState.editingFuncionFechaId = null;
                render();
                return;
            }

            funcion.fecha = nuevaFecha;
            funcion.hora = nuevaHora;

            appState.historial.push({
                id: Date.now().toString() + Math.random().toString(36).slice(2),
                timestamp: new Date().toISOString(),
                usuario: appState.user.email,
                funcionId: funcionId,
                accion: 'Cambio de fecha/hora de función',
                detalles: formatearFecha(fechaAnterior) + ' ' + formatearHora(horaAnterior) + ' → ' + formatearFecha(nuevaFecha) + ' ' + formatearHora(nuevaHora),
                _pendingInsert: true
            });

            appState.editingFuncionFechaId = null;
            await saveData();
            alert('✅ Fecha/hora actualizada. Quedó registrado en el historial.');
            render();
        }

        function verHistorialFuncion(funcionId) {
            appState.showHistorialFuncion = true;
            appState.historialFuncionId = funcionId;
            render();
        }

        function cerrarHistorialFuncion() {
            appState.showHistorialFuncion = false;
            appState.historialFuncionId = null;
            render();
        }

        function guardarBaselineVentas(event, obraId) {
            event.preventDefault();
            const funciones = getFuncionesObra(obraId);
            let actualizadas = 0;
            
            // Calcular fecha de ayer
            const hoy = new Date();
            const ayer = new Date(hoy);
            ayer.setDate(ayer.getDate() - 1);
            const fechaAyer = ayer.toISOString().split('T')[0];

            funciones.forEach(f => {
                const input = document.querySelector('input[data-baseline-' + f.id + ']');
                if (input) {
                    const boletas = parseInt(input.value) || 0;
                    f.ventasAcumuladas = boletas;
                    
                    // Registrar en ventasPorDia para que el gráfico lo muestre
                    if (!f.ventasPorDia) f.ventasPorDia = [];
                    f.ventasPorDia = [{ fecha: fechaAyer, boletas: boletas }];
                    
                    actualizadas++;
                }
            });

            if (actualizadas > 0) {
                saveData();
                alert('✅ Baseline de ' + actualizadas + ' función(es) guardado');
                render();
            }
        }

        function handleAgregarAccion(e, obraId) {
            e.preventDefault();
            const desc = document.getElementById('accionDesc').value;
            const hoy = new Date();
            appState.acciones.push({
                id: Date.now().toString(),
                obraId,
                descripcion: desc,
                fecha: hoy.toISOString().split('T')[0],
                usuario: appState.user.email,
                hecho: false
            });
            saveData();
            document.getElementById('accionDesc').value = '';
            render();
        }

        function toggleAccionHecho(accionId) {
            const accion = appState.acciones.find(a => a.id === accionId);
            if (accion) {
                accion.hecho = !accion.hecho;
                saveData();
                render();
            }
        }

            appState.editingObra = null;
            appState.editingFunciones = [];
            appState.editingMultipleFunciones = false;
            appState.currentPage = 'crear-obra';
            render();
        }

            appState.editingObra = appState.obras.find(o => o.id === id);

                html += '</div>';

                html += '</div>';
                
                html += '<div id="funcionesAgregadasContainer">';

                    html += '<div class="bg-white rounded p-3 mb-3">';

                    html += '</div>';
                } else {
                    html += '<p class="text-sm text-gray-500 italic">Sin funciones aún</p>';

                html += '</div>';
            }
            
            container.innerHTML = html;

        function handleAgregarFuncionEnFormulario() {
            const fecha = document.getElementById('nuevaFuncionFecha').value;
            const hora = document.getElementById('nuevaFuncionHora').value;
            if (!fecha || !hora) {
                alert('Completa fecha y hora');
                return;
            }
            appState.editingFunciones.push({
                id: 'temp-' + Date.now(),
                fecha,
                hora
            });
            document.getElementById('nuevaFuncionFecha').value = '';
            document.getElementById('nuevaFuncionHora').value = '';
            document.getElementById('nuevaFuncionFecha').focus();
            updateFunctionsListDisplay();
        }

        function updateFunctionsListDisplay() {
            const listContainer = document.getElementById('funcionesAgregadasContainer');
            if (!listContainer) return;
            
            let html = '';
            if (appState.editingFunciones.length > 0) {
                html += '<div class="bg-white rounded p-3 mb-3">';
                html += '<h4 class="text-sm font-bold mb-2 text-blue-900">✅ Funciones agregadas (' + appState.editingFunciones.length + '):</h4>';
                html += '<div class="space-y-2">';
                appState.editingFunciones.forEach(f => {
                    html += '<div class="p-2 bg-blue-100 rounded border border-blue-300 flex justify-between items-center">';
                    html += '<div class="text-sm"><strong>' + formatearFecha(f.fecha) + '</strong> · ' + formatearHora(f.hora) + '</div>';
                    html += '<button type="button" onclick="eliminarFuncionEnFormulario(\'' + f.id + '\')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600 font-bold">×</button>';
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            } else {
                html = '<p class="text-sm text-gray-500 italic">Sin funciones aún</p>';
            }
            
            listContainer.innerHTML = html;
        }

        function eliminarFuncionEnFormulario(tempId) {
            appState.editingFunciones = appState.editingFunciones.filter(f => f.id !== tempId);
            updateFunctionsListDisplay();
        }

        function toggleCamposTipo() {
            const tipo = document.getElementById('obraTipo').value;

        function handleGuardarObra(e) {
            e.preventDefault();
            
            let functionesAGuardar = [];

            // Si es una función única, tomarla del input
            if (!appState.editingMultipleFunciones) {
                const fecha = document.getElementById('funcionUnicaFecha').value;
                const hora = document.getElementById('funcionUnicaHora').value;
                if (!fecha || !hora) {
                    alert('⚠️ Debes ingresar al menos la fecha y hora de la función');
                    return;
                }
                functionesAGuardar.push({ fecha, hora });
            } else {
                if (appState.editingFunciones.length === 0) {
                    alert('⚠️ Debes agregar al menos una función');
                    return;
                }
                functionesAGuardar = appState.editingFunciones;
            }

            // Obtener todas las fechas
            const fechaTiquetera = document.getElementById('obraFechaTiquetera').value;
            const fechaRedes = document.getElementById('obraFechaRedes').value;
            const fechaPauta = document.getElementById('obraFechaPauta').value;

            // Calcular primera y última función
            const fechas = functionesAGuardar.map(f => parsearFechaLocal(f.fecha));
            const primeraFuncion = new Date(Math.min(...fechas));
            const ultimaFuncion = new Date(Math.max(...fechas));

            // Validar que las funciones no sean en el pasado (bloqueante)
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            for (let f of functionesAGuardar) {
                const fechaFuncion = parsearFechaLocal(f.fecha);
                if (fechaFuncion < hoy) {
                    alert('⚠️ Error: Las funciones no pueden ser en fechas pasadas.\n\nFecha de función: ' + formatearFecha(f.fecha) + '\nFecha de hoy: ' + formatearFecha(hoy.toISOString().split('T')[0]));
                    return;
                }
            }

            // Aviso NO bloqueante: si tiquetera/redes/pauta quedan después de la
            // primera función, o en un orden inusual, solo se advierte — el usuario
            // decide si es correcto (por ejemplo, obras que ya llevan tiempo en cartelera).
            const tiquetera = fechaTiquetera ? new Date(fechaTiquetera) : null;
            const redes = fechaRedes ? new Date(fechaRedes) : null;
            const pauta = fechaPauta ? new Date(fechaPauta) : null;
            const avisos = [];
            if (tiquetera && tiquetera >= primeraFuncion) avisos.push('la fecha en tiquetera es igual o posterior a la primera función');
            if (redes && redes >= primeraFuncion) avisos.push('la fecha de redes es igual o posterior a la primera función');
            if (pauta && pauta >= primeraFuncion) avisos.push('la fecha de pauta es igual o posterior a la primera función');
            if (redes && pauta && redes > pauta) avisos.push('la fecha de redes es posterior a la de pauta');
            if (avisos.length > 0) {
                const continuar = confirm('⚠️ Revisa estas fechas, parecen inusuales:\n\n- ' + avisos.join('\n- ') + '\n\n¿Confirmas que son correctas y quieres continuar?');
                if (!continuar) return;
            }


            const data = {
                nombre: document.getElementById('obraNombre').value,
                artista: document.getElementById('obraArtista').value,
                categoria: document.getElementById('obraCategoria').value,
                salaId: document.getElementById('obraSala').value,
                tipo: document.getElementById('obraTipo').value,
                agrupadorId: document.getElementById('obraAgrupador').value || null,
                cortesias: parseInt(document.getElementById('obraCortesias').value) || 0,
                fechaTiquetera: fechaTiquetera,
                fechaUltimaFuncion: ultimaFuncion.toISOString().split('T')[0],
                fechaRedes: fechaRedes || null,
                fechaPauta: fechaPauta || null,
                piezasDesarrolladas: document.getElementById('obraPiezas').checked,
                fechaPiezasDesarrolladas: document.getElementById('obraFechaPiezas').value || null,
                videoDisponible: document.getElementById('obraVideo').checked,
                fechaVideoPatua: document.getElementById('obraFechaVideo').value || null,
                linkRegistro: document.getElementById('obraLinkRegistro')?.value || null,
                fechaCreacionLink: document.getElementById('obraFechaCreacionLink')?.value || null,
                estadoEnlace: document.getElementById('obraEstadoEnlace')?.value || 'Activo'
            };

            let obraId;
            if (appState.editingObra) {
                Object.assign(appState.editingObra, data);
                obraId = appState.editingObra.id;
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
            } else {
                obraId = Date.now().toString();
                appState.obras.push({ id: obraId, ...data });
            }

            // Guardar funciones — preservando el progreso ya registrado
            // (ventas, cortesías, registrados, asistencia) cuando la función ya existía.
            // Antes esto se reseteaba a 0 en CADA edición de la obra, sin importar
            // qué campo se editara — bug corregido el 04/09.
            functionesAGuardar.forEach(f => {
                appState.funciones.push({
                    id: f.id?.startsWith('temp-') ? ('fn-' + Date.now() + Math.random()).replace('.', '') : (f.id || Date.now().toString()),
                    obraId: obraId,
                    fecha: f.fecha,
                    hora: f.hora,
                    estado: f.estado || 'programada',
                    ventasAcumuladas: f.ventasAcumuladas || 0,
                    ventasPorDia: f.ventasPorDia || [],
                    cortesias: f.cortesias || 0,
                    cortesiasEntregadas: f.cortesiasEntregadas || 0,
                    registrados: f.registrados || 0,
                    asistenciaTotal: f.asistenciaTotal || 0
                });
            });

            saveData();
            appState.currentPage = 'obras';
            appState.editingObra = null;
            appState.editingFunciones = [];
            appState.editingMultipleFunciones = false;
            alert('✅ Obra guardada correctamente');
            render();
        }

        function guardarCortesVentasFunciones(event) {
            event.preventDefault();
            const inputs = document.querySelectorAll('input[data-funcion-id]');
            let guardadas = 0;
            
            inputs.forEach(input => {
                const funcionId = input.getAttribute('data-funcion-id');
                const boletas = parseInt(input.value) || 0;
                
                if (boletas > 0) {
                    const funcion = appState.funciones.find(f => f.id === funcionId);
                    if (funcion) {
                        funcion.ventasAcumuladas = (funcion.ventasAcumuladas || 0) + boletas;
                        
                        // Registrar venta diaria
                        if (!funcion.ventasPorDia) funcion.ventasPorDia = [];
                        const hoy = new Date().toISOString().split('T')[0];
                        funcion.ventasPorDia.push({ fecha: hoy, boletas: boletas });
                        
                        appState.historial.push({
                            id: Date.now().toString() + Math.random().toString(36).slice(2),
                            timestamp: new Date().toISOString(),
                            usuario: appState.user.email,
                            funcionId: funcionId,
                            accion: 'Registro de ventas',
                            detalles: 'Boletas: +' + boletas,
                            _pendingInsert: true
                        });
                        
                        guardadas++;
                        input.value = '0';
                    }
                }
            });
            
            if (guardadas > 0) {
                saveData();
                alert('✅ ' + guardadas + ' función(es) actualizada(s)');
                render();
            } else {
                alert('⚠️ No hay ventas para registrar');
            }
        }

                    const diasRestantes = Math.floor((parsearFechaLocal(f.fecha) - hoy) / 86400000);

                    const cortesias = f.cortesias || 0;
                    const disponible = aforo - cortesias;
                    const pctRegistrados = disponible > 0 ? Math.round((registrados / disponible) * 100) : 0;
                    const asistencia = f.asistenciaTotal || 0;
                    const pctOcupacion = aforo > 0 ? Math.round((asistencia / aforo) * 100) : 0;

                    totRegistrados += registrados;
                    totCortesias += cortesias;
                    totAsistencia += asistencia;

                    let colorRestantes = diasRestantes < 0 ? 'text-red-600' : (diasRestantes <= 3 ? 'text-yellow-600' : 'text-green-600');

                const dispTotal = (aforo * funciones.length) - totCortesias;

        async function guardarInscritosHoy(event) {
            event.preventDefault();
            const inputs = document.querySelectorAll('input[data-entrada-funcion-id]');
            let guardados = 0;

            inputs.forEach(input => {
                const funcionId = input.getAttribute('data-entrada-funcion-id');
                const cantidad = parseInt(input.value) || 0;

                if (cantidad > 0) {
                    const funcion = appState.funciones.find(f => f.id === funcionId);
                    if (funcion) {
                        funcion.registrados = (funcion.registrados || 0) + cantidad;

                        if (!funcion.registrosPorDia) funcion.registrosPorDia = [];
                        const hoy = new Date().toISOString().split('T')[0];
                        funcion.registrosPorDia.push({ fecha: hoy, registrados: cantidad });

                        appState.historial.push({
                            id: Date.now().toString() + Math.random().toString(36).slice(2),
                            timestamp: new Date().toISOString(),
                            usuario: appState.user.email,
                            funcionId: funcionId,
                            accion: 'Registro de inscritos',
                            detalles: 'Inscritos: +' + cantidad,
                            _pendingInsert: true
                        });

                        guardados++;
                        input.value = '0';
                    }
                }
            });

            if (guardados > 0) {
                await saveData();
                alert('✅ ' + guardados + ' actividad(es) actualizada(s)');
                render();
            } else {
                alert('⚠️ No hay registros para guardar');
            }
        }

            const nuevo = { id: Date.now().toString(), nombre };

            }

        async function eliminarAgrupador(id, nombre) {
            const enUso = appState.obras.filter(o => o.agrupadorId === id).length;
            if (enUso > 0 && !confirm('⚠️ "' + nombre + '" tiene ' + enUso + ' obra(s) asignada(s). Al eliminarlo, esas obras quedarán sin agrupador. ¿Continuar?')) {
                return;
            }
            if (enUso === 0 && !confirm('¿Eliminar "' + nombre + '"?')) return;
            appState.agrupadores = appState.agrupadores.filter(a => a.id !== id);
            appState.obras.forEach(o => { if (o.agrupadorId === id) o.agrupadorId = null; });
            await db.from('boleteria_agrupadores').delete().eq('id', id);
            render();
        }

        function colorTextoContraste(hex) {
            if (!hex) return '#111827';
            const c = hex.replace('#', '');
            const r = parseInt(c.substr(0, 2), 16);
            const g = parseInt(c.substr(2, 2), 16);
            const b = parseInt(c.substr(4, 2), 16);
            const luminancia = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminancia > 0.6 ? '#111827' : '#ffffff';
        }

        function cambiarPeriodoCalendario(delta) {
            const hoyReal = new Date();
            if (appState.calMes === null || appState.calMes === undefined) appState.calMes = hoyReal.getMonth();
            if (appState.calAnio === null || appState.calAnio === undefined) appState.calAnio = hoyReal.getFullYear();
            if (appState.calDia === null || appState.calDia === undefined) appState.calDia = hoyReal.getDate();

            if (appState.calVista === 'dia') {
                const d = new Date(appState.calAnio, appState.calMes, appState.calDia);
                d.setDate(d.getDate() + delta);
                appState.calAnio = d.getFullYear(); appState.calMes = d.getMonth(); appState.calDia = d.getDate();
            } else if (appState.calVista === 'semana') {
                const d = new Date(appState.calAnio, appState.calMes, appState.calDia);
                d.setDate(d.getDate() + delta * 7);
                appState.calAnio = d.getFullYear(); appState.calMes = d.getMonth(); appState.calDia = d.getDate();
            } else if (appState.calVista === 'anio') {
                appState.calAnio += delta;
            } else {
                let nuevoMes = appState.calMes + delta;
                let nuevoAnio = appState.calAnio;
                if (nuevoMes < 0) { nuevoMes = 11; nuevoAnio--; }
                if (nuevoMes > 11) { nuevoMes = 0; nuevoAnio++; }
                appState.calMes = nuevoMes;
                appState.calAnio = nuevoAnio;
            }
            render();
        }

                if (f.fecha !== fecha) return false;
                const obra = appState.obras.find(o => o.id === f.obraId);
                if (!obra) return false;
                if (appState.calFiltroTipo !== 'todas' && obra.tipo !== appState.calFiltroTipo) return false;
                if (appState.calFiltroSala !== 'todas' && obra.salaId !== appState.calFiltroSala) return false;
                return true;
            });
        }

        function renderEventoCalendario(f, compacto) {
            const obra = appState.obras.find(o => o.id === f.obraId);
            const sala = getSala(obra.salaId);
            const colorFondo = getColorSala(obra.salaId);
            const colorTexto = colorTextoContraste(colorFondo);
            const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
            const limite = compacto ? 20 : 60;
            const nombreCorto = obra.nombre.length > limite ? obra.nombre.substring(0, limite) + '…' : obra.nombre;
            const fontSize = compacto ? '10px' : '12px';
            let html = '<div style="background:' + colorFondo + '; color:' + colorTexto + '; font-size:' + fontSize + '; line-height:1.3;" class="px-1.5 py-1 rounded-sm cursor-pointer hover:opacity-90 truncate mb-0.5" onclick="viewObra(\'' + obra.id + '\')" title="' + icono + ' ' + obra.nombre + ' — ' + (sala?.nombre || '') + ' — ' + f.hora + '">';
            html += icono + ' ' + nombreCorto + ' · ' + f.hora;
            html += '</div>';
            return html;
        }

            html += '<button onclick="cambiarPeriodoCalendario(1)" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded border">Siguiente →</button>';

            [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes'], ['anio', 'Año']].forEach(([id, label]) => {

            // Filtros (aplican a todas las vistas)

            html += '<option value="todas"' + (appState.calFiltroSala === 'todas' ? ' selected' : '') + '>Todas las salas</option>';

        function renderVistaMesCalendario(meses, diasSemanaCortos) {
            const hoyReal = new Date();
            const mes = appState.calMes;
            const anio = appState.calAnio;
            const primerDia = new Date(anio, mes, 1).getDay();
            const diasMes = new Date(anio, mes + 1, 0).getDate();

            let html = '<div class="grid grid-cols-7 gap-px bg-gray-100 border-b border-gray-300 mb-px">';
            diasSemanaCortos.forEach(d => {

            });
            html += '</div>';

            for (let i = 0; i < primerDia; i++) {
                html += '<div class="bg-gray-50 min-h-32 p-2"></div>';
            }
            for (let dia = 1; dia <= diasMes; dia++) {
                const fecha = String(anio) + '-' + String(mes + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
                const funcionesDia = getFuncionesFiltradasFecha(fecha);
                const esHoy = fecha === hoyReal.toISOString().split('T')[0];

                html += '<div class="bg-white min-h-32 p-2 hover:bg-gray-50 cursor-pointer" onclick="irADiaCalendario(' + anio + ',' + mes + ',' + dia + ')">';

                    : '<div class="text-xl font-light text-gray-900 mb-1">' + dia + '</div>';

        function renderVistaAnioCalendario(meses) {

            for (let m = 0; m < 12; m++) {
