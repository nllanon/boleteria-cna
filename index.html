        // Es una sync completa en cada llamada — adecuado para el volumen
        // de datos de este sistema (decenas de obras/funciones, no miles).
        async function saveData() {
            try {
                if (appState.salas.length) await db.from('boleteria_salas').upsert(appState.salas);
                if (appState.obras.length) await db.from('boleteria_obras').upsert(appState.obras.map(obraToDb));

                if (appState.acciones.length) await db.from('boleteria_acciones').upsert(appState.acciones.map(accionToDb));
                if (appState.historial.length) {
                    const nuevos = appState.historial.filter(h => h._pendingInsert);
                    if (nuevos.length) {
                        await db.from('boleteria_historial').insert(nuevos.map(historialToDb));
                        nuevos.forEach(h => delete h._pendingInsert);
                    }
                }
            } catch (err) {
                console.error('Error guardando en Supabase:', err);
                alert('⚠️ Error al guardar en la base de datos. Revisa tu conexión e intenta de nuevo.');
            }
        }

            return String(valor);

        function diferenciasObra(anterior, nuevo) {

                const ahora = nuevo[campo] === undefined ? null : nuevo[campo];
                const normaliza = (v) => (v === null || v === undefined || v === '') ? '' : String(v);
                if (normaliza(antes) === normaliza(ahora)) return;
                cambios.push(etiqueta + ': ' + valorAuditable(antes, tipo) + ' → ' + valorAuditable(ahora, tipo));
            });
            return cambios;

        function calcularDiasTotalesParaVender(fechaTiquetera, obraId) {
            if (!fechaTiquetera) return 'N/A';
            const ultimaFuncion = getUltimaFuncion(obraId);
            if (!ultimaFuncion) return 'N/A';
            const inicio = new Date(fechaTiquetera);
            const fin = new Date(ultimaFuncion.fecha);
            const dias = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
            return Math.max(0, dias);
        }

        function calcularDiasPorVender(fecha) {
            if (!fecha || fecha === '' || fecha === null || fecha === undefined) return 'N/A';
            
            try {
                // Validar formato YYYY-MM-DD
                if (typeof fecha !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) {
                    return 'N/A';
                }
                
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);
                
                const partes = fecha.split('-');
                const fin = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
                
                if (isNaN(fin.getTime())) return 'N/A';
                
                const dias = Math.floor((fin - hoy) / (1000 * 60 * 60 * 24));
                return Math.max(0, dias);
            } catch (e) {
                console.error('Error calcularDiasPorVender:', fecha, e);
                return 'N/A';
            }
        }

        function parsearFechaLocal(fechaStr) {
            if (!fechaStr) return null;
            return new Date(fechaStr + 'T00:00:00');
        }

        // Fecha en formato AAAA-MM-DD para los nombres de archivo descargables.
        // Se usa la fecha local, no la UTC, para que un archivo generado de noche
        // en Colombia no quede fechado al día siguiente.
        function fechaParaArchivo() {
            const d = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function formatearFecha(fecha) {
            if (!fecha) return '-';
            const d = new Date(fecha + 'T00:00:00');
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const anio = d.getFullYear();
            return dia + '/' + mes + '/' + anio;
        }

        function formatearHora(hora) {
            if (!hora) return '-';
            return hora;  // Ya viene en formato 24h (HH:MM)
        }

        // Devuelve un arreglo continuo de fechas 'YYYY-MM-DD' entre inicio y fin (inclusive)
        function rangoDiasISO(inicioStr, finStr) {
            const out = [];
            const d = parsearFechaLocal(inicioStr);
            const fin = parsearFechaLocal(finStr);
            if (!d || !fin || d > fin) return out;
            const pad = (n) => String(n).padStart(2, '0');
            let guardia = 0;
            while (d <= fin && guardia < 800) {
                out.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()));
                d.setDate(d.getDate() + 1);
                guardia++;
            }
            return out;
        }

        function getVentasAcumuladasPorDiaObra(obraId, campoArray, campoValor) {
            const funciones = getFuncionesObra(obraId);
            const porDia = {};

            funciones.forEach(f => {
                if (f[campoArray] && Array.isArray(f[campoArray])) {
                    f[campoArray].forEach(vd => {
                        if (!porDia[vd.fecha]) porDia[vd.fecha] = 0;
                        porDia[vd.fecha] += vd[campoValor];
                    });
                }
            });

            const fechas = Object.keys(porDia).sort();
            let acumulado = 0;
            const acumuladas = fechas.map(f => {
                acumulado += porDia[f];
                return acumulado;
            });

            return { fechas, boletasAcumuladas: acumuladas };
        }

                    }

                    // Si no hay datos, mostrar mensaje
                    if (datos.fechas.length === 0) {
                        const ctx = canvas.getContext('2d');
                        ctx.font = '16px Arial';
                        ctx.fillStyle = '#999';
                        ctx.textAlign = 'center';
                        ctx.fillText(esEntradaLibre ? 'Sin datos de registros' : 'Sin datos de ventas registradas', canvas.width / 2, canvas.height / 2);
                        return;
                    }

                    const fechaPrimeraFuncion = funciones.length > 0 ? funciones[0].fecha : null;

                    // Hitos de la obra — el eje X debe cubrirlos todos para que cada línea
                    // caiga en su fecha real y no se amontonen en los bordes del gráfico
                    const fechasHito = [
                        obra.fechaPiezasDesarrolladas,
                        obra.fechaTiquetera,
                        obra.fechaRedes,
                        obra.fechaVideoPatua,
                        obra.fechaPauta,
                        fechaPrimeraFuncion
                    ].filter(Boolean);

                    const primeraVenta = datos.fechas[0];
                    const ultimaVenta = datos.fechas[datos.fechas.length - 1];
                    const todas = fechasHito.concat([primeraVenta, ultimaVenta]).sort();
                    const ejeInicio = todas[0];
                    const ejeFin = todas[todas.length - 1];

                    const dias = rangoDiasISO(ejeInicio, ejeFin);
                    const labelsEje = dias.length > 0 ? dias : datos.fechas;

                    // Serie acumulada extendida: 0 antes de la primera venta, arrastre entre
                    // días sin movimiento, null después del último día registrado
                    const mapaAcum = {};
                    datos.fechas.forEach((f, i) => { mapaAcum[f] = datos.boletasAcumuladas[i]; });
                    let ultimoValor = 0;
                    const serieExtendida = labelsEje.map(f => {
                        if (f > ultimaVenta) return null;
                        if (mapaAcum[f] !== undefined) ultimoValor = mapaAcum[f];
                        return ultimoValor;
                    });

                    const etiquetaCorta = (f) => {
                        const partes = f.split('-');
                        return partes[2] + '/' + partes[1];
                    };

                    window.chartInstanceVentas = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: labelsEje,
                            datasets: [{
                                label: esEntradaLibre ? 'Registrados (acumulado)' : 'Boletas vendidas (acumulado)',
                                data: serieExtendida,
                                spanGaps: false,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointRadius: (ctx) => (labelsEje.length > 20 ? 3 : 6),
                                pointBackgroundColor: '#3b82f6',
                                pointBorderColor: '#1e40af',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: (esEntradaLibre ? 'Registros diarios: ' : 'Ventas diarias: ') + obra.nombre,
                                    font: { size: 16, weight: 'bold' }
                                },
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        autoSkip: true,
                                        maxTicksLimit: 8,
                                        maxRotation: 45,
                                        minRotation: 45,
                                        callback: function(val, i) {
                                            const f = labelsEje[i];
                                            return f ? etiquetaCorta(f) : '';
                                        }
                                    },
                                    grid: { display: false }
                                },
                                y: {
                                    beginAtZero: true,
                                    ticks: { precision: 0 }
                                }
                            }
                        }
                    });
                    
                    // Dibujar líneas timeline después de renderizar
                    setTimeout(() => {
                        const ctx = canvas.getContext('2d');
                        const xScale = window.chartInstanceVentas.scales.x;
                        const chartArea = window.chartInstanceVentas.chartArea;
                        const labels = window.chartInstanceVentas.data.labels;
                        
                        const lineas = [
                            { fecha: obra.fechaPiezasDesarrolladas, color: '#0ea5e9', label: ICONOS.piezas + ' Piezas' },
                            { fecha: obra.fechaTiquetera, color: '#10b981', label: ICONOS.tiquetera + ' Tiquetera' },
                            { fecha: obra.fechaRedes, color: '#3b82f6', label: '💬 Redes' },
                            { fecha: obra.fechaVideoPatua, color: '#ec4899', label: ICONOS.video + ' Video' },
                            { fecha: obra.fechaPauta, color: '#8b5cf6', label: ICONOS.pauta + ' Pauta' },
                            { fecha: fechaPrimeraFuncion, color: '#ef4444', label: ICONOS.estreno + ' Estreno' }
                        ];
                        
                        // Calcular la posición de cada hito sobre el eje continuo de días
                        const posiciones = [];
                        lineas.forEach(linea => {
                            if (!linea.fecha || labels.length === 0) return;
                            let x = null;
                            const idx = labels.indexOf(linea.fecha);
                            if (idx !== -1) {
                                x = xScale.getPixelForValue(idx);
                            } else {
                                // Fuera del rango del eje: se ancla al borde más cercano
                                const fechaNum = new Date(linea.fecha).getTime();
                                const primero = new Date(labels[0]).getTime();
                                const ultimo = new Date(labels[labels.length - 1]).getTime();
                                x = fechaNum <= primero ? chartArea.left : (fechaNum >= ultimo ? chartArea.right : null);
                            }
                            if (x === null || isNaN(x)) return;
                            posiciones.push({ x, color: linea.color, label: linea.label, fecha: linea.fecha });
                        });

                        posiciones.sort((a, b) => a.x - b.x);

                        posiciones.forEach((pos, i) => {
                            ctx.strokeStyle = pos.color;
                            ctx.lineWidth = 2;
                            ctx.setLineDash([5, 5]);
                            ctx.beginPath();
                            ctx.moveTo(pos.x, chartArea.top);
                            ctx.lineTo(pos.x, chartArea.bottom);
                            ctx.stroke();
                            ctx.setLineDash([]);

                            // Separar etiquetas de hitos que caen en la misma fecha o muy cerca,
                            // para que no queden una encima de otra
                            let desplazamiento = 0;
                            for (let j = 0; j < i; j++) {
                                if (Math.abs(posiciones[j].x - pos.x) < 16) desplazamiento += 13;
                            }

                            ctx.font = 'bold 11px Arial';
                            ctx.fillStyle = pos.color;
                            ctx.save();
                            ctx.translate(pos.x + 4 + desplazamiento, chartArea.top + 15);
                            ctx.rotate(-Math.PI / 2);
                            ctx.textAlign = 'right';
                            ctx.fillText(pos.label, 0, 0);
                            ctx.restore();
                        });
                    }, 50);
                }
            }, 100);
        }

                html += '<div class="px-4 pb-4"><div class="grid grid-cols-2 lg:grid-cols-3 gap-3 items-start">';
                const obrasOrdenadas = grupo.obras.slice().sort((a, b) => {
                    const ea = getFuncionesObra(a.id).map(f => f.fecha).sort()[0] || '9999-12-31';
                    const eb = getFuncionesObra(b.id).map(f => f.fecha).sort()[0] || '9999-12-31';
                    return ea.localeCompare(eb);
                });
                obrasOrdenadas.forEach(obra => { html += renderTarjetaDashboard(obra); });
                html += '</div></div>';
                html += '</details>';
            });

            if (obrasFinalizadasDash.length > 0) {
                html += '<details class="mb-6 bg-white rounded shadow" style="overflow:hidden;">';
                html += '<summary style="cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;" class="p-4">';
                html += '<span class="triangulo-cascada" style="display:inline-block; transition:transform 0.15s;">▶</span>';
                html += '<span style="font-weight:bold; font-size:1.125rem; color:#6b7280;">Finalizadas</span>';
                html += '<span style="font-size:0.75rem; color:#9ca3af;">(' + obrasFinalizadasDash.length + ')</span>';
                html += '</summary>';
                html += '<div class="px-4 pb-4"><div class="grid grid-cols-2 lg:grid-cols-3 gap-3 items-start">';
                obrasFinalizadasDash.forEach(obra => { html += renderTarjetaDashboard(obra); });
                html += '</div></div>';
                html += '</details>';
            }

            html += '<style>details[open] > summary .triangulo-cascada { transform: rotate(90deg); } summary::-webkit-details-marker { display:none; } summary { list-style:none; }</style>';

            html += '</main></div>';

            setTimeout(() => renderDonasResumenDashboard(totalVentas, porVenderBoleteria, totalRegistrados, porOcuparEntrada), 50);

            return html;
        }

        function renderDonasResumenDashboard(vendidas, porVender, registradas, porOcupar) {
            if (!window.Chart) return;

            const hacerDona = (canvasId, instanciaKey, valores, colores) => {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                if (window[instanciaKey]) window[instanciaKey].destroy();
                const sinDatos = valores.every(v => v === 0);
                window[instanciaKey] = new Chart(canvas, {
                    type: 'doughnut',
                    data: { datasets: [{ data: sinDatos ? [1] : valores, backgroundColor: sinDatos ? ['#e5e7eb'] : colores, borderWidth: 0 }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        animation: false,
                        plugins: { legend: { display: false }, tooltip: { enabled: false } }
                    }
                });
            };

            hacerDona('donaBoleteria', 'donaBoleteriaInstance', [vendidas, porVender], ['#16A34A', '#e5e7eb']);
            hacerDona('donaEntrada', 'donaEntradaInstance', [registradas, porOcupar], ['#7c3aed', '#e5e7eb']);
        }

        function renderBadgePctChico(pct, texto) {
            const bg = colorPctHex(pct);
            return '<span style="background:' + bg + '; color:#ffffff; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; white-space:nowrap; display:inline-block; flex-shrink:0;">' + texto + '</span>';
        }

        function renderTarjetaDashboard(obra) {
            const sala = getSala(obra.salaId);
            const funciones = getFuncionesObra(obra.id);
            const esBoleteria = obra.tipo === 'boleteria';

            let totalNum = 0, totalDen = 0;

            let filasFunciones = '';
            funciones.forEach(f => {
                let numerador, denominador, etiquetaIzq, etiquetaDer;
                if (esBoleteria) {
                    numerador = f.ventasAcumuladas || 0;
                    denominador = Math.max(1, getAforo(obra) - (f.cortesias || 0));
                    etiquetaIzq = numerador + ' vendidas';
                    etiquetaDer = Math.max(0, denominador - numerador) + ' por vender';
                } else {
                    numerador = f.registrados || 0;
                    denominador = getAforo(obra);
                    etiquetaIzq = numerador + ' registrados';
                    etiquetaDer = Math.max(0, denominador - numerador) + ' cupos libres';
                }
                totalNum += numerador;
                totalDen += denominador;
                const pct = denominador > 0 ? Math.round((numerador / denominador) * 100) : 0;

                filasFunciones += '<div style="padding:6px 0; border-bottom:1px solid #f3f4f6;">';
                filasFunciones += '<div class="flex justify-between items-center gap-2">';
                filasFunciones += '<div class="text-xs text-gray-700" style="min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + formatearFecha(f.fecha) + ' <span class="text-gray-400">' + formatearHora(f.hora) + '</span></div>';
                filasFunciones += renderBadgePctChico(pct, pct + '%');
                filasFunciones += '</div>';
                filasFunciones += '<div class="text-xs text-gray-500 mt-0.5" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + etiquetaIzq + ' · ' + etiquetaDer + '</div>';
                filasFunciones += '</div>';
            });

            const pctTotal = totalDen > 0 ? Math.round((totalNum / totalDen) * 100) : 0;

            // Indicador general: nombre, sala y % — lo único visible de entrada,
            // pensado para ver de un vistazo si vamos bien o no. El detalle por
            // función queda un clic más adentro (desplegable), sin salir del Dashboard.
            let html = '<details class="bg-white rounded shadow" style="overflow:hidden;">';
            html += '<summary style="cursor:pointer; list-style:none;" class="p-3">';
            html += '<div class="flex justify-between items-center gap-2">';
            html += '<div style="min-width:0; flex:1;">';
            html += '<div class="font-bold text-sm text-gray-800" style="overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">' + (esBoleteria ? '💵' : '🎟️') + ' ' + obra.nombre + '</div>';
            const estreno = funciones.length > 0 ? funciones.map(f => f.fecha).sort()[0] : null;
            html += '<div class="text-xs text-gray-500" style="overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">' + (sala?.nombre || '') + (estreno ? ' · Estreno ' + formatearFecha(estreno) : '') + '</div>';
            html += '</div>';
            html += renderBadgePctChico(pctTotal, pctTotal + '%');
            html += '</div>';
            html += '</summary>';

            html += '<div class="px-3 pb-3" style="border-top:1px solid #f3f4f6;">';
            html += '<div style="max-height:220px; overflow-y:auto; margin-top:8px;">';
            html += filasFunciones || '<p class="text-xs text-gray-400">Sin funciones</p>';
            html += '</div>';
            html += '<div style="padding-top:8px; margin-top:4px; border-top:1px solid #e5e7eb;">' + renderIconosEstado(obra) + '</div>';
            html += '<div class="flex gap-3 mt-3">';
            html += '<button onclick="viewObra(\'' + obra.id + '\')" class="text-xs text-blue-600 hover:text-blue-800 font-medium">👁️ Ver detalle completo</button>';
            html += '<button onclick="abrirGraficoVentas(\'' + obra.id + '\')" class="text-xs text-blue-600 hover:text-blue-800 font-medium">📊 Ver gráfico</button>';
            html += '</div>';
            html += '</div>';
            html += '</details>';

            return html;
        }

        function obraEstaFinalizada(obra) {
            if (obra.tipo === 'entrada_libre') {
                return obra.estadoEnlace === 'Finalizado';
            }
            const ultimaFunc = getUltimaFuncion(obra.id);
            if (!ultimaFunc) return false;
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            return parsearFechaLocal(ultimaFunc.fecha) < hoy;
        }

        function renderObras() {
            let html = '<div class="min-h-screen bg-gray-50 md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 py-6">';

            if (tienePermiso('crear_obra')) {
                html += '<button onclick="openCrearObra()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 mb-4">+ Nueva Obra</button>';
            }

            let obrasFiltradas = appState.obras.filter(o => puedeVerObra(o));

            // Orden pedido: boletería activa, entrada libre activa, boletería finalizada, entrada libre finalizada
            const orden = (o) => {
                const finalizada = obraEstaFinalizada(o);
                if (o.tipo === 'boleteria' && !finalizada) return 0;
                if (o.tipo === 'entrada_libre' && !finalizada) return 1;
                if (o.tipo === 'boleteria' && finalizada) return 2;
                return 3;
            };
            obrasFiltradas = obrasFiltradas.slice().sort((a, b) => {
                const diff = orden(a) - orden(b);
                if (diff !== 0) return diff;
                const fA = getUltimaFuncion(a.id)?.fecha || '9999-99-99';
                const fB = getUltimaFuncion(b.id)?.fecha || '9999-99-99';
                return fA.localeCompare(fB);
            });

            // Filtro por mes, solo aplica a las obras finalizadas
            const MESES_NOMBRE = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const mesesDisponibles = new Set();
            obrasFiltradas.forEach(o => {
                if (!obraEstaFinalizada(o)) return;
                const f = getUltimaFuncion(o.id)?.fecha;
                if (!f) return;
                mesesDisponibles.add(f.slice(0, 7)); // 'YYYY-MM'
            });
            const listaMeses = [...mesesDisponibles].sort();

            if (listaMeses.length > 0) {
                html += '<div class="mb-3"><label class="text-xs text-gray-600 mr-2">Finalizadas del mes:</label>';
                html += '<select onchange="appState.obrasFiltroMesFinalizadas=this.value; render();" class="border rounded px-2 py-1 text-sm">';
                html += '<option value="todos"' + (appState.obrasFiltroMesFinalizadas === 'todos' ? ' selected' : '') + '>Todos los meses</option>';
                listaMeses.forEach(m => {
                    const [anio, mesNum] = m.split('-');
                    const label = MESES_NOMBRE[parseInt(mesNum) - 1] + ' ' + anio;
                    html += '<option value="' + m + '"' + (appState.obrasFiltroMesFinalizadas === m ? ' selected' : '') + '>' + label + '</option>';
                });
                html += '</select></div>';
            }

            if (appState.obrasFiltroMesFinalizadas !== 'todos') {
                obrasFiltradas = obrasFiltradas.filter(o => {
                    if (!obraEstaFinalizada(o)) return true; // las activas nunca se filtran por mes
                    const f = getUltimaFuncion(o.id)?.fecha;
                    return f && f.slice(0, 7) === appState.obrasFiltroMesFinalizadas;
                });
            }

            html += '<div class="bg-white rounded shadow overflow-hidden"><table class="w-full text-sm">';
            html += '<thead class="bg-gray-100"><tr><th class="px-4 py-2 text-left">Obra</th><th class="px-4 py-2 text-left">Tipo</th><th class="px-4 py-2 text-left">Sala</th><th class="px-4 py-2 text-left">Tiquetera</th><th class="px-4 py-2 text-left">Última Fun.</th><th class="px-4 py-2 text-left">Días</th><th class="px-4 py-2">Acciones</th></tr></thead><tbody>';

            let seccionActual = null;
            obrasFiltradas.forEach(obra => {
                const finalizada = obraEstaFinalizada(obra);
                const seccionLabel = obra.tipo === 'boleteria'
                    ? (finalizada ? 'Boletería — Finalizadas' : 'Boletería — Activas')
                    : (finalizada ? 'Entrada Libre — Finalizadas' : 'Entrada Libre — Activas');
                if (seccionLabel !== seccionActual) {
                    seccionActual = seccionLabel;
                    html += '<tr class="bg-gray-200"><td colspan="7" class="px-4 py-1 text-xs font-bold text-gray-700">' + seccionLabel + '</td></tr>';
                }

                const sala = getSala(obra.salaId);
                const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
                const accionesCount = getAccionesObra(obra.id).length;
                const diasTotales = calcularDiasTotalesParaVender(obra.fechaTiquetera, obra.id);
                const ultimaFunc = getUltimaFuncion(obra.id);
                html += '<tr class="border-b hover:bg-gray-50' + (finalizada ? ' opacity-60' : '') + '"><td class="px-4 py-2 font-medium cursor-pointer text-blue-600" onclick="viewObra(\'' + obra.id + '\')">' + obra.nombre + '</td>';
                html += '<td class="px-4 py-2">' + icono + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + sala?.nombre + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + (obra.fechaTiquetera ? formatearFecha(obra.fechaTiquetera) : 'N/A') + '</td>';
                html += '<td class="px-4 py-2 text-xs">' + (ultimaFunc ? formatearFecha(ultimaFunc.fecha) : '-') + '</td>';
                html += '<td class="px-4 py-2 text-xs font-bold">' + diasTotales + 'd</td>';
                html += '<td class="px-4 py-2 text-xs"><button onclick="viewObra(\'' + obra.id + '\')" class="text-blue-600 font-medium">Ver (' + accionesCount + ')</button>';
                if (tienePermiso('editar_obra') && puedeEditarObra(obra)) html += ' <button onclick="openEditarObra(\'' + obra.id + '\')" class="text-green-600">Editar</button>';
                if (tienePermiso('eliminar_obra') && puedeEditarObra(obra)) html += ' <button onclick="deleteObra(\'' + obra.id + '\')" class="text-red-600">Eliminar</button>';
                html += '</td></tr>';
            });

            html += '</tbody></table></div></main></div>';
            return html;
        }

        async function deleteObra(obraId) {
            const obraAEliminar = appState.obras.find(o => o.id === obraId);
            if (!tienePermiso('eliminar_obra') || !puedeEditarObra(obraAEliminar)) {
                alert('⚠️ Tu usuario no puede eliminar esta obra.');
                return;
            }
            if (confirm('¿Eliminar esta obra? Se borrarán todas sus funciones y acciones.')) {
                const obraBorrada = appState.obras.find(o => o.id === obraId);
                registrarHistorial({
                    accion: 'Eliminación de obra',
                    detalles: (obraBorrada ? obraBorrada.nombre : obraId) + ' — se borraron sus funciones y acciones'
                });
                await saveData();
                appState.obras = appState.obras.filter(o => o.id !== obraId);
                appState.acciones = appState.acciones.filter(a => a.obraId !== obraId);
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);
                await db.from('boleteria_obras').delete().eq('id', obraId); // cascada borra funciones/acciones en la BD
                alert('✅ Obra eliminada');
                render();
            }
        }

        function viewObra(obraId) {
            appState.viewingObraId = obraId;
            appState.currentPage = 'ver-obra';
            render();
        }

        function renderVerObra() {
            const obra = appState.obras.find(o => o.id === appState.viewingObraId);
            if (!obra) return renderObras();
            
            const sala = getSala(obra.salaId);
            const acciones = getAccionesObra(obra.id);
            const funciones = getFuncionesObra(obra.id);
            const primeraFuncion = getPrimeraFuncion(obra.id);
            const ultimaFuncion = getUltimaFuncion(obra.id);
            const diasTotalesParaVender = calcularDiasTotalesParaVender(obra.fechaTiquetera, obra.id);
            const diasPorVender = ultimaFuncion ? calcularDiasPorVender(ultimaFuncion.fecha) : 'N/A';
            const canEdit = tienePermiso('editar_obra') && puedeEditarObra(obra);

            let html = '<div class="min-h-screen bg-gray-50 md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-4xl mx-auto px-4 py-6">';
            html += '<button onclick="changePage(\'obras\')" class="text-blue-600 text-sm mb-4">← Volver</button>';
            html += '<div class="bg-white p-6 rounded shadow mb-6">';
            html += '<div class="flex justify-between items-start mb-4">';
            html += '<div><h2 class="text-2xl font-bold text-gray-800">' + obra.nombre + '</h2>';
            html += '<p class="text-gray-600">' + obra.artista + ' | ' + sala?.nombre + ' (Aforo: ' + getAforo(obra) + ')</p>';
            html += '<p class="text-sm text-gray-500 mt-2"><strong>Categoría:</strong> ' + (obra.categoria || 'Sin categoría') + '</p></div>';
            html += '<div class="text-right"><span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">' + (obra.tipo === 'boleteria' ? '💵 Boletería' : '🎟️ Entrada Libre') + '</span></div>';
            html += '</div>';
            
            html += '<div class="grid grid-cols-2 gap-4 mb-4">';
            if (primeraFuncion) html += '<div><strong>Primera Función:</strong> ' + formatearFecha(primeraFuncion.fecha) + ' ' + formatearHora(primeraFuncion.hora) + '</div>';
            if (ultimaFuncion) html += '<div><strong>Última Función:</strong> ' + formatearFecha(ultimaFuncion.fecha) + ' ' + formatearHora(ultimaFuncion.hora) + '</div>';
            html += '<div><strong>Días totales para vender:</strong> <span class="font-bold text-blue-600">' + diasTotalesParaVender + ' días</span></div>';
            html += '<div><strong>Días por vender:</strong> <span class="font-bold text-orange-600">' + diasPorVender + ' días</span></div>';
            html += '</div>';

            // ALERTAS DE ESTADO CON FECHAS
            html += '<div class="grid grid-cols-1 gap-2 mb-4">';
            const alertas = [
                { label: 'Piezas Desarrolladas', ok: obra.piezasDesarrolladas, fecha: obra.fechaPiezasDesarrolladas },
                { label: 'Video Disponible', ok: obra.videoDisponible, fecha: obra.fechaVideoPatua },
                { label: 'Salida en Tiquetera', ok: !!obra.fechaTiquetera, fecha: obra.fechaTiquetera },
                { label: 'Salida en Redes', ok: !!obra.fechaRedes, fecha: obra.fechaRedes },
                { label: 'Salida en Pauta', ok: !!obra.fechaPauta, fecha: obra.fechaPauta }
            ];
            alertas.forEach(a => {
                const color = a.ok ? 'bg-green-50 border-green-300 text-green-800' : 'bg-red-50 border-red-300 text-red-800';
                const icon = a.ok ? '✅' : '⚠️';
                const fechaText = a.fecha ? ' (' + formatearFecha(a.fecha) + ')' : '';
                html += '<div class="p-3 rounded border-2 ' + color + ' text-sm font-medium">' + icon + ' ' + a.label + fechaText + '</div>';
            });
            html += '</div>';

            if (canEdit) {
                html += '<button onclick="openEditarObra(\'' + obra.id + '\')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">✏️ Editar Obra</button>';
            }
            html += '</div>';

            // ========== SECCIÓN DE FUNCIONES ==========
            html += '<div class="bg-green-50 border-2 border-green-300 p-6 rounded shadow mb-6">';
            html += '<h3 class="text-lg font-bold mb-4 text-green-900">🎬 CREAR NUEVA FUNCIÓN</h3>';
            html += '<form onsubmit="handleAgregarFuncion(event, \'' + obra.id + '\')" class="space-y-3">';
            html += '<div class="grid grid-cols-2 gap-3">';
            html += '<div><label class="block text-sm font-medium mb-1 text-gray-700">📅 Fecha</label><input type="date" id="funcionFecha" required class="w-full px-3 py-2 border-2 border-gray-300 rounded text-sm font-medium" /></div>';
            html += '<div><label class="block text-sm font-medium mb-1 text-gray-700">⏰ Hora</label><input type="time" id="funcionHora" required class="w-full px-3 py-2 border-2 border-gray-300 rounded text-sm font-medium" /></div>';
            html += '</div>';
            html += '<button type="submit" class="w-full bg-green-600 text-white px-4 py-3 rounded text-base font-bold hover:bg-green-700">✅ AGREGAR FUNCIÓN</button>';
            html += '</form>';
            html += '</div>';

            // Lista de funciones
            html += '<div class="bg-white p-6 rounded shadow mb-6">';
            html += '<h3 class="text-lg font-bold mb-4">📋 Funciones Registradas (' + funciones.length + ')</h3>';
            if (funciones.length === 0) {
                html += '<p class="text-gray-500">Sin funciones registradas</p>';
            } else {
                html += '<div class="space-y-2">';
                funciones.forEach(f => {
                    const editando = appState.editingFuncionFechaId === f.id;
                    html += '<div class="p-3 bg-gray-50 rounded border-l-4 border-orange-500">';
                    if (editando) {
                        html += '<form onsubmit="guardarEdicionFechaFuncion(event, \'' + f.id + '\')" class="flex flex-wrap gap-2 items-end">';
                        html += '<div><label class="block text-xs font-medium mb-1">Fecha</label><input type="date" id="editFuncionFecha" value="' + f.fecha + '" required class="px-2 py-1 border rounded text-sm" /></div>';
                        html += '<div><label class="block text-xs font-medium mb-1">Hora</label><input type="time" id="editFuncionHora" value="' + f.hora + '" required class="px-2 py-1 border rounded text-sm" /></div>';
                        html += '<button type="submit" class="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-medium hover:bg-green-700">Guardar</button>';
                        html += '<button type="button" onclick="cancelarEdicionFechaFuncion()" class="bg-gray-300 px-3 py-1.5 rounded text-xs">Cancelar</button>';
                        html += '</form>';
                    } else {
                        html += '<div class="flex justify-between items-center">';
                        html += '<div>';

                            html += '<div class="text-xs text-gray-600 mt-0.5">💵 Vendidas: <strong>' + ventasFunc + ' / ' + disponibleFunc + '</strong> ' + renderBadgePct(pctFunc, pctFunc + '%') + '</div>';
                        } else {
                            const registradosFunc = f.registrados || 0;
                            const aforoSala = getAforo(obra);
                            const pctRegistro = aforoSala > 0 ? Math.round((registradosFunc / aforoSala) * 100) : 0;
                            html += '<div class="text-xs text-gray-600 mt-0.5">🎟️ Registrados: <strong>' + registradosFunc + '</strong> ' + renderBadgePct(pctRegistro, pctRegistro + '%') + '</div>';
                        }
                        html += '</div>';
                        html += '<div class="flex gap-2">';
                        html += '<button onclick="verHistorialFuncion(\'' + f.id + '\')" class="text-gray-600 text-xs font-medium" title="Ver historial de cambios">🕐 Historial</button>';

                            html += '<button onclick="iniciarEdicionFechaFuncion(\'' + f.id + '\')" class="text-blue-600 text-xs font-medium">Editar</button>';
                            html += '<button onclick="deleteFuncion(\'' + f.id + '\')" class="text-red-600 text-xs font-medium">Eliminar</button>';
                        }
                        html += '</div></div>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div>';

        async function guardarEdicionFechaFuncion(event, funcionId) {
            event.preventDefault();
            const nuevaFecha = document.getElementById('editFuncionFecha').value;
            const nuevaHora = document.getElementById('editFuncionHora').value;
            const funcion = appState.funciones.find(f => f.id === funcionId);
            if (!funcion) return;

            const fechaAnterior = funcion.fecha;
            const horaAnterior = funcion.hora;

            if (fechaAnterior === nuevaFecha && horaAnterior === nuevaHora) {
                appState.editingFuncionFechaId = null;
                render();
                return;
            }

            funcion.fecha = nuevaFecha;
            funcion.hora = nuevaHora;

            registrarHistorial({
                obraId: funcion.obraId,
                funcionId: funcionId,
                accion: 'Cambio de fecha/hora de función',
                detalles: formatearFecha(fechaAnterior) + ' ' + formatearHora(horaAnterior) + ' → ' + formatearFecha(nuevaFecha) + ' ' + formatearHora(nuevaHora)
            });

            appState.editingFuncionFechaId = null;
            await saveData();
            alert('✅ Fecha/hora actualizada. Quedó registrado en el historial.');
            render();
        }

        function guardarBaselineVentas(event, obraId) {
            if (!tienePermiso('registrar_venta') && !tienePermiso('registrar_entrada')) {
                event.preventDefault();
                alert('⚠️ Tu usuario solo puede consultar la información.');
                return;
            }
            event.preventDefault();
            const funciones = getFuncionesObra(obraId);
            let actualizadas = 0;
            
            // Calcular fecha de ayer
            const hoy = new Date();
            const ayer = new Date(hoy);
            ayer.setDate(ayer.getDate() - 1);
            const fechaAyer = ayer.toISOString().split('T')[0];

            funciones.forEach(f => {
                const input = document.querySelector('input[data-baseline-' + f.id + ']');
                if (input) {
                    const boletas = parseInt(input.value) || 0;
                    f.ventasAcumuladas = boletas;
                    
                    // Registrar en ventasPorDia para que el gráfico lo muestre
                    if (!f.ventasPorDia) f.ventasPorDia = [];
                    f.ventasPorDia = [{ fecha: fechaAyer, boletas: boletas }];
                    
                    actualizadas++;
                }
            });

            if (actualizadas > 0) {
                saveData();
                alert('✅ Baseline de ' + actualizadas + ' función(es) guardado');
                render();
            }
        }

        function handleAgregarAccion(e, obraId) {
            e.preventDefault();
            if (!tienePermiso('registrar_accion_mercadeo')) {
                alert('⚠️ Tu usuario no puede registrar acciones de mercadeo.');
                return;
            }
            const obraDestino = appState.obras.find(o => o.id === obraId);
            if (!obraDestino || !puedeEditarObra(obraDestino)) {
                alert('⚠️ No puedes registrar acciones sobre esta obra.');
                return;
            }
            const desc = document.getElementById('accionDesc').value;
            const campoFecha = document.getElementById('accionFecha');
            const fecha = (campoFecha && campoFecha.value) ? campoFecha.value : new Date().toISOString().split('T')[0];
            appState.acciones.push({
                id: Date.now().toString(),
                obraId,
                descripcion: desc,
                fecha,
                usuario: appState.user.email,
                hecho: false
            });
            registrarHistorial({
                obraId: obraId,
                accion: 'Acción de mercadeo registrada',
                detalles: desc + ' — fecha de la acción: ' + formatearFecha(fecha)
            });
            saveData();
            document.getElementById('accionDesc').value = '';
            render();
        }

        function toggleAccionHecho(accionId) {
            if (!tienePermiso('registrar_accion_mercadeo')) return;
            const accion = appState.acciones.find(a => a.id === accionId);
            if (accion) {
                accion.hecho = !accion.hecho;
                registrarHistorial({
                    obraId: accion.obraId,
                    accion: 'Acción de mercadeo actualizada',
                    detalles: accion.descripcion + ' → ' + (accion.hecho ? 'hecha' : 'pendiente')
                });
                saveData();
                render();
            }
        }

        function handleGuardarObra(e) {
            e.preventDefault();
            if (!tienePermiso(appState.editingObra ? 'editar_obra' : 'crear_obra')) {
                alert('⚠️ Tu usuario solo puede consultar la información.');
                return;
            }
            if (appState.editingObra && !puedeEditarObra(appState.editingObra)) {
                alert('⚠️ No puedes editar obras de este tipo.');
                return;
            }
            
            let functionesAGuardar = [];

            // Si es una función única, tomarla del input
            if (!appState.editingMultipleFunciones) {
                const fecha = document.getElementById('funcionUnicaFecha').value;
                const hora = document.getElementById('funcionUnicaHora').value;
                if (!fecha || !hora) {
                    alert('⚠️ Debes ingresar al menos la fecha y hora de la función');
                    return;
                }
                // Preservar todos los datos ya registrados de la función existente
                // (ventas, cortesías, registrados, etc.) — solo actualizamos fecha/hora.
                // Antes esto se reconstruía desde cero solo con {fecha, hora}, borrando
                // el progreso ya guardado. Bug corregido el 06/09.
                functionesAGuardar.push({ ...(appState.editingFunciones[0] || {}), fecha, hora });
            } else {
                if (appState.editingFunciones.length === 0) {
                    alert('⚠️ Debes agregar al menos una función');
                    return;
                }
                functionesAGuardar = appState.editingFunciones;
            }

            // Obtener todas las fechas
            const fechaTiquetera = document.getElementById('obraFechaTiquetera').value;
            const fechaRedes = document.getElementById('obraFechaRedes').value;
            const fechaPauta = document.getElementById('obraFechaPauta').value;

            // Calcular primera y última función
            const fechas = functionesAGuardar.map(f => parsearFechaLocal(f.fecha));
            const primeraFuncion = new Date(Math.min(...fechas));
            const ultimaFuncion = new Date(Math.max(...fechas));

            // Validar que las funciones no sean en el pasado (bloqueante)
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            for (let f of functionesAGuardar) {
                const fechaFuncion = parsearFechaLocal(f.fecha);
                if (fechaFuncion < hoy) {
                    alert('⚠️ Error: Las funciones no pueden ser en fechas pasadas.\n\nFecha de función: ' + formatearFecha(f.fecha) + '\nFecha de hoy: ' + formatearFecha(hoy.toISOString().split('T')[0]));
                    return;
                }
            }

            // Aviso NO bloqueante: si tiquetera/redes/pauta quedan después de la
            // primera función, o en un orden inusual, solo se advierte — el usuario
            // decide si es correcto (por ejemplo, obras que ya llevan tiempo en cartelera).
            const tiquetera = fechaTiquetera ? new Date(fechaTiquetera) : null;
            const redes = fechaRedes ? new Date(fechaRedes) : null;
            const pauta = fechaPauta ? new Date(fechaPauta) : null;
            const avisos = [];
            if (tiquetera && tiquetera >= primeraFuncion) avisos.push('la fecha en tiquetera es igual o posterior a la primera función');
            if (redes && redes >= primeraFuncion) avisos.push('la fecha de redes es igual o posterior a la primera función');
            if (pauta && pauta >= primeraFuncion) avisos.push('la fecha de pauta es igual o posterior a la primera función');
            if (redes && pauta && redes > pauta) avisos.push('la fecha de redes es posterior a la de pauta');
            if (avisos.length > 0) {
                const continuar = confirm('⚠️ Revisa estas fechas, parecen inusuales:\n\n- ' + avisos.join('\n- ') + '\n\n¿Confirmas que son correctas y quieres continuar?');
                if (!continuar) return;
            }


            const data = {
                nombre: document.getElementById('obraNombre').value,
                artista: document.getElementById('obraArtista').value,
                categoria: document.getElementById('obraCategoria').value,
                salaId: document.getElementById('obraSala').value,
                tipo: document.getElementById('obraTipo').value,
                agrupadorId: document.getElementById('obraAgrupador').value || null,
                cortesias: parseInt(document.getElementById('obraCortesias').value) || 0,
                aforo: document.getElementById('obraAforo').value === '' ? null : (parseInt(document.getElementById('obraAforo').value) || null),
                sillasBloqueadas: parseInt(document.getElementById('obraSillasBloqueadas').value) || 0,
                fechaTiquetera: fechaTiquetera,
                fechaUltimaFuncion: ultimaFuncion.toISOString().split('T')[0],
                fechaRedes: fechaRedes || null,
                fechaPauta: fechaPauta || null,
                piezasDesarrolladas: document.getElementById('obraPiezas').checked,
                fechaPiezasDesarrolladas: document.getElementById('obraFechaPiezas').value || null,
                videoDisponible: document.getElementById('obraVideo').checked,
                fechaVideoPatua: document.getElementById('obraFechaVideo').value || null,
                linkRegistro: document.getElementById('obraLinkRegistro')?.value || null,
                fechaCreacionLink: document.getElementById('obraFechaCreacionLink')?.value || null,
                estadoEnlace: document.getElementById('obraEstadoEnlace')?.value || 'Activo'
            };

            const permitidoCrear = tipoQuePuedeCrear();
            if (!appState.editingObra && permitidoCrear !== 'ambos' && data.tipo !== permitidoCrear) {
                alert('⚠️ Tu perfil solo puede crear obras de ' + nombreTipo(permitidoCrear) + '.');
                return;
            }

            let obraId;
            if (appState.editingObra) {
                const antes = { ...appState.editingObra };
                if (antes.tipo !== data.tipo) {
                    const nombreTipo = (t) => t === 'boleteria' ? 'Boletería' : 'Entrada Libre';
                    const seguira = puedeEditarObra({ tipo: data.tipo });
                    const aviso = '⚠️ Vas a cambiar esta obra de ' + nombreTipo(antes.tipo) + ' a ' + nombreTipo(data.tipo) + '.' +
                        (seguira ? '' : '\n\nDespués del cambio ya no vas a poder editarla, porque queda fuera de tu tipo de obras.') +
                        '\n\nEl cambio queda registrado en el Historial. ¿Continuar?';
                    if (!confirm(aviso)) return;
                }
                const funcionesAntes = getFuncionesObra(appState.editingObra.id).length;
                Object.assign(appState.editingObra, data);
                obraId = appState.editingObra.id;
                appState.funciones = appState.funciones.filter(f => f.obraId !== obraId);

                const cambios = diferenciasObra(antes, data);
                if (funcionesAntes !== functionesAGuardar.length) {
                    cambios.push('Funciones: ' + funcionesAntes + ' → ' + functionesAGuardar.length);
                }
                if (cambios.length > 0) {
                    registrarHistorial({
                        obraId: obraId,
                        accion: 'Edición de obra',
                        detalles: cambios.join(' | ')
                    });
                }
            } else {
                obraId = Date.now().toString();
                appState.obras.push({ id: obraId, ...data });
                const sala = getSala(data.salaId);
                registrarHistorial({
                    obraId: obraId,
                    accion: 'Creación de obra',
                    detalles: data.nombre + ' — ' + (data.tipo === 'boleteria' ? 'Boletería' : 'Entrada Libre') +
                        (sala ? ' · ' + sala.nombre : '') + ' · ' + functionesAGuardar.length + ' función(es)'
                });
            }

            // Guardar funciones — preservando el progreso ya registrado
            // (ventas, cortesías, registrados, asistencia) cuando la función ya existía.
            // Antes esto se reseteaba a 0 en CADA edición de la obra, sin importar
            // qué campo se editara — bug corregido el 04/09.
            functionesAGuardar.forEach(f => {
                appState.funciones.push({
                    id: f.id?.startsWith('temp-') ? ('fn-' + Date.now() + Math.random()).replace('.', '') : (f.id || Date.now().toString()),
                    obraId: obraId,
                    fecha: f.fecha,
                    hora: f.hora,
                    estado: f.estado || 'programada',
                    ventasAcumuladas: f.ventasAcumuladas || 0,
                    ventasPorDia: f.ventasPorDia || [],
                    cortesias: f.cortesias || 0,
                    cortesiasEntregadas: f.cortesiasEntregadas || 0,
                    registrados: f.registrados || 0,
                    asistenciaTotal: f.asistenciaTotal || 0
                });
            });

            saveData();
            appState.currentPage = 'obras';
            appState.editingObra = null;
            appState.editingFunciones = [];
            appState.editingMultipleFunciones = false;
            alert('✅ Obra guardada correctamente');
            render();
        }

        function guardarCortesVentasFunciones(event) {
            if (!tienePermiso('registrar_venta')) {
                event.preventDefault();
                alert('⚠️ Tu usuario no puede registrar ventas.');
                return;
            }
            event.preventDefault();
            const inputs = document.querySelectorAll('input[data-funcion-id]');

            // Validar ANTES de guardar nada: no se puede vender más boletas de
            // las que hay disponibles (aforo - cortesías) en ninguna función.
            const errores = [];
            inputs.forEach(input => {
                const boletas = parseInt(input.value) || 0;
                if (boletas <= 0) return;
                const funcionId = input.getAttribute('data-funcion-id');
                const funcion = appState.funciones.find(f => f.id === funcionId);
                if (!funcion) return;
                const obra = appState.obras.find(o => o.id === funcion.obraId);
                const sala = obra ? getSala(obra.salaId) : null;
                const disponible = Math.max(0, getAforo(obra) - (funcion.cortesias || 0));
                const nuevoTotal = (funcion.ventasAcumuladas || 0) + boletas;
                if (nuevoTotal > disponible) {
                    const maxPermitido = Math.max(0, disponible - (funcion.ventasAcumuladas || 0));
                    errores.push('"' + (obra?.nombre || 'Obra') + '" (' + formatearFecha(funcion.fecha) + ' ' + funcion.hora + '): intentas registrar ' + boletas + ', pero solo quedan ' + maxPermitido + ' boletas disponibles.');
                }
            });

            if (errores.length > 0) {
                alert('⚠️ No se puede vender más boletas de las disponibles:\n\n' + errores.join('\n'));
                return;
            }

            let guardadas = 0;
            
            inputs.forEach(input => {
                const funcionId = input.getAttribute('data-funcion-id');
                const boletas = parseInt(input.value) || 0;
                
                if (boletas > 0) {
                    const funcion = appState.funciones.find(f => f.id === funcionId);
                    if (funcion) {
                        funcion.ventasAcumuladas = (funcion.ventasAcumuladas || 0) + boletas;
                        
                        // Registrar venta diaria
                        if (!funcion.ventasPorDia) funcion.ventasPorDia = [];
                        const hoy = new Date().toISOString().split('T')[0];
                        funcion.ventasPorDia.push({ fecha: hoy, boletas: boletas });
                        
                        registrarHistorial({
                            obraId: funcion.obraId,
                            funcionId: funcionId,
                            accion: 'Registro de ventas',

        async function guardarInscritosHoy(event) {
            event.preventDefault();
            const inputs = document.querySelectorAll('input[data-entrada-funcion-id]');
            let guardados = 0;

            inputs.forEach(input => {
                const funcionId = input.getAttribute('data-entrada-funcion-id');
                const cantidad = parseInt(input.value) || 0;

                if (cantidad > 0) {
                    const funcion = appState.funciones.find(f => f.id === funcionId);
                    if (funcion) {
                        funcion.registrados = (funcion.registrados || 0) + cantidad;

                        if (!funcion.registrosPorDia) funcion.registrosPorDia = [];
                        const hoy = new Date().toISOString().split('T')[0];
                        funcion.registrosPorDia.push({ fecha: hoy, registrados: cantidad });

                        registrarHistorial({
                            obraId: funcion.obraId,
                            funcionId: funcionId,
                            accion: 'Registro de inscritos',
                            detalles: 'Inscritos: +' + cantidad + ' (acumulado: ' + funcion.registrados + ') — función ' + formatearFecha(funcion.fecha) + ' ' + formatearHora(funcion.hora)
                        });

                        guardados++;
                        input.value = '0';
                    }
                }
            });

            if (guardados > 0) {
                await saveData();
                alert('✅ ' + guardados + ' actividad(es) actualizada(s)');
                render();
            } else {
                alert('⚠️ No hay registros para guardar');
            }
        }

        // ============================================
        // COPIA DE SEGURIDAD EN EXCEL
        // ============================================
        // Las hojas de datos guardan las filas tal como viven en Supabase
        // (snake_case), para que la restauración sea directa. Las columnas
        // con arreglos JSON se guardan como texto y se vuelven a parsear.
        const HOJAS_BACKUP = [
            { hoja: 'salas', tabla: 'boleteria_salas' },
            { hoja: 'categorias', tabla: 'boleteria_categorias' },
            { hoja: 'agrupadores', tabla: 'boleteria_agrupadores' },
            { hoja: 'obras', tabla: 'boleteria_obras' },
            { hoja: 'funciones', tabla: 'boleteria_funciones' },
            { hoja: 'acciones', tabla: 'boleteria_acciones' },
            { hoja: 'historial', tabla: 'boleteria_historial' }
        ];
        const COLUMNAS_JSON_BACKUP = ['ventas_por_dia', 'registros_por_dia'];

        function filasBackup() {
            return {
                salas: appState.salas.map(s => ({ id: s.id, nombre: s.nombre, aforo: s.aforo, color: s.color || '#8b5cf6' })),
                categorias: appState.categorias.map(c => ({ id: c.id, nombre: c.nombre })),
                agrupadores: appState.agrupadores.map(a => ({ id: a.id, nombre: a.nombre })),
                obras: appState.obras.map(obraToDb),
                funciones: appState.funciones.map(funcionToDb),
                acciones: appState.acciones.map(accionToDb),
                historial: appState.historial.map(historialToDb)
            };
        }

        // Hoja legible (no se usa al restaurar) con el estado de herramientas por obra
        function hojaHerramientasBackup() {
            const secciones = construirTablasRequisitos();
            const filas = [];
            secciones.forEach(sec => {
                const tipo = sec.titulo.indexOf('Boletería') !== -1 ? 'Boletería' : 'Entrada Libre';
                sec.filas.forEach(f => {
                    const fila = { Tipo: tipo, Obra: f.nombre };
                    sec.columnas.forEach((col, i) => { fila[col] = f.valores[i] ? 'Sí' : 'No'; });
                    filas.push(fila);
                });
            });
            return filas;
        }

        async function descargarBackupExcel() {
            if (!window.XLSX) {
                alert('⚠️ No se pudo generar el Excel. Recarga la página e intenta de nuevo.');
                return;
            }
            try {
                // Se lee directo de la base para incluir TODO (el estado en memoria
                // solo conserva los últimos 50 registros de historial)
                let datos = filasBackup();
                try {
                    const respuestas = await Promise.all(HOJAS_BACKUP.map(h => db.from(h.tabla).select('*')));
                    const desdeDb = {};
                    let completo = true;
                    respuestas.forEach((res, i) => {
                        if (res.error) completo = false;
                        desdeDb[HOJAS_BACKUP[i].hoja] = res.data || [];
                    });
                    if (completo) datos = desdeDb;
                } catch (e) {
                    console.warn('No se pudo leer todo desde la base, se usa el estado en memoria', e);
                }
                const libro = XLSX.utils.book_new();

                HOJAS_BACKUP.forEach(({ hoja }) => {
                    const filas = (datos[hoja] || []).map(fila => {
                        const copia = {};
                        Object.keys(fila).forEach(k => {
                            copia[k] = COLUMNAS_JSON_BACKUP.indexOf(k) !== -1 ? JSON.stringify(fila[k] || []) : fila[k];
                        });
                        return copia;
                    });
                    XLSX.utils.book_append_sheet(libro, XLSX.utils.json_to_sheet(filas), hoja);
                });

                const herramientas = hojaHerramientasBackup();
                if (herramientas.length > 0) {
                    XLSX.utils.book_append_sheet(libro, XLSX.utils.json_to_sheet(herramientas), 'herramientas');
                }

                const fecha = new Date().toISOString().split('T')[0];
                XLSX.writeFile(libro, 'backup-salas-llenas-' + fechaParaArchivo() + '.xlsx');
            } catch (err) {
                console.error('Error generando backup:', err);
                alert('⚠️ Error al generar el archivo de backup.');
            }
        }

        async function restaurarBackupExcel(event) {
            const archivo = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!archivo) return;
            if (!window.XLSX) {
                alert('⚠️ No se pudo leer el Excel. Recarga la página e intenta de nuevo.');
                return;
            }

            let libro;
            try {
                const buffer = await archivo.arrayBuffer();
                libro = XLSX.read(buffer, { type: 'array' });
            } catch (err) {
                console.error(err);
                alert('⚠️ No se pudo leer el archivo. ¿Seguro que es un backup en Excel de este sistema?');
                return;
            }

            const faltantes = HOJAS_BACKUP.filter(h => libro.SheetNames.indexOf(h.hoja) === -1).map(h => h.hoja);
            if (faltantes.length > 0) {
                alert('⚠️ El archivo no parece un backup de este sistema. Faltan las hojas: ' + faltantes.join(', '));
                return;
            }

            const contenido = {};
            HOJAS_BACKUP.forEach(({ hoja }) => {
                const filas = XLSX.utils.sheet_to_json(libro.Sheets[hoja], { defval: null });
                contenido[hoja] = filas.map(fila => {
                    const limpia = {};
                    Object.keys(fila).forEach(k => {
                        if (COLUMNAS_JSON_BACKUP.indexOf(k) !== -1) {
                            try { limpia[k] = typeof fila[k] === 'string' ? JSON.parse(fila[k]) : (fila[k] || []); }
                            catch (e) { limpia[k] = []; }
                        } else {
                            limpia[k] = fila[k] === '' ? null : fila[k];
                        }
                    });
                    return limpia;
                });
            });

            const resumen = 'Se van a cargar ' + contenido.obras.length + ' obra(s), ' + contenido.funciones.length +
                ' función(es), ' + contenido.salas.length + ' sala(s) y ' + contenido.historial.length + ' registro(s) de historial.';

            if (!confirm('⚠️ ATENCIÓN\n\nEsto BORRA TODA la información actual del sistema (obras, funciones, ventas, registros, salas, categorías, agrupadores e historial) y la reemplaza por la del archivo.\n\n' + resumen + '\n\nEsta acción NO se puede deshacer. ¿Continuar?')) {
                return;
            }

            const escrito = prompt('Para confirmar, escribe BORRAR en mayúsculas:');
            if (escrito !== 'BORRAR') {
                alert('Restauración cancelada. No se borró nada.');
                return;
            }

            try {
                // Borrar primero lo que depende de obras, luego el resto
                const ordenBorrado = ['boleteria_historial', 'boleteria_acciones', 'boleteria_funciones', 'boleteria_obras', 'boleteria_agrupadores', 'boleteria_categorias', 'boleteria_salas'];
                for (const tabla of ordenBorrado) {
                    const { error } = await db.from(tabla).delete().not('id', 'is', null);
                    if (error) throw error;
                }

                // Insertar en orden inverso para respetar las llaves foráneas
                const ordenInsercion = ['salas', 'categorias', 'agrupadores', 'obras', 'funciones', 'acciones', 'historial'];
                for (const hoja of ordenInsercion) {
                    const filas = contenido[hoja];
                    if (!filas || filas.length === 0) continue;
                    const tabla = HOJAS_BACKUP.find(h => h.hoja === hoja).tabla;
                    for (let i = 0; i < filas.length; i += 200) {
                        const { error } = await db.from(tabla).insert(filas.slice(i, i + 200));
                        if (error) throw error;
                    }
                }

                await initData();
                appState.reportePaginasGeneradas = null;
                render();
                alert('✅ Backup restaurado. El sistema quedó con la información del archivo.');
            } catch (err) {
                console.error('Error restaurando backup:', err);
                alert('⚠️ Error restaurando el backup: ' + (err.message || 'revisa la consola') + '\n\nLa base pudo quedar incompleta. Vuelve a intentar con el archivo correcto.');
                await initData();
                render();
            }
        }

        const PALETA_SALAS_FALLBACK = ['#8b5cf6', '#f97316', '#14b8a6', '#ec4899', '#eab308', '#6366f1', '#84cc16', '#06b6d4'];
        function getColorSala(salaId) {
            const sala = appState.salas.find(s => s.id === salaId);
            if (sala && sala.color) return sala.color;
            const idx = appState.salas.findIndex(s => s.id === salaId);
            return PALETA_SALAS_FALLBACK[(idx >= 0 ? idx : 0) % PALETA_SALAS_FALLBACK.length];
        }
        function colorTextoContraste(hex) {
            if (!hex) return '#111827';
            const c = hex.replace('#', '');
            const r = parseInt(c.substr(0, 2), 16);
            const g = parseInt(c.substr(2, 2), 16);
            const b = parseInt(c.substr(4, 2), 16);
            const luminancia = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminancia > 0.6 ? '#111827' : '#ffffff';
        }

        function cambiarPeriodoCalendario(delta) {
            const hoyReal = new Date();
            if (appState.calMes === null || appState.calMes === undefined) appState.calMes = hoyReal.getMonth();
            if (appState.calAnio === null || appState.calAnio === undefined) appState.calAnio = hoyReal.getFullYear();
            if (appState.calDia === null || appState.calDia === undefined) appState.calDia = hoyReal.getDate();

            if (appState.calVista === 'dia') {
                const d = new Date(appState.calAnio, appState.calMes, appState.calDia);
                d.setDate(d.getDate() + delta);
                appState.calAnio = d.getFullYear(); appState.calMes = d.getMonth(); appState.calDia = d.getDate();
            } else if (appState.calVista === 'semana') {
                const d = new Date(appState.calAnio, appState.calMes, appState.calDia);
                d.setDate(d.getDate() + delta * 7);
                appState.calAnio = d.getFullYear(); appState.calMes = d.getMonth(); appState.calDia = d.getDate();
            } else if (appState.calVista === 'anio') {
                appState.calAnio += delta;
            } else {
                let nuevoMes = appState.calMes + delta;
                let nuevoAnio = appState.calAnio;
                if (nuevoMes < 0) { nuevoMes = 11; nuevoAnio--; }
                if (nuevoMes > 11) { nuevoMes = 0; nuevoAnio++; }
                appState.calMes = nuevoMes;
                appState.calAnio = nuevoAnio;
            }
            render();
        }

        // Documento imprimible con toda la programación en formato calendario.
        // Se abre en una ventana nueva y se manda a imprimir; el navegador ofrece
        // "Guardar como PDF" y el texto queda seleccionable, no es una imagen.
        function descargarProgramacionPDF() {
            const alcance = tipoDeTrabajo();
            const funciones = appState.funciones.filter(f => {
                const obra = appState.obras.find(o => o.id === f.obraId);
                if (!obra) return false;
                if (alcance && obra.tipo !== alcance) return false;
                if (appState.calFiltroTipo !== 'todas' && obra.tipo !== appState.calFiltroTipo) return false;
                if (appState.calFiltroSala !== 'todas' && obra.salaId !== appState.calFiltroSala) return false;
                return true;
            });

            if (funciones.length === 0) {
                alert('No hay funciones programadas con los filtros actuales.');
                return;
            }

            const MESES_PDF = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const DIAS_PDF = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const escapar = (t) => String(t === null || t === undefined ? '' : t)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            // Un bloque por cada mes que tenga programación, en orden cronológico
            const mesesConDatos = Array.from(new Set(funciones.map(f => f.fecha.slice(0, 7)))).sort();

            let cuerpo = '';
            mesesConDatos.forEach((clave, indice) => {
                const anio = parseInt(clave.slice(0, 4));
                const mes = parseInt(clave.slice(5, 7));
                const primerDiaSemana = new Date(anio, mes - 1, 1).getDay();
                const diasDelMes = new Date(anio, mes, 0).getDate();

                cuerpo += '<section' + (indice > 0 ? ' class="salto"' : '') + '>';
                cuerpo += '<h2>' + MESES_PDF[mes - 1] + ' de ' + anio + '</h2>';
                cuerpo += '<table><thead><tr>';
                DIAS_PDF.forEach(d => { cuerpo += '<th>' + d + '</th>'; });
                cuerpo += '</tr></thead><tbody><tr>';

                let columna = 0;
                for (let i = 0; i < primerDiaSemana; i++) {
                    cuerpo += '<td class="vacio"></td>';
                    columna++;
                }

                for (let dia = 1; dia <= diasDelMes; dia++) {
                    if (columna === 7) { cuerpo += '</tr><tr>'; columna = 0; }
                    const fecha = anio + '-' + String(mes).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
                    const delDia = funciones.filter(f => f.fecha === fecha)
                        .sort((a, b) => String(a.hora || '').localeCompare(String(b.hora || '')));

                    cuerpo += '<td><div class="numero">' + dia + '</div>';
                    delDia.forEach(f => {
                        const obra = appState.obras.find(o => o.id === f.obraId);
                        const fondo = getColorSala(obra.salaId);
                        const texto = colorTextoContraste(fondo);
                        const emoji = obra.tipo === 'boleteria' ? '\uD83D\uDCB5' : '\uD83C\uDF9F\uFE0F';
                        cuerpo += '<div class="evento" style="background:' + fondo + '; color:' + texto + ';">';
                        cuerpo += '<span class="hora">' + formatearHora(f.hora) + '</span> ';
                        cuerpo += emoji + ' ' + escapar(obra.nombre);
                        cuerpo += '<div class="sala">' + escapar(getSala(obra.salaId)?.nombre || '') + '</div>';
                        cuerpo += '</div>';
                    });
                    cuerpo += '</td>';
                    columna++;
                }
                while (columna < 7) { cuerpo += '<td class="vacio"></td>'; columna++; }
                cuerpo += '</tr></tbody></table></section>';
            });

            let leyendaTipos = '';
            if (!alcance || alcance === 'boleteria') leyendaTipos += '\uD83D\uDCB5 Boletería &nbsp; ';
            if (!alcance || alcance === 'entrada_libre') leyendaTipos += '\uD83C\uDF9F\uFE0F Entrada Libre &nbsp; ';

            let leyenda = '';
            appState.salas.forEach(sala => {
                leyenda += '<span class="chip"><i style="background:' + getColorSala(sala.id) + '"></i>' + escapar(sala.nombre) + '</span>';
            });

            const filtroSala = appState.calFiltroSala === 'todas' ? 'Todas las salas' : (getSala(appState.calFiltroSala)?.nombre || '');
            const filtroTipo = alcance ? ('Solo ' + nombreTipo(alcance))
                : (appState.calFiltroTipo === 'todas' ? 'Boletería y Entrada Libre'
                    : (appState.calFiltroTipo === 'boleteria' ? 'Solo Boletería' : 'Solo Entrada Libre'));
            const sufijoTitulo = alcance ? ' - ' + nombreTipo(alcance) : ' - Programación';
            const sufijoArchivo = alcance ? '-' + (alcance === 'boleteria' ? 'boleteria' : 'entrada-libre') : '';

            const estilos = [
                '@page { size: A4 landscape; margin: 12mm; }',
                'body { font-family: Arial, Helvetica, sans-serif; color:#111; margin:0; }',
                '* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }',
                'h1 { font-size:20px; margin:0 0 4px; }',
                'h2 { font-size:15px; margin:0 0 8px; }',
                '.meta { font-size:11px; color:#555; margin-bottom:10px; }',
                '.chip { font-size:10px; margin-right:10px; white-space:nowrap; }',
                '.chip i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }',
                'table { width:100%; border-collapse:collapse; table-layout:fixed; }',
                'th { font-size:10px; text-transform:uppercase; color:#555; border-bottom:1px solid #999; padding:4px 2px; }',
                'td { border:1px solid #ddd; vertical-align:top; padding:3px; height:92px; width:14.28%; }',
                'td.vacio { background:#fafafa; }',
                '.numero { font-size:12px; font-weight:bold; color:#333; margin-bottom:2px; }',
                '.evento { font-size:9px; line-height:1.25; padding:3px 4px; margin-bottom:3px; border-radius:3px; word-break:break-word; }',
                '.hora { font-weight:bold; }',
                '.sala { font-size:8px; opacity:0.85; }',
                'section { page-break-inside:avoid; }',
                'section.salto { page-break-before:always; }'
            ].join(' ');

            const doc = '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
                '<title>salas-llenas' + sufijoArchivo + '-' + fechaParaArchivo() + '</title><style>' + estilos + '</style></head><body>' +
                '<h1>Salas Llenas' + sufijoTitulo + '</h1>' +
                '<div class="meta">Generado el ' + formatearFecha(new Date().toISOString().split('T')[0]) +
                ' · ' + escapar(filtroSala) + ' · ' + filtroTipo + ' · ' + funciones.length + ' funciones<br>' +
                leyendaTipos + '&nbsp;&nbsp; ' + leyenda + '</div>' +

            const ventana = window.open('', '_blank');

                alert('El navegador bloqueó la ventana emergente. Permítelas para este sitio e intenta de nuevo.');

            ventana.focus();
            setTimeout(() => ventana.print(), 400);
        }

        function renderCalendario() {
