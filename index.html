            if (appState.calAnio === null || appState.calAnio === undefined) appState.calAnio = hoyReal.getFullYear();
            if (appState.calDia === null || appState.calDia === undefined) appState.calDia = hoyReal.getDate();
            if (!appState.calVista) appState.calVista = 'mes';

            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const diasSemanaCortos = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

            let html = '<div class="min-h-screen bg-white md:pl-64">' + renderHeader() + renderNav();
            html += '<main class="max-w-7xl mx-auto px-4 md:px-8 py-8">';

            // Título dinámico según la vista
            let titulo = '';
            if (appState.calVista === 'dia') {
                const d = new Date(appState.calAnio, appState.calMes, appState.calDia);
                titulo = d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
            } else if (appState.calVista === 'semana') {
                const base = new Date(appState.calAnio, appState.calMes, appState.calDia);
                const inicioSemana = new Date(base);
                inicioSemana.setDate(base.getDate() - base.getDay());
                const finSemana = new Date(inicioSemana);
                finSemana.setDate(inicioSemana.getDate() + 6);
                titulo = inicioSemana.getDate() + ' - ' + finSemana.getDate() + ' de ' + meses[finSemana.getMonth()] + ' de ' + finSemana.getFullYear();
            } else if (appState.calVista === 'anio') {
                titulo = String(appState.calAnio);
            } else {
                titulo = meses[appState.calMes] + ' de ' + appState.calAnio;
            }

            // Encabezado
            html += '<div class="flex flex-wrap justify-between items-center gap-4 mb-4">';
            html += '<h1 class="text-2xl md:text-4xl font-light">' + titulo + '</h1>';
            html += '<div class="flex gap-2">';
            html += '<button onclick="cambiarPeriodoCalendario(-1)" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded border">← Anterior</button>';
            html += '<button onclick="irCalendarioHoy()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded border font-medium">Hoy</button>';
            html += '<button onclick="cambiarPeriodoCalendario(1)" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded border">Siguiente →</button>';
            html += '<button onclick="descargarProgramacionPDF()" class="px-4 py-2 bg-gray-800 text-white rounded font-medium hover:bg-gray-900">🖨️ PDF</button>';
            html += '</div>';
            html += '</div>';

            // Pestañas de vista
            html += '<div class="flex gap-1 mb-6 bg-gray-100 p-1 rounded-lg w-fit">';
            [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes'], ['anio', 'Año']].forEach(([id, label]) => {
                const activo = appState.calVista === id;
                html += '<button onclick="cambiarVistaCalendario(\'' + id + '\')" class="px-4 py-1.5 rounded-md text-sm font-medium transition ' + (activo ? 'bg-white shadow text-gray-900' : 'text-gray-600 hover:text-gray-900') + '">' + label + '</button>';
            });
            html += '</div>';

            // Filtros (aplican a todas las vistas)
            html += '<div class="flex flex-wrap gap-3 mb-6 bg-gray-50 p-3 rounded border">';
            html += '<div><label class="block text-xs font-medium mb-1 text-gray-600">Sala</label><select id="calFiltroSala" onchange="aplicarFiltrosCalendario()" class="px-3 py-1.5 border rounded text-sm">';
            html += '<option value="todas"' + (appState.calFiltroSala === 'todas' ? ' selected' : '') + '>Todas las salas</option>';
            appState.salas.forEach(s => html += '<option value="' + s.id + '"' + (appState.calFiltroSala === s.id ? ' selected' : '') + '>' + s.nombre + '</option>');
            html += '</select></div>';
            html += '<div><label class="block text-xs font-medium mb-1 text-gray-600">Tipo</label><select id="calFiltroTipo" onchange="aplicarFiltrosCalendario()" class="px-3 py-1.5 border rounded text-sm">';
            html += '<option value="todas"' + (appState.calFiltroTipo === 'todas' ? ' selected' : '') + '>Boletería y Entrada Libre</option>';
            html += '<option value="boleteria"' + (appState.calFiltroTipo === 'boleteria' ? ' selected' : '') + '>Solo Boletería</option>';
            html += '<option value="entrada_libre"' + (appState.calFiltroTipo === 'entrada_libre' ? ' selected' : '') + '>Solo Entrada Libre</option>';
            html += '</select></div>';
            html += '</div>';

            // Leyenda
            html += '<div class="flex flex-wrap gap-x-4 gap-y-1 mb-4 text-xs text-gray-700 items-center">';
            appState.salas.forEach(s => {
                const color = getColorSala(s.id);
                html += '<span style="display:inline-flex; align-items:center;"><span style="display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:5px; background:' + color + ';"></span>' + s.nombre + '</span>';
            });

            html += '<span>💵 Boletería</span><span>🎟️ Entrada Libre</span>';

            // Cuerpo según la vista seleccionada
            if (appState.calVista === 'dia') {
                html += renderVistaDiaCalendario();
            } else if (appState.calVista === 'semana') {
                html += renderVistaSemanaCalendario(diasSemanaCortos);
            } else if (appState.calVista === 'anio') {
                html += renderVistaAnioCalendario(meses);

        function renderVistaDiaCalendario() {
            const hoyReal = new Date();
            const fecha = String(appState.calAnio) + '-' + String(appState.calMes + 1).padStart(2, '0') + '-' + String(appState.calDia).padStart(2, '0');
            const esHoy = fecha === hoyReal.toISOString().split('T')[0];
            const funciones = getFuncionesFiltradasFecha(fecha).sort((a, b) => a.hora.localeCompare(b.hora));

            let html = '<div class="bg-white border rounded-lg p-4">';
            if (esHoy) html += '<p class="text-sm text-red-600 font-bold mb-3">● Hoy</p>';
            if (funciones.length === 0) {
                html += '<p class="text-gray-500 text-sm">Sin funciones/actividades este día.</p>';
            } else {
                funciones.forEach(f => {
                    const obra = appState.obras.find(o => o.id === f.obraId);
                    const sala = getSala(obra.salaId);
                    const colorFondo = getColorSala(obra.salaId);
                    const colorTexto = colorTextoContraste(colorFondo);
                    const icono = obra.tipo === 'boleteria' ? '💵' : '🎟️';
                    html += '<div style="border-left:6px solid ' + colorFondo + ';" class="flex justify-between items-center bg-gray-50 rounded p-3 mb-2 cursor-pointer hover:bg-gray-100" onclick="viewObra(\'' + obra.id + '\')">';
                    html += '<div><div class="font-bold text-sm">' + icono + ' ' + obra.nombre + '</div><div class="text-xs text-gray-600">' + (sala?.nombre || '') + ' · ' + (obra.categoria || '') + '</div></div>';
                    html += '<div class="text-right"><div class="font-bold text-lg">' + f.hora + '</div></div>';
                    html += '</div>';
                });
            }
            html += '</div>';
            return html;
        }

        function renderVistaSemanaCalendario(diasSemanaCortos) {
            const hoyReal = new Date();
            const base = new Date(appState.calAnio, appState.calMes, appState.calDia);
            const inicioSemana = new Date(base);
            inicioSemana.setDate(base.getDate() - base.getDay());

            let html = '<div class="grid grid-cols-7 gap-px bg-gray-300 border border-gray-300">';
            for (let i = 0; i < 7; i++) {
                const d = new Date(inicioSemana);
                d.setDate(inicioSemana.getDate() + i);
                const fecha = d.toISOString().split('T')[0];
                const esHoy = fecha === hoyReal.toISOString().split('T')[0];
                const funciones = getFuncionesFiltradasFecha(fecha);

                html += '<div class="bg-white min-h-64 p-2">';
                html += '<div class="text-center mb-2 pb-1 border-b"><div class="text-xs text-gray-500">' + diasSemanaCortos[i] + '</div>';
                html += esHoy

                    : '<div class="text-lg font-light">' + d.getDate() + '</div>';
                html += '</div>';
                funciones.forEach(f => { html += renderEventoCalendario(f, true); });
                if (funciones.length === 0) html += '<p class="text-xs text-gray-300 text-center mt-2">—</p>';
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function renderVistaMesCalendario(meses, diasSemanaCortos) {
            const hoyReal = new Date();
            const mes = appState.calMes;
            const anio = appState.calAnio;
            const primerDia = new Date(anio, mes, 1).getDay();
            const diasMes = new Date(anio, mes + 1, 0).getDate();

            let html = '<div class="grid grid-cols-7 gap-px bg-gray-100 border-b border-gray-300 mb-px">';
            diasSemanaCortos.forEach(d => {
                html += '<div class="text-center font-semibold text-gray-700 py-3 text-sm bg-white">' + d + '</div>';

            html += '<div class="grid grid-cols-7 gap-px bg-gray-300">';
            for (let i = 0; i < primerDia; i++) {
                html += '<div class="bg-gray-50 p-2" style="min-height:150px;"></div>';
            }
            for (let dia = 1; dia <= diasMes; dia++) {
                const fecha = String(anio) + '-' + String(mes + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
                const funcionesDia = getFuncionesFiltradasFecha(fecha);
                const esHoy = fecha === hoyReal.toISOString().split('T')[0];

                html += '<div class="bg-white p-2 hover:bg-gray-50 cursor-pointer" style="min-height:150px;" onclick="irADiaCalendario(' + anio + ',' + mes + ',' + dia + ')">';
                html += esHoy
                    ? '<div class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-red-500 text-white text-lg font-bold mb-1">' + dia + '</div>'
                    : '<div class="text-xl font-light text-gray-900 mb-1">' + dia + '</div>';

                html += '<div class="space-y-0.5">';
                funcionesDia.forEach(f => { html += renderEventoCalendario(f, true); });
                html += '</div></div>';
            }
            html += '</div>';
            return html;

        function renderVistaAnioCalendario(meses) {
            const hoyReal = new Date();
            const anio = appState.calAnio;
            let html = '<div class="grid grid-cols-1 md:grid-cols-3 gap-6">';

            for (let m = 0; m < 12; m++) {

                html += '<div class="border rounded-lg p-3">';
                html += '<div class="text-center font-bold mb-2 cursor-pointer hover:text-blue-600" onclick="irAMesCalendario(' + anio + ',' + m + ')">' + meses[m] + '</div>';
                html += '<div class="grid grid-cols-7 gap-0.5 text-[10px] text-gray-400 mb-1">';
                ['D', 'L', 'M', 'M', 'J', 'V', 'S'].forEach(d => html += '<div class="text-center">' + d + '</div>');
                html += '</div>';
                html += '<div class="grid grid-cols-7 gap-0.5">';
                for (let i = 0; i < primerDia; i++) html += '<div></div>';
                for (let dia = 1; dia <= diasMes; dia++) {
                    const fecha = String(anio) + '-' + String(m + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
                    const tieneEventos = getFuncionesFiltradasFecha(fecha).length > 0;
                    const esHoy = fecha === hoyReal.toISOString().split('T')[0];
                    html += '<div onclick="irADiaCalendario(' + anio + ',' + m + ',' + dia + ')" class="text-center text-[11px] py-0.5 rounded cursor-pointer hover:bg-gray-100 ' + (esHoy ? 'bg-red-500 text-white font-bold' : '') + '">' + dia;
                    if (tieneEventos && !esHoy) html += '<div style="width:4px; height:4px; border-radius:50%; background:#3b82f6; margin:0 auto;"></div>';
                    html += '</div>';
                }
                html += '</div></div>';
            }
            html += '</div>';
            return html;
        }

        function irADiaCalendario(anio, mes, dia) {
            appState.calAnio = anio;
            appState.calMes = mes;
            appState.calDia = dia;

            });

        function renderGraficosReportes(obrasBoleto, obrasEntrada) {
            if (!window.Chart) return;

            if (window.chartPctVentasInstance) window.chartPctVentasInstance.destroy();
            if (window.chartPctRegistradosInstance) window.chartPctRegistradosInstance.destroy();

            const canvasVentas = document.getElementById('chartPctVentas');
            if (canvasVentas && obrasBoleto.length > 0) {
                const datos = obrasBoleto.map(obra => {
                    const sala = getSala(obra.salaId);
                    const funciones = getFuncionesObra(obra.id);
                    const totalVentas = funciones.reduce((sum, f) => sum + (f.ventasAcumuladas || 0), 0);
                    const totalDisponible = funciones.reduce((sum, f) => sum + Math.max(0, getAforo(obra) - (f.cortesias || 0)), 0);
                    const pct = totalDisponible > 0 ? Math.round((totalVentas / totalDisponible) * 100) : 0;
                    return { nombre: obra.nombre, pct };
                }).sort((a, b) => b.pct - a.pct);

                window.chartPctVentasInstance = new Chart(canvasVentas, {
                    type: 'bar',
                    data: {
                        labels: datos.map(d => d.nombre + (d.pct >= 100 ? ' 🎉 SALA LLENA' : '')),
                        datasets: [{
                            label: '% de venta',
                            data: datos.map(d => d.pct),
                            backgroundColor: datos.map(d => colorPctHex(d.pct)),
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true, ticks: { callback: v => v + '%' } } }
                    }
                });
            }

            const canvasRegistros = document.getElementById('chartPctRegistrados');
            if (canvasRegistros && obrasEntrada.length > 0) {
                const datos = obrasEntrada.map(obra => {
                    const sala = getSala(obra.salaId);
                    const funciones = getFuncionesObra(obra.id);
                    const totalRegistrados = funciones.reduce((sum, f) => sum + (f.registrados || 0), 0);
                    const aforoTotal = getAforo(obra) * funciones.length;
                    const pct = aforoTotal > 0 ? Math.round((totalRegistrados / aforoTotal) * 100) : 0;
                    return { nombre: obra.nombre, pct };
                }).sort((a, b) => b.pct - a.pct);

                window.chartPctRegistradosInstance = new Chart(canvasRegistros, {
                    type: 'bar',
                    data: {
                        labels: datos.map(d => d.nombre),
                        datasets: [{
                            label: '% de registrados',
                            data: datos.map(d => d.pct),
                            backgroundColor: datos.map(d => colorPctHex(d.pct)),
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true, ticks: { callback: v => v + '%' } } }
                    }
                });
            }
        }

        const REPORTE_ALTO_ROW = 96;
        const REPORTE_ALTO_MES = 56;
        const REPORTE_ALTO_HEADER = 80;
        const REPORTE_ANCHO = 1080;
        const REPORTE_ALTO_TOTAL = 1920;
        const REPORTE_PADDING = 20;

        const MESES_REPORTE = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        function truncarTexto(texto, maxChars) {
            if (!texto) return '';
            if (texto.length <= maxChars) return texto;
            return texto.slice(0, maxChars - 1).trim() + '…';
        }

        function colorPctHex(pct) {
            if (pct >= 120) return '#86EFAC';
            if (pct >= 100) return '#22C55E';
            if (pct >= 70) return '#15803D';
            if (pct >= 40) return '#EAB308';
            return '#DC2626';
        }

        let registroBadgesPendientes = [];

        function renderBadgePct(pct, contenidoTexto) {
            const bg = colorPctHex(pct);
            const id = 'badge-' + registroBadgesPendientes.length + '-' + Math.random().toString(36).slice(2, 8);
            const anchoEstimado = Math.max(58, contenidoTexto.length * 10 + 24);
            registroBadgesPendientes.push({ id, bg, texto: contenidoTexto, ancho: anchoEstimado, alto: 32 });
            return '<canvas id="' + id + '" width="' + anchoEstimado + '" height="32" style="display:inline-block; vertical-align:middle;"></canvas>';
        }

        function dibujarBadgesPendientesEnCanvas() {
            const FACTOR = 3;
            registroBadgesPendientes.forEach(b => {
                const canvas = document.getElementById(b.id);
                if (!canvas) return;
                const wCss = b.ancho, hCss = b.alto;
                canvas.width = wCss * FACTOR;
                canvas.height = hCss * FACTOR;
                canvas.style.width = wCss + 'px';
                canvas.style.height = hCss + 'px';
                const ctx = canvas.getContext('2d');
                ctx.scale(FACTOR, FACTOR);

                const r = 5;
                ctx.fillStyle = b.bg;
                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.arcTo(wCss, 0, wCss, hCss, r);
                ctx.arcTo(wCss, hCss, 0, hCss, r);
                ctx.arcTo(0, hCss, 0, 0, r);
                ctx.arcTo(0, 0, wCss, 0, r);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.texto, wCss / 2, hCss / 2 + 1);
            });
            registroBadgesPendientes = [];
        }

        let registroIconosPendientes = [];

        function renderIconosEstadoReporte(obra) {
            const id = 'iconos-' + registroIconosPendientes.length + '-' + Math.random().toString(36).slice(2, 8);
            const items = obra.tipo === 'boleteria'
                ? [
                    { texto: 'Pieza', activo: !!obra.piezasDesarrolladas },
                    { texto: 'Tiquetera', activo: !!obra.fechaTiquetera },
                    { texto: 'Redes', activo: !!obra.fechaRedes },
                    { texto: 'Video', activo: !!obra.videoDisponible },
                    { texto: 'Pauta', activo: !!obra.fechaPauta }
                  ]
                : [
                    { texto: 'Pieza', activo: !!obra.piezasDesarrolladas },
                    { texto: 'Link', activo: !!obra.linkRegistro },
                    { texto: 'Redes', activo: !!obra.fechaRedes }
                  ];
            const GAP = 4;
            items.forEach(item => { item.ancho = item.texto.length * 6 + 14; });
            const anchoTotal = items.reduce((s, it) => s + it.ancho, 0) + GAP * (items.length - 1);
            const alto = 20;
            registroIconosPendientes.push({ id, items, ancho: anchoTotal, alto, gap: GAP });
            return '<canvas id="' + id + '" width="' + anchoTotal + '" height="' + alto + '" style="display:inline-block; vertical-align:middle;"></canvas>';
        }

        function dibujarIconosPendientesEnCanvas() {
            const FACTOR = 3;
            registroIconosPendientes.forEach(reg => {
                const canvas = document.getElementById(reg.id);
                if (!canvas) return;
                canvas.width = reg.ancho * FACTOR;
                canvas.height = reg.alto * FACTOR;
                canvas.style.width = reg.ancho + 'px';
                canvas.style.height = reg.alto + 'px';
                const ctx = canvas.getContext('2d');
                ctx.scale(FACTOR, FACTOR);
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let x = 0;
                reg.items.forEach(item => {
                    const r = 3;
                    const w = item.ancho, h = reg.alto;
                    ctx.fillStyle = item.activo ? '#3B82F6' : '#BFBFBF';
                    ctx.beginPath();
                    ctx.moveTo(x + r, 0);
                    ctx.arcTo(x + w, 0, x + w, h, r);
                    ctx.arcTo(x + w, h, x, h, r);
                    ctx.arcTo(x, h, x, 0, r);
                    ctx.arcTo(x, 0, x + w, 0, r);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(item.texto, x + w / 2, h / 2 + 1);

                    x += w + reg.gap;
                });
            });
            registroIconosPendientes = [];
        }

        function formatearMetricaFuncion(tipoObra, numerador, denominador) {
            const pct = denominador > 0 ? Math.round((numerador / denominador) * 100) : 0;
            if (tipoObra === 'boleteria') {
                return { texto: numerador + '/' + denominador, valor: pct + '%', pct };
            }
            return { texto: numerador + '/' + denominador, valor: pct + '%', pct };
        }

        function esSalaLlena(tipoObra, pct) {
            return tipoObra === 'boleteria' && pct >= 100;
        }

        function construirMesesReporte() {
            const alcance = tipoDeTrabajo();
            const obrasActivas = appState.obras.filter(o => puedeVerObra(o) && !obraEstaFinalizada(o) && (!alcance || o.tipo === alcance));
            const mesesMap = {};
            const ordenMeses = [];

            obrasActivas.forEach(obra => {
                const sala = getSala(obra.salaId);
                const funciones = getFuncionesObra(obra.id);
                if (funciones.length === 0) return;

                const primera = new Date(funciones[0].fecha + 'T00:00:00');
                const mesKey = primera.getFullYear() + '-' + String(primera.getMonth() + 1).padStart(2, '0');
                const mesLabel = MESES_REPORTE[primera.getMonth()] + ' ' + primera.getFullYear();

                const agrupador = appState.agrupadores.find(a => a.id === obra.agrupadorId);
                const agrupadorNombre = agrupador ? agrupador.nombre : 'Obras individuales';

                if (!mesesMap[mesKey]) {
                    mesesMap[mesKey] = { mesKey, mesLabel, temporadas: {}, ordenTemporadas: [] };
                    ordenMeses.push(mesKey);
                }
                const mesObj = mesesMap[mesKey];
                if (!mesObj.temporadas[agrupadorNombre]) {
                    mesObj.temporadas[agrupadorNombre] = { nombre: agrupadorNombre, obras: [] };
                    mesObj.ordenTemporadas.push(agrupadorNombre);
                }

                const funcionesConMetrica = funciones.map(f => {
                    let numerador, denominador;
                    if (obra.tipo === 'boleteria') {
                        numerador = f.ventasAcumuladas || 0;
                        denominador = Math.max(1, getAforo(obra) - (f.cortesias || 0));
                    } else {
                        numerador = f.registrados || 0;
                        denominador = getAforo(obra);
                    }
                    const m = formatearMetricaFuncion(obra.tipo, numerador, denominador);
                    return { fecha: f.fecha, hora: f.hora, numerador, denominador, pct: m.pct, valor: m.valor, texto: m.texto };
                });

                mesObj.temporadas[agrupadorNombre].obras.push({
                    obraId: obra.id,
                    icono: obra.tipo === 'boleteria' ? '💵' : '🎟️',
                    nombre: obra.nombre,
                    sala: sala?.nombre || '',
                    agrupadorNombre: agrupadorNombre,
                    tipoObra: obra.tipo,
                    obra: obra,
                    funciones: funcionesConMetrica
                });
            });

            const ordenAgrupadoresGlobal = appState.agrupadores.map(a => a.nombre).concat(['Obras individuales']);

            return ordenMeses.slice().sort().map(mk => {
                const mesObj = mesesMap[mk];
                const temporadasOrdenadas = mesObj.ordenTemporadas.slice().sort((a, b) =>
                    ordenAgrupadoresGlobal.indexOf(a) - ordenAgrupadoresGlobal.indexOf(b)
                );
                return {
                    mesKey: mesObj.mesKey,
                    mesLabel: mesObj.mesLabel,
                    temporadas: temporadasOrdenadas.map(nombreTemp => {
                        const t = mesObj.temporadas[nombreTemp];
                        t.obras.sort((a, b) => {
                            if (a.tipoObra !== b.tipoObra) return a.tipoObra === 'boleteria' ? -1 : 1;
                            return (a.funciones[0].fecha + a.funciones[0].hora).localeCompare(b.funciones[0].fecha + b.funciones[0].hora);
                        });
                        return t;
                    })
                };
            });
        }

        const REPORTE_ALTO_TEMPORADA = 40;
        const REPORTE_ALTO_OBRA_HEADER = 92;
        const REPORTE_ALTO_FUNCION_SIMPLE = 46;
        const REPORTE_ALTO_SUBTOTAL_SIMPLE = 42;

        function alturaObraReporte(obraItem) {
            const n = obraItem.funciones.length;
            return REPORTE_ALTO_OBRA_HEADER + (n * REPORTE_ALTO_FUNCION_SIMPLE) + (n > 1 ? REPORTE_ALTO_SUBTOTAL_SIMPLE : 0);
        }

        function alturaMesBloque(mes) {
            const columnas = dividirEnColumnas(mes.temporadas, 3);
            const alturas = columnas.map(col => col.reduce((s, seg) => s + seg.altura, 0));
            return REPORTE_ALTO_MES + Math.max(...alturas);
        }

        function dividirEnColumnas(temporadas, numColumnas) {
            const segmentos = [];
            temporadas.forEach(t => {
                segmentos.push({ tipo: 'temporada', nombre: t.nombre, altura: REPORTE_ALTO_TEMPORADA });
                t.obras.forEach(o => {
                    segmentos.push({ tipo: 'obra', obraItem: o, altura: alturaObraReporte(o) });
                });
            });
            const alturaTotal = segmentos.reduce((s, seg) => s + seg.altura, 0);
            const objetivoPorColumna = alturaTotal / numColumnas;

            const columnas = Array.from({ length: numColumnas }, () => []);
            let colActual = 0;
            let acumuladoColActual = 0;
            segmentos.forEach(seg => {
                const quedanColumnas = colActual < numColumnas - 1;
                if (quedanColumnas && acumuladoColActual >= objetivoPorColumna && seg.tipo !== 'temporada') {
                    colActual++;
                    acumuladoColActual = 0;
                }
                columnas[colActual].push(seg);
                acumuladoColActual += seg.altura;
            });
            return columnas;
        }

        // Llena la página 1 al máximo antes de pasar a la siguiente
        function paginarMeses(meses, disponiblePx) {
            if (meses.length === 0) return [[]];
            const paginas = [];
            let actual = [];
            let alturaAcumulada = 0;
            meses.forEach(mes => {
                const h = alturaMesBloque(mes);
                if ((alturaAcumulada + h) > disponiblePx && actual.length > 0) {
                    paginas.push(actual);
                    actual = [];
                    alturaAcumulada = 0;
                }
                actual.push(mes);
                alturaAcumulada += h;
            });
            if (actual.length > 0) paginas.push(actual);
            return paginas.length > 0 ? paginas : [[]];
        }

        function renderObraReporteHTML(obraItem) {
            let html = '<div style="padding:10px 4px 12px; border-bottom:1px solid #e5e7eb;">';
            html += '<div style="font-size:19px; color:#111827; white-space:nowrap;">' + obraItem.icono + ' ' + truncarTexto(obraItem.nombre, 30) + '</div>';
            html += '<div style="font-size:12px; color:#6b7280; margin-top:3px; white-space:nowrap;">' + truncarTexto(obraItem.sala, 16) + ' · ' + truncarTexto(obraItem.agrupadorNombre, 20) + '</div>';
            html += '<div style="margin-top:6px;">' + renderIconosEstadoReporte(obraItem.obra) + '</div>';

            obraItem.funciones.forEach(f => {
                html += '<div style="display:flex; align-items:center; justify-content:space-between; padding:6px 6px 6px 4px; margin-top:6px;">';
                html += '<div style="font-size:14px; color:#374151;">' + formatearFecha(f.fecha) + ' ' + f.hora + '</div>';
                html += '<div style="display:flex; align-items:center; gap:4px;">';
                if (esSalaLlena(obraItem.tipoObra, f.pct)) html += renderBadgePct(f.pct, '🎉 LLENA');
                html += renderBadgePct(f.pct, f.valor);
                html += '</div></div>';
            });

            if (obraItem.funciones.length > 1) {
                const sumaNum = obraItem.funciones.reduce((s, f) => s + f.numerador, 0);
                const sumaDen = obraItem.funciones.reduce((s, f) => s + f.denominador, 0);
                const mTotal = formatearMetricaFuncion(obraItem.tipoObra, sumaNum, sumaDen);
                html += '<div style="display:flex; align-items:center; justify-content:space-between; padding:6px 6px; margin-top:4px; background:#BFBFBF; border-radius:4px;">';
                html += '<span style="font-size:12px; font-weight:bold; color:#374151;">Total</span>';
                html += '<div style="display:flex; align-items:center; gap:4px;">';
                if (esSalaLlena(obraItem.tipoObra, mTotal.pct)) html += renderBadgePct(mTotal.pct, '🎉 LLENA');
                html += renderBadgePct(mTotal.pct, mTotal.valor);
                html += '</div></div>';
            }
            html += '</div>';
            return html;
        }

        function renderSegmentoReporteHTML(seg) {
            if (seg.tipo === 'temporada') {
                return '<div style="font-size:14px; font-weight:bold; color:#4b5563; padding:8px 2px 4px; text-transform:uppercase; letter-spacing:0.3px;">' + truncarTexto(seg.nombre, 28) + '</div>';
            }
            return renderObraReporteHTML(seg.obraItem);
        }

        function renderMesBloqueHTML(mesBloque) {
            let html = '<div style="font-size:22px; font-weight:bold; color:#ffffff; background:#808080; padding:10px 12px; margin-top:8px; margin-bottom:4px; border-radius:6px;">📅 ' + mesBloque.mesLabel + '</div>';
            const columnas = dividirEnColumnas(mesBloque.temporadas, 3);
            html += '<div style="display:table; width:100%; table-layout:fixed;">';
            html += '<div style="display:table-row;">';
            columnas.forEach((col, idx) => {
                html += '<div style="display:table-cell; width:31.3%; vertical-align:top; padding:0 8px;">';
                col.forEach(seg => { html += renderSegmentoReporteHTML(seg); });
                html += '</div>';
                if (idx < columnas.length - 1) html += '<div style="display:table-cell; width:1%; vertical-align:top;"><div style="width:2px; background:#d1d5db; height:100%; margin:0 auto;">&nbsp;</div></div>';
            });
            html += '</div></div>';
            return html;
        }


        const REPORTE_ALTO_RESUMEN = 150;

        function calcularResumenGeneralReporte() {
            const alcance = tipoDeTrabajo();
            const obrasActivas = appState.obras.filter(o => puedeVerObra(o) && !obraEstaFinalizada(o) && (!alcance || o.tipo === alcance));
            let ventas = 0, disponibleB = 0, registrados = 0, aforoE = 0;
            obrasActivas.forEach(obra => {
                const sala = getSala(obra.salaId);
                getFuncionesObra(obra.id).forEach(f => {
                    if (obra.tipo === 'boleteria') {
                        ventas += f.ventasAcumuladas || 0;
                        disponibleB += Math.max(0, getAforo(obra) - (f.cortesias || 0));
                    } else {
                        registrados += f.registrados || 0;
                        aforoE += getAforo(obra);
                    }
                });
            });
            return {
                ventas, porVender: Math.max(0, disponibleB - ventas),
                pctB: disponibleB > 0 ? Math.round((ventas / disponibleB) * 100) : 0,
                registrados, porOcupar: Math.max(0, aforoE - registrados),
                pctE: aforoE > 0 ? Math.round((registrados / aforoE) * 100) : 0
            };
        }

        function renderDonaSVG(valor, total, color, size) {
            const pct = total > 0 ? Math.min(1, valor / total) : 0;
            const radio = size / 2 - 8;
            const cx = size / 2, cy = size / 2;
            const circunferencia = 2 * Math.PI * radio;
            const offset = circunferencia * (1 - pct);
            return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
                '<circle cx="' + cx + '" cy="' + cy + '" r="' + radio + '" fill="none" stroke="#e5e7eb" stroke-width="9"/>' +
                (pct > 0 ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + radio + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-dasharray="' + circunferencia.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" stroke-linecap="round"/>' : '') +
                '</svg>';
        }

        function renderResumenGeneralReporteHTML() {
            const r = calcularResumenGeneralReporte();
            const alcanceResumen = tipoDeTrabajo();
            const muestraB = !alcanceResumen || alcanceResumen === 'boleteria';
            const muestraE = !alcanceResumen || alcanceResumen === 'entrada_libre';
            // Con un solo tipo la tarjeta ocupa todo el ancho en vez de dejar un hueco
            const anchoCelda = (muestraB && muestraE) ? '48%' : '100%';
            let html = '<div style="display:table; width:100%; table-layout:fixed; margin-bottom:14px; padding-bottom:14px; border-bottom:2px solid #e5e7eb;">';
            html += '<div style="display:table-row;">';
            if (muestraB) {
            html += '<div style="display:table-cell; width:' + anchoCelda + '; padding-right:' + (muestraE ? '8px' : '0') + ';"><div style="background:#f9fafb; border-radius:6px; padding:10px 12px; display:flex; align-items:center; gap:10px;">';
            html += renderDonaSVG(r.ventas, r.ventas + r.porVender, '#16A34A', 56);
            html += '<div style="min-width:0;">';
            html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"><span style="font-size:14px; font-weight:bold; color:#374151;">💵 Boletería</span>' + renderBadgePct(r.pctB, r.pctB + '%') + '</div>';
            html += '<div style="font-size:13px; color:#374151; white-space:nowrap;"><strong style="color:#16A34A;">' + r.ventas + '</strong> vendidas · <strong>' + r.porVender + '</strong> por vender</div>';
            html += '</div></div></div>';
            }
            if (muestraE) {
            html += '<div style="display:table-cell; width:' + anchoCelda + '; padding-left:' + (muestraB ? '8px' : '0') + ';"><div style="background:#f9fafb; border-radius:6px; padding:10px 12px; display:flex; align-items:center; gap:10px;">';
            html += renderDonaSVG(r.registrados, r.registrados + r.porOcupar, '#7c3aed', 56);
            html += '<div style="min-width:0;">';
            html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"><span style="font-size:14px; font-weight:bold; color:#374151;">🎟️ Entrada Libre</span>' + renderBadgePct(r.pctE, r.pctE + '%') + '</div>';
            html += '<div style="font-size:13px; color:#374151; white-space:nowrap;"><strong style="color:#7c3aed;">' + r.registrados + '</strong> registradas · <strong>' + r.porOcupar + '</strong> por ocupar</div>';
            html += '</div></div></div>';
            }
            html += '</div></div>';
            return html;
        }

        function alturaRealPagina(paginaMeses, esPrimeraPagina) {
            const alturaContenido = paginaMeses.reduce((s, m) => s + alturaMesBloque(m), 0);
            const alturaResumen = esPrimeraPagina ? REPORTE_ALTO_RESUMEN : 0;
            const total = REPORTE_ALTO_HEADER + alturaResumen + alturaContenido + (REPORTE_PADDING * 2) + 20;
            // Nunca recorta contenido: si un mes por sí solo necesita más espacio
            // del ideal (1920), la imagen crece en vez de cortar texto.
            return Math.max(400, total);
        }

        function renderPaginaReporteHTML(paginaMeses, numPagina, totalPaginas, altoPagina) {
            let html = '<div style="background:white; padding:' + REPORTE_PADDING + 'px; width:' + REPORTE_ANCHO + 'px; height:' + altoPagina + 'px; font-family: Arial, sans-serif; box-sizing:border-box; overflow:hidden;">';
            html += '<div style="display:table; width:100%; margin-bottom:10px; border-bottom:3px solid #1f2937; padding-bottom:8px;">';
            html += '<div style="display:table-cell; font-size:20px; font-weight:bold; color:#111827; vertical-align:bottom;">🎭 Salas Llenas — Avance</div>';
            html += '<div style="display:table-cell; text-align:right; vertical-align:bottom;">';
            html += '<div style="font-size:30px; font-weight:bold; color:#111827;">' + formatearFecha(new Date().toISOString().split('T')[0]) + '</div>';
            if (totalPaginas > 1) html += '<div style="font-size:16px; font-weight:bold; color:#374151; margin-top:2px;">Página ' + numPagina + ' de ' + totalPaginas + '</div>';
            html += '</div></div>';
            if (numPagina === 1) html += renderResumenGeneralReporteHTML();
            paginaMeses.forEach(mes => { html += renderMesBloqueHTML(mes); });
            html += '</div>';
            return html;
        }

        function flatItemsDesdeMeses(meses) {
            const items = [];
            meses.forEach(mes => {
                items.push({ tipo: 'mes', label: mes.mesLabel });
                mes.temporadas.forEach(temporada => {
                    items.push({ tipo: 'subtipo', label: temporada.nombre });
                    temporada.obras.forEach(obraItem => {
                        obraItem.funciones.forEach(f => {
                            items.push({
                                tipo: 'funcion', icono: obraItem.icono, nombre: obraItem.nombre, sala: obraItem.sala,
                                fecha: f.fecha, hora: f.hora, metricaTexto: f.texto, metricaValor: f.valor, metricaPct: f.pct
                            });
                        });
                    });
                });
            });
            return items;
        }

        function renderFilaReportePreviewHTML(item) {
            if (item.tipo === 'mes') {
                return '<div style="font-size:13px; font-weight:bold; color:#374151; background:#f3f4f6; padding:6px 8px; margin-top:4px; margin-bottom:2px; border-radius:4px;">📅 ' + item.label + '</div>';

        // ---- Imagen adicional del reporte: tablas de requisitos pendientes ----
        // Se dibuja íntegramente con Canvas 2D (no html2canvas) porque las tablas
        // con CSS se interpretan distinto entre navegadores.
        function construirTablasRequisitos() {
            const alcanceHerramientas = tipoDeTrabajo();
            const activas = appState.obras.filter(o => puedeVerObra(o) && !obraEstaFinalizada(o) && (!alcanceHerramientas || o.tipo === alcanceHerramientas));

            const ordenarPorPendientes = (lista) => lista.sort((a, b) => {
                const faltaA = a.valores.some(v => !v) ? 1 : 0;
                const faltaB = b.valores.some(v => !v) ? 1 : 0;
                return faltaB - faltaA || a.nombre.localeCompare(b.nombre);
            });

            const boleteria = ordenarPorPendientes(activas.filter(o => o.tipo === 'boleteria')
                .map(o => ({
                    nombre: o.nombre,
                    valores: [!!o.piezasDesarrolladas, !!o.fechaTiquetera, !!o.fechaRedes, !!o.videoDisponible, !!o.fechaPauta]
                })));

            const entradaLibre = ordenarPorPendientes(activas.filter(o => o.tipo === 'entrada_libre')
                .map(o => ({
                    nombre: o.nombre,
                    valores: [!!o.piezasDesarrolladas, !!o.linkRegistro, !!o.fechaRedes]
                })));

            const alcance = tipoDeTrabajo();
            const secciones = [];
            if (!alcance || alcance === 'boleteria') {
                secciones.push({ titulo: '\uD83D\uDCB5 Boletería', columnas: ['Pieza', 'Tiquetera', 'Redes', 'Video', 'Pauta'], filas: boleteria });
            }
            if (!alcance || alcance === 'entrada_libre') {
                secciones.push({ titulo: '\uD83C\uDF9F\uFE0F Entrada Libre', columnas: ['Pieza', 'Link', 'Redes'], filas: entradaLibre });
            }
            return secciones;
        }

        function envolverTextoCanvas(ctx, texto, anchoMax, maxLineas) {
            const palabras = String(texto).split(' ');
            const lineas = [];
            let actual = '';
            palabras.forEach(pal => {
                const prueba = actual ? actual + ' ' + pal : pal;
                if (ctx.measureText(prueba).width <= anchoMax || !actual) {
                    actual = prueba;
                } else {
                    lineas.push(actual);
                    actual = pal;
                }
            });
            if (actual) lineas.push(actual);
            if (lineas.length > maxLineas) {
                const recortadas = lineas.slice(0, maxLineas);
                let ultima = recortadas[maxLineas - 1];
                while (ultima.length > 3 && ctx.measureText(ultima + '…').width > anchoMax) {
                    ultima = ultima.slice(0, -1);
                }
                recortadas[maxLineas - 1] = ultima + '…';
                return recortadas;
            }
            return lineas;
        }

        function generarImagenRequisitos() {
            const secciones = construirTablasRequisitos().filter(sec => sec.filas.length > 0);
            if (secciones.length === 0) return null;

            const FACTOR = 3;
            const ANCHO = REPORTE_ANCHO;
            const PAD = 40;
            const ANCHO_NOMBRE = 430;
            const ALTO_FILA_BASE = 46;
            const ALTO_ENCABEZADO_TABLA = 44;
            const ALTO_TITULO_SECCION = 52;

            // Canvas de medición para calcular alturas antes de dibujar
            const medidor = document.createElement('canvas').getContext('2d');
            medidor.font = '20px Arial, sans-serif';

            let alto = PAD + 70;
            secciones.forEach(sec => {
                alto += ALTO_TITULO_SECCION + ALTO_ENCABEZADO_TABLA;
                sec.filas.forEach(fila => {
                    fila.lineas = envolverTextoCanvas(medidor, fila.nombre, ANCHO_NOMBRE - 20, 2);
                    fila.alto = Math.max(ALTO_FILA_BASE, 22 + fila.lineas.length * 26);
                    alto += fila.alto;
                });
                alto += 30;
            });
            alto += PAD;

            const canvas = document.createElement('canvas');
            canvas.width = ANCHO * FACTOR;
            canvas.height = alto * FACTOR;
            const ctx = canvas.getContext('2d');
            ctx.scale(FACTOR, FACTOR);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, ANCHO, alto);

            let y = PAD;

            ctx.fillStyle = '#111827';
            ctx.font = 'bold 30px Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('\uD83D\uDCCB Herramientas de mercadeo y comunicaciones', PAD, y + 30);

            ctx.fillStyle = '#6B7280';
            ctx.font = '18px Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(formatearFecha(new Date().toISOString().split('T')[0]), ANCHO - PAD, y + 30);
            y += 70;

            secciones.forEach(sec => {
                ctx.textAlign = 'left';
                ctx.fillStyle = '#111827';
                ctx.font = 'bold 24px Arial, sans-serif';
                ctx.fillText(sec.titulo, PAD, y + 30);
                y += ALTO_TITULO_SECCION;

                const anchoColumnas = (ANCHO - PAD * 2 - ANCHO_NOMBRE) / sec.columnas.length;

                ctx.fillStyle = '#374151';
                ctx.font = 'bold 19px Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('Obra', PAD + 10, y + 28);
                ctx.textAlign = 'center';
                sec.columnas.forEach((col, i) => {
                    ctx.fillText(col, PAD + ANCHO_NOMBRE + anchoColumnas * i + anchoColumnas / 2, y + 28);
                });
                y += ALTO_ENCABEZADO_TABLA;

                ctx.strokeStyle = '#D1D5DB';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(PAD, y);
                ctx.lineTo(ANCHO - PAD, y);
                ctx.stroke();

                sec.filas.forEach((fila, idx) => {
                    if (idx % 2 === 1) {
                        ctx.fillStyle = '#F9FAFB';
                        ctx.fillRect(PAD, y, ANCHO - PAD * 2, fila.alto);
                    }

                    ctx.fillStyle = '#111827';
                    ctx.font = '20px Arial, sans-serif';
                    ctx.textAlign = 'left';
                    const yTexto = y + (fila.alto - fila.lineas.length * 26) / 2 + 20;
                    fila.lineas.forEach((linea, li) => {
                        ctx.fillText(linea, PAD + 10, yTexto + li * 26);
                    });

                    fila.valores.forEach((ok, i) => {
                        ctx.fillStyle = ok ? '#16A34A' : '#DC2626';
                        ctx.beginPath();
                        ctx.arc(
                            PAD + ANCHO_NOMBRE + anchoColumnas * i + anchoColumnas / 2,
                            y + fila.alto / 2,
                            9, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    y += fila.alto;
                    ctx.strokeStyle = '#E5E7EB';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(PAD, y);
                    ctx.lineTo(ANCHO - PAD, y);
                    ctx.stroke();
                });

                y += 30;
            });

            return {
                dataUrl: canvas.toDataURL('image/png'),
                etiqueta: 'Herramientas de mercadeo y comunicaciones',
                nombreArchivo: 'herramientas-mercadeo-cna-' + fechaParaArchivo() + '.png'
            };
        }

        // ---- Reporte de acciones de mercadeo y comunicaciones ----
        function construirReporteAcciones() {
            const alcance = tipoDeTrabajo();
            const obrasVisibles = appState.obras.filter(o => puedeVerObra(o) && (!alcance || o.tipo === alcance));
            const grupos = [];
            obrasVisibles.forEach(obra => {
                const acciones = getAccionesObra(obra.id)
                    .slice()
                    .sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
                if (acciones.length === 0) return;
                grupos.push({
                    obra: obra.nombre,
                    tipoTexto: obra.tipo === 'boleteria' ? 'Boletería' : 'Entrada Libre',
                    acciones: acciones
                });
            });
            return grupos.sort((a, b) => a.obra.localeCompare(b.obra));
        }

        function generarImagenAcciones() {
            const grupos = construirReporteAcciones();
            if (grupos.length === 0) return null;

            const FACTOR = 3;
            const ANCHO = REPORTE_ANCHO;
            const PAD = 40;
            const X_FECHA = PAD + 10;
            const ANCHO_FECHA = 110;
            const X_DESC = X_FECHA + ANCHO_FECHA;
            const ANCHO_ESTADO = 110;
            const ANCHO_DESC = ANCHO - PAD - X_DESC - ANCHO_ESTADO - 10;

            const medidor = document.createElement('canvas').getContext('2d');

            let alto = PAD + 70;
            grupos.forEach(g => {
                alto += 42;
                g.acciones.forEach(a => {
                    medidor.font = '19px Arial, sans-serif';
                    a.lineas = envolverTextoCanvas(medidor, a.descripcion, ANCHO_DESC, 2);
                    a.alto = Math.max(48, 20 + a.lineas.length * 24 + 20);
                    alto += a.alto;
                });
                alto += 16;
            });
            alto += PAD;

            const canvas = document.createElement('canvas');
            canvas.width = ANCHO * FACTOR;
            canvas.height = alto * FACTOR;
            const ctx = canvas.getContext('2d');
            ctx.scale(FACTOR, FACTOR);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, ANCHO, alto);

            let y = PAD;
            ctx.fillStyle = '#111827';
            ctx.font = 'bold 30px Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('\uD83D\uDCE3 Acciones de Mercadeo y Comunicaciones', PAD, y + 30);
            ctx.fillStyle = '#6B7280';
            ctx.font = '18px Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(formatearFecha(new Date().toISOString().split('T')[0]), ANCHO - PAD, y + 30);
            y += 70;

            grupos.forEach(g => {
                ctx.textAlign = 'left';
                ctx.fillStyle = '#111827';
                ctx.font = 'bold 22px Arial, sans-serif';
                const meta = g.tipoTexto + ' · ' + g.acciones.length + ' acción(es)';
                const nombreObra = envolverTextoCanvas(ctx, g.obra, ANCHO - PAD * 2 - 220, 1)[0];
                ctx.fillText(nombreObra, PAD, y + 26);
                const anchoNombre = ctx.measureText(nombreObra).width;
                ctx.fillStyle = '#6B7280';
                ctx.font = '16px Arial, sans-serif';
                ctx.fillText(meta, PAD + anchoNombre + 12, y + 26);
                y += 42;

                ctx.strokeStyle = '#D1D5DB';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(PAD, y);
                ctx.lineTo(ANCHO - PAD, y);
                ctx.stroke();

                g.acciones.forEach((a, idx) => {
                    if (idx % 2 === 1) {
                        ctx.fillStyle = '#F9FAFB';
                        ctx.fillRect(PAD, y, ANCHO - PAD * 2, a.alto);
                    }

                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#6B7280';
                    ctx.font = '17px Arial, sans-serif';
                    ctx.fillText(formatearFecha(a.fecha), X_FECHA, y + 28);

                    ctx.fillStyle = '#111827';
                    ctx.font = '19px Arial, sans-serif';
                    a.lineas.forEach((linea, li) => {
                        ctx.fillText(linea, X_DESC, y + 28 + li * 24);
                    });

                    ctx.fillStyle = '#6B7280';
                    ctx.font = '15px Arial, sans-serif';
                    ctx.fillText(a.usuario || '', X_DESC, y + 28 + a.lineas.length * 24);

                    ctx.textAlign = 'right';
                    ctx.font = 'bold 16px Arial, sans-serif';
                    ctx.fillStyle = a.hecho ? '#16A34A' : '#EA580C';
                    ctx.fillText(a.hecho ? 'Hecha' : 'Pendiente', ANCHO - PAD - 10, y + 28);

                    y += a.alto;
                    ctx.strokeStyle = '#E5E7EB';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(PAD, y);
                    ctx.lineTo(ANCHO - PAD, y);
                    ctx.stroke();
                });

                y += 16;
            });

            return {
                dataUrl: canvas.toDataURL('image/png'),
                etiqueta: 'Acciones de mercadeo y comunicaciones',
                nombreArchivo: 'acciones-mercadeo-cna-' + fechaParaArchivo() + '.png'
            };
        }

        async function descargarReportePNG() {
            if (!window.html2canvas) {
                alert('⚠️ No se pudo generar la imagen. Recarga la página e intenta de nuevo.');
                return;
            }

            const meses = construirMesesReporte();
            const totalFunciones = meses.reduce((s, m) => s + m.temporadas.reduce((s2, t) => s2 + t.obras.reduce((s3, o) => s3 + o.funciones.length, 0), 0), 0);
            if (totalFunciones === 0) {
                alert('⚠️ No hay funciones activas para incluir en el reporte.');
                return;
            }

            const disponible = REPORTE_ALTO_TOTAL - (REPORTE_PADDING * 2) - REPORTE_ALTO_HEADER;
            const paginas = paginarMeses(meses, disponible);
            const fecha = new Date().toISOString().split('T')[0];

            const btn = document.querySelector('button[onclick="descargarReportePNG()"]');
            const hayRequisitos = construirTablasRequisitos().some(sec => sec.filas.length > 0);
            const hayAcciones = construirReporteAcciones().length > 0;
            const totalImagenes = paginas.length + (hayRequisitos ? 1 : 0) + (hayAcciones ? 1 : 0);
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Generando ' + totalImagenes + ' imagen(es)...'; }

            const generadas = [];
            for (let i = 0; i < paginas.length; i++) {
                const altoPagina = alturaRealPagina(paginas[i], i === 0);
                const pagina = document.createElement('div');
                pagina.style.cssText = 'position:fixed; top:-99999px; left:-99999px;';
                pagina.innerHTML = renderPaginaReporteHTML(paginas[i], i + 1, paginas.length, altoPagina);
                document.body.appendChild(pagina);
                dibujarBadgesPendientesEnCanvas();
                dibujarIconosPendientesEnCanvas();

                try {
                    const canvas = await html2canvas(pagina.firstElementChild, { backgroundColor: '#ffffff', scale: 3, width: REPORTE_ANCHO, height: altoPagina });
                    generadas.push({
                        dataUrl: canvas.toDataURL('image/png'),
                        etiqueta: paginas.length > 1 ? 'Reporte de avance — parte ' + (i + 1) : 'Reporte de avance',
                        nombreArchivo: 'reporte-avance-cna-' + fechaParaArchivo() + (paginas.length > 1 ? '-parte' + (i + 1) : '') + '.png'
                    });
                } catch (err) {
                    console.error(err);
                    alert('⚠️ Error generando la imagen ' + (i + 1));
                } finally {
                    document.body.removeChild(pagina);
                }
            }

            // Imagen final aparte con las tablas de requisitos pendientes
            try {
                const imgRequisitos = generarImagenRequisitos();
                if (imgRequisitos) generadas.push(imgRequisitos);
            } catch (err) {
                console.error('Error generando imagen de herramientas:', err);
            }

            // Imagen final aparte con las acciones de mercadeo y comunicaciones
            try {
                const imgAcciones = generarImagenAcciones();
                if (imgAcciones) generadas.push(imgAcciones);
            } catch (err) {
                console.error('Error generando imagen de acciones:', err);
            }

            if (btn) { btn.disabled = false; btn.textContent = '📥 Descargar PNG'; }

            // Los navegadores móviles bloquean descargas automáticas múltiples en
            // un mismo clic (solo dejan pasar la última). Por eso se muestran las
            // imágenes generadas con un botón de descarga individual cada una —
            // cada descarga real es un toque separado del usuario.
            appState.reportePaginasGeneradas = generadas;
            render();
            setTimeout(() => {
                const destino = document.getElementById('reportePaginasGeneradas');
                if (destino) destino.scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

                app.innerHTML = renderLogin();

                    case 'obras': app.innerHTML = renderObras(); break;

                        app.innerHTML = renderCrearObra();
                        setTimeout(() => { toggleCamposTipo(); updateFunctionsSectionDisplay(); }, 0);

                    case 'salas': app.innerHTML = renderSalas(); break;

                    case 'ventas': app.innerHTML = renderVentas(); break;
                    case 'entrada': app.innerHTML = renderEntrada(); break;

                dibujarBadgesPendientesEnCanvas();

                if (appState.showGraficoVentas) {

                    const tituloModal = (obraModal && obraModal.tipo === 'entrada_libre') ? '📊 Gráfico de Registros Diarios' : '📊 Gráfico de Ventas Diarias';
                    const modalHTML = '<div id="graficoModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">'
                        + '<div style="background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 900px; max-height: 80vh; overflow: auto; box-shadow: 0 20px 25px rgba(0,0,0,0.15);">'
                        + '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">'
                        + '<h3 style="margin: 0; font-size: 18px; font-weight: bold;">' + tituloModal + '</h3>'
                        + '<button onclick="cerrarGraficoVentas()" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0;">×</button>'
                        + '</div>'
                        + '<div style="position: relative; width: 100%; height: 400px;">'
                        + '<canvas id="chartVentas" width="800" height="400"></canvas>'
                        + '</div>'
                        + '</div>'
                        + '</div>';
                    app.innerHTML += modalHTML;
                }

                if (appState.showHistorialFuncion) {
                    const funcion = appState.funciones.find(f => f.id === appState.historialFuncionId);
                    const obraDeFuncion = funcion ? appState.obras.find(o => o.id === funcion.obraId) : null;
                    const registros = appState.historial
                        .filter(h => h.funcionId === appState.historialFuncionId)
                        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    let contenido = '';
                    if (registros.length === 0) {
                        contenido = '<p style="color:#6b7280; font-size:14px;">Sin cambios registrados para esta función todavía.</p>';
                    } else {
                        contenido = '<div style="display:flex; flex-direction:column; gap:10px;">';
                        registros.forEach(h => {
                            const fecha = new Date(h.timestamp);
                            const fechaFmt = formatearFecha(fecha.toISOString().split('T')[0]);
                            const horaFmt = fecha.toTimeString().slice(0, 5);
                            contenido += '<div style="background:#f9fafb; border-left:4px solid #f97316; padding:10px 12px; border-radius:4px;">';
                            contenido += '<p style="font-size:13px; font-weight:600; margin:0;">' + (h.accion || 'Cambio') + '</p>';
                            if (h.detalles) contenido += '<p style="font-size:12px; color:#4b5563; margin:2px 0 0;">' + h.detalles + '</p>';
                            contenido += '<p style="font-size:11px; color:#9ca3af; margin:4px 0 0;">' + fechaFmt + ' ' + horaFmt + ' — ' + (h.usuario || '') + '</p>';
                            contenido += '</div>';
                        });
                        contenido += '</div>';
                    }

                    const modalHistorial = '<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">'
                        + '<div style="background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 500px; max-height: 80vh; overflow: auto; box-shadow: 0 20px 25px rgba(0,0,0,0.15);">'
                        + '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">'
                        + '<h3 style="margin: 0; font-size: 16px; font-weight: bold;">🕐 Historial de la función' + (obraDeFuncion ? ' — ' + obraDeFuncion.nombre : '') + '</h3>'
                        + '<button onclick="cerrarHistorialFuncion()" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0;">×</button>'
                        + '</div>'
                        + contenido
                        + '</div>'
                        + '</div>';
                    app.innerHTML += modalHistorial;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('app').innerHTML = '<div class="min-h-screen flex items-center justify-center bg-gray-50"><p class="text-gray-500">Cargando datos...</p></div>';
            await initData();
            const savedUser = localStorage.getItem('boleteria-user');
            if (savedUser) appState.user = JSON.parse(savedUser);
            render();
        });
    </script>
</body>
</html>
